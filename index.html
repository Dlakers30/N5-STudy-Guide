      shuffleArr(mockPool("reading")).slice(0,MOCK_SIZES.reading).forEach(group=>group.forEach(x=>qs.push(Object.assign({part:k},x))));
    } else {
      shuffleArr(mockPool(k)).slice(0,MOCK_SIZES[k]).forEach(x=>qs.push(Object.assign({part:k},x)));
    }
  });
  qs.forEach(x=>{x.opts=shuffleArr([x.c].concat(x.w.slice(0,3)));});
  mockState={key:key,qs:qs,i:0,score:0,answered:false,misses:[],byPart:{}};
  MOCK_ORDER.forEach(k=>{mockState.byPart[k]={n:0,s:0};});
  renderMockQuestion();
}
function mockSpeakText(a){return a.replace(/[AB]：/g,"、");}
function renderMockQuestion(){
  const s=mockState;
  const it=s.qs[s.i];
  const div=document.getElementById("unit-mock");
  let html=`<div class="quiz-progress">${MOCK[it.part].title} - Question ${s.i+1} of ${s.qs.length} - Score ${s.score}</div>`;
  if(it.p)html+=`<div class="quiz-prompt-card" style="text-align:left"><div class="quiz-prompt-label">Read</div><div class="rd-text" style="font-size:17px">${furi(it.p)}</div></div>`;
  html+=`<div class="quiz-prompt-card">`;
  if(it.a)html+=`<div class="quiz-prompt-label">Listen (you can replay)</div><button class="quiz-start-btn" style="margin:0 0 12px" onclick="speak(mockSpeakText(mockState.qs[mockState.i].a))">&#9654; Play audio</button>`;
  const qHtml=it.p?furi(it.q):it.q.replace("（　）",'<span class="qz-blank">（　）</span>');
  html+=`<div class="quiz-prompt-main${it.part==="kanji"?" quiz-jp":" qz-fixed"}">${qHtml}</div>${it.h?`<div class="qz-hint">${it.h}</div>`:""}${it.qen?`<div class="qz-hint">${it.qen}</div>`:""}</div>
  <div class="quiz-options" id="mockOptions">`;
  it.opts.forEach((o,k)=>{html+=`<button class="quiz-option-btn${JP_RE.test(o)?" quiz-option-jp":""}" onclick="mockAnswer(${k})">${o}</button>`;});
  html+=`</div><div class="quiz-feedback" id="mockFeedback"></div><div id="mockNextWrap"></div>
  <button class="qz-quit" onclick="mockResults()">End test now</button>`;
  div.innerHTML=html;
  s.answered=false;
  if(it.a)setTimeout(()=>speak(mockSpeakText(it.a)),300);
}
function mockAnswer(k){
  const s=mockState;
  if(s.answered)return;
  s.answered=true;
  const it=s.qs[s.i];
  const ok=it.opts[k]===it.c;
  s.byPart[it.part].n++;
  if(ok){s.score++;s.byPart[it.part].s++;}
  else s.misses.push(it);
  document.querySelectorAll("#mockOptions .quiz-option-btn").forEach((b,idx)=>{
    b.classList.add("disabled");
    if(it.opts[idx]===it.c)b.classList.add("correct");
    else if(idx===k)b.classList.add("wrong");
  });
  document.getElementById("mockFeedback").innerHTML=(ok?`<div class="quiz-fb-good">Correct!</div>`:`<div class="quiz-fb-bad">Not quite.</div>`)+`<div class="quiz-fb-rom">${furi(it.e)}${it.a?"<br><span style='color:#888'>Audio: "+it.a+"</span>":""}</div>`;
  const last=s.i>=s.qs.length-1;
  document.getElementById("mockNextWrap").innerHTML=`<button class="quiz-next-btn" onclick="${last?"mockResults()":"mockNext()"}">${last?"See Results":"Next"}</button>`;
}
function mockResults(){
  const s=mockState;
  const asked=Object.values(s.byPart).reduce((n,b)=>n+b.n,0)||1;
  const pct=Math.round(s.score/asked*100);
  let html=`<div class="quiz-result-card"><div class="quiz-result-score">${s.score} / ${asked}</div><div class="quiz-result-pct">${pct}%</div>
  <div class="quiz-result-msg">${pct>=80?"Excellent - you are on track for N5.":pct>=70?"Solid. Review the misses below.":pct>=50?"Getting there. Focus on the weakest part.":"Keep studying - revisit the roadmap tasks for the weak parts."}</div>`;
  const parts=MOCK_ORDER.filter(k=>s.byPart[k].n);
  if(parts.length>1){
    const lk=["kanji","vocab","grammar","reading"].reduce((a,k)=>({n:a.n+s.byPart[k].n,s:a.s+s.byPart[k].s}),{n:0,s:0});
    const li=s.byPart.listening;
    const row=(label,b)=>{if(!b.n)return "";const p=Math.round(b.s/b.n*100);return `<div class="mk-row"><span>${label}</span><span class="mk-bar"><span style="width:${p}%;background:${p>=70?"#0F6E56":p>=32?"#BA7517":"#993C1D"}"></span></span><b>${p}%</b></div>`;};
    html+=`<div class="mk-break">`+parts.map(k=>row(MOCK[k].title.replace(/^Part \d: /,""),s.byPart[k])).join("")+`</div>`;
    if(lk.n&&li.n){
      const lp=Math.round(lk.s/lk.n*100),ip=Math.round(li.s/li.n*100);
      const pass=lp>=32&&ip>=32&&pct>=44;
      html+=`<div class="qz-avail" style="text-align:left;margin-top:12px">Language knowledge + reading: <b>${lp}%</b> &middot; Listening: <b>${ip}%</b><br>${pass?"Above the real pass lines (44% overall, 32% per section).":"Below a real pass line (44% overall, 32% per section) - focus on the lower section."}${pass&&pct<70?" Aim for 70% for a safe margin.":""}</div>`;
    }
  }
  if(s.misses.length){
    html+=`<div class="qz-miss-head">Review your misses</div>`;
    s.misses.forEach(m=>{html+=`<div class="qz-miss"><b>${m.a?"(audio) "+m.a:(m.p?furi(m.q):m.q)}</b><br>Answer: ${m.c}<br><span style="color:#888">${furi(m.e)}</span></div>`;});
  }
  html+=`<div class="quiz-result-buttons"><button class="quiz-start-btn" onclick="startMock('${s.key}')">New ${s.key==="full"?"full mock":"set"}</button><button class="quiz-secondary-btn" onclick="renderMockMenu()">Back to Mock Menu</button></div></div>`;
  document.getElementById("unit-mock").innerHTML=html;
}

// ═══════════════════════════════════════════════════════════════
// Spaced-repetition review
//  Every missed question (Quiz, Mock Test, Reading) joins the review
//  list. Each correct answer pushes it further out; a miss resets it.
// ═══════════════════════════════════════════════════════════════
const SRS_KEY="jpSRS";
const SRS_DAYS=[0,0,1,3,7,16,35];      // box -> days until next review
const SRS_MASTERED=5;                   // box reached = "mastered"
const SRS_SESSION=30;                   // questions per review session
const DAY_MS=86400000;
function srsLoad(){try{const o=JSON.parse(localStorage.getItem(SRS_KEY)||"{}");return o&&typeof o==="object"&&!Array.isArray(o)?o:{};}catch(e){return {};}}
function srsSave(o){try{localStorage.setItem(SRS_KEY,JSON.stringify(o));}catch(e){}}
function srsEntries(o){o=o||srsLoad();return Object.keys(o).filter(k=>k!=="_clearedAt").map(k=>Object.assign({key:k},o[k]));}
function srsRecord(key,correct){
  if(!key)return;
  const o=srsLoad(),now=Date.now();
  let e=o[key];
  if(!correct){
    o[key]={b:1,d:now,l:now,m:((e&&e.m)||0)+1};
  } else if(e){
    const b=Math.min((e.b||1)+1,SRS_DAYS.length-1);
    o[key]={b:b,d:now+SRS_DAYS[b]*DAY_MS,l:now,m:e.m||0};
  } else return; // correct and never missed: nothing to track
  srsSave(o);
}
function srsStats(){
  const now=Date.now(),es=srsEntries();
  const due=es.filter(e=>e.d<=now);
  const upcoming=es.filter(e=>e.d>now).sort((a,b)=>a.d-b.d);
  return {total:es.length,due:due.length,mastered:es.filter(e=>e.b>=SRS_MASTERED).length,learning:es.filter(e=>e.b<SRS_MASTERED).length,next:upcoming.length?upcoming[0].d:null};
}
let _srsIndex=null;
function srsIndex(){
  if(_srsIndex)return _srsIndex;
  const map={};
  quizTopicIds().forEach(id=>{if(id==="__starred"||id==="saved")return;topicItems(id).forEach(it=>{const k=itemKey(it);if(!map[k])map[k]=it;});});
  _srsIndex=map;return map;
}
function srsDueItems(limit){
  const now=Date.now(),idx=srsIndex();
  return srsEntries().filter(e=>e.d<=now).sort((a,b)=>a.d-b.d||a.b-b.b).map(e=>idx[e.key]).filter(Boolean).slice(0,limit||9999);
}
function fmtWhen(t){
  const days=Math.round((new Date(t).setHours(0,0,0,0)-new Date().setHours(0,0,0,0))/DAY_MS);
  if(days<=0)return "later today";if(days===1)return "tomorrow";
  return new Date(t).toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"});
}
function srsCardHtml(compact){
  const s=srsStats();
  if(!s.total)return compact?"":`<div class="srs-card empty"><div class="srs-title">Review list</div><div class="srs-text">Questions you miss in the Quiz, Mock Test or Reading tab will appear here and come back on a schedule until you know them.</div></div>`;
  const dueN=Math.min(s.due,SRS_SESSION);
  const bar=s.total?Math.round(s.mastered/s.total*100):0;
  return `<div class="srs-card${s.due?" due":""}">
    <div class="srs-title">${s.due?`${s.due} question${s.due>1?"s":""} due for review`:"Review: all caught up"}</div>
    <div class="srs-text">${s.due?"Questions you missed before, brought back right before you'd forget them.":`Next review ${s.next?fmtWhen(s.next):"-"}.`}</div>
    <div class="srs-stats"><span><b>${s.learning}</b> learning</span><span><b>${s.mastered}</b> mastered</span><span class="srs-bar"><span style="width:${bar}%"></span></span></div>
    ${s.due?`<button class="quiz-start-btn srs-go" onclick="${compact?"switchTab('quiz');":""}startReview()">Start review (${dueN}${s.due>dueN?" of "+s.due:""})</button>`:""}
    ${compact?"":`<button class="qz-quit" style="margin-top:8px" onclick="srsClear()">Clear review history</button>`}
  </div>`;
}
function startReview(){
  const items=srsDueItems(SRS_SESSION);
  if(!items.length){alert("Nothing is due right now. Nice work!");renderQuizTab();return;}
  startQuiz({topics:[],excl:{},dir:"mixed",count:"all",pool:items,only:items,label:"Review"});
  quizState.isReview=true;
  quizState.reviewStart=srsLoad();
}
function srsClear(){
  if(!confirm("Clear your whole review list? Questions you missed will stop coming back."))return;
  srsSave({_clearedAt:Date.now()});renderQuizTab();
}

(function(){

    } else if(qs.missed.length){
      note=`${qs.missed.length} missed question${qs.missed.length>1?"s were":" was"} added to your review list - they'll come back until you know them.`;
    }

// Record tab: pick or translate a sentence, listen, record yourself,
// compare with the model, save or delete. Takes live in IndexedDB
// on this device (audio is too large to sync).
// ═══════════════════════════════════════════════════════════════
const REC_MAX_SEC=30;
let rec={sel:null,topic:null,section:"",filter:"",sentencesOnly:true,shadow:false,
  stream:null,mr:null,chunks:[],take:null,timer:null,t0:0,meterRaf:null,ac:null,recording:false,countdown:null};

// ── storage (IndexedDB) ──
function recDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error("no_idb"));return;}
    const r=indexedDB.open("n5-recordings",1);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("takes")){const s=db.createObjectStore("takes",{keyPath:"id"});s.createIndex("jp","jp");}};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
async function recTx(mode,fn){
  const db=await recDB();
  return new Promise((res,rej)=>{const tx=db.transaction("takes",mode);const st=tx.objectStore("takes");let out;Promise.resolve(fn(st)).then(v=>{out=v;});tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);});
}
function recReq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function recSaveTake(t){return recTx("readwrite",st=>recReq(st.put(t)));}
async function recDeleteTake(id){return recTx("readwrite",st=>recReq(st.delete(id)));}
async function recAllTakes(){try{return (await recTx("readonly",st=>recReq(st.getAll())))||[];}catch(e){return [];}}

// ── sentence sources ──
function recSources(){
  const src=[];
  const have={};units.forEach(u=>{have[u.id]=u;});

function recItems(topicId){

function recPickMime(){

async function recToggle(){

    const fb=setTimeout(go,1500+rec.sel.jp.length*260); // backup if the voice never reports "finished"

async function recStart(){
  recDiscard(true);

    rec.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){
    recSetStatus(e&&e.name==="NotAllowedError"?"Microphone blocked - allow mic access for this site in your browser settings.":"No microphone found.");
    return;
  }
  const mime=recPickMime();
  try{rec.mr=new MediaRecorder(rec.stream,mime?{mimeType:mime}:undefined);}catch(e){rec.mr=new MediaRecorder(rec.stream);}
  rec.chunks=[];
  rec.mr.ondataavailable=e=>{if(e.data&&e.data.size)rec.chunks.push(e.data);};
  rec.mr.onstop=()=>{
    const type=(rec.mr&&rec.mr.mimeType)||mime||"audio/webm";
    const blob=new Blob(rec.chunks,{type:type});
    const dur=(Date.now()-rec.t0)/1000;
    recRelease();
    if(blob.size>0){rec.take={blob:blob,mime:type,dur:dur};}
    rec.recording=false;recRenderStage();
    if(rec.take)setTimeout(()=>recPlayTake(),150); // play it back straight away
  };
  rec.mr.start();
  rec.recording=true;rec.t0=Date.now();
  recRenderStage();
  rec.timer=setInterval(()=>{const s=(Date.now()-rec.t0)/1000;const t=document.getElementById("recTime");if(t)t.textContent=s.toFixed(1)+"s / "+REC_MAX_SEC+"s";if(s>=REC_MAX_SEC)recStop();},100);

}
function recMeter(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    rec.ac=new AC();const src=rec.ac.createMediaStreamSource(rec.stream);const an=rec.ac.createAnalyser();an.fftSize=512;src.connect(an);
    const buf=new Uint8Array(an.fftSize);
    const loop=()=>{an.getByteTimeDomainData(buf);let m=0;for(let i=0;i<buf.length;i++){m=Math.max(m,Math.abs(buf[i]-128));}const el=document.getElementById("recLevel");if(el)el.style.width=Math.min(100,m/64*100)+"%";rec.meterRaf=requestAnimationFrame(loop);};
    loop();
  }catch(e){}
}
function recStop(){
  clearInterval(rec.timer);
  if(rec.mr&&rec.mr.state!=="inactive")rec.mr.stop();else{recRelease();rec.recording=false;recRenderStage();}
}
function recRelease(){
  clearInterval(rec.timer);
  if(rec.meterRaf)cancelAnimationFrame(rec.meterRaf);rec.meterRaf=null;
  try{if(rec.ac)rec.ac.close();}catch(e){}rec.ac=null;
  if(rec.stream){rec.stream.getTracks().forEach(t=>t.stop());rec.stream=null;}
}

function escHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

function hasJapanese(s){return /[\u3040-\u30ff\u3400-\u9fff\uff66-\uff9f]/.test(s);}
function hasKanji(s){return /[\u3400-\u9fff]/.test(s);}

// Kana -> romaji (used as a fallback when the translator returns no romaji)
const KANA_BASE={
  "あ":"a","い":"i","う":"u","え":"e","お":"o",
  "か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",
  "が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go",
  "さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",
  "ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo",
  "た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",
  "だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do",
  "な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",
  "は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho",
  "ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",
  "ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po",
  "ま":"ma","み":"mi","む":"mu","め":"me","も":"mo",
  "や":"ya","ゆ":"yu","よ":"yo",
  "ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro",
  "わ":"wa","を":"wo","ん":"n","ゔ":"vu",
  "ぁ":"a","ぃ":"i","ぅ":"u","ぇ":"e","ぉ":"o",
  "。":". ","、":", ","？":"?","！":"!","　":" ","「":"\"","」":"\""
};
const SMALL_Y={"ゃ":"a","ゅ":"u","ょ":"o"};
function kanaToRomaji(str){
  // convert katakana to hiragana first
  let s="";
  for(const ch of str){
    const code=ch.charCodeAt(0);
    s+=(code>=0x30A1&&code<=0x30F6)?String.fromCharCode(code-0x60):ch;
  }
  let out="",doubleNext=false;
  const chars=[...s];
  for(let i=0;i<chars.length;i++){
    const ch=chars[i],next=chars[i+1];
    if(ch==="っ"){doubleNext=true;continue;}
    if(ch==="ー"){const m=out.match(/[aeiou](?=[^aeiou]*$)/);out+=m?m[0]:"";continue;}
    let r=KANA_BASE[ch];
    if(r===undefined){out+=ch;doubleNext=false;continue;}
    if(next && SMALL_Y[next] && r.endsWith("i") && r.length>1){
      if(r==="shi")r="sh"+SMALL_Y[next];
      else if(r==="chi")r="ch"+SMALL_Y[next];
      else if(r==="ji")r="j"+SMALL_Y[next];
      else r=r.slice(0,-1)+"y"+SMALL_Y[next];
      i++;
    }
    if(doubleNext){out+=(r.startsWith("ch")?"t":r[0]);doubleNext=false;}
    out+=r;
  }
  return out.replace(/\s+/g," ").trim();
}

async function fetchWithTimeout(url,ms){
  const ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  const t=setTimeout(()=>{if(ctrl)ctrl.abort();},ms);
  try{return await fetch(url,ctrl?{signal:ctrl.signal}:{});}
  finally{clearTimeout(t);}
}
async function translateViaGoogle(text,sl,tl){
  const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+sl+"&tl="+tl+"&dt=t&dt=rm&q="+encodeURIComponent(text);
  const res=await fetchWithTimeout(url,8000);
  if(!res.ok)throw new Error("google "+res.status);
  const data=await res.json();
  const segs=(data&&data[0])||[];
  let translated="",targetRom="",sourceRom="";
  segs.forEach(s=>{
    if(!Array.isArray(s))return;
    if(s[0])translated+=s[0];
    else{if(s[2])targetRom=s[2];if(s[3])sourceRom=s[3];}
  });
  if(!translated)throw new Error("empty");
  return {translated,targetRom,sourceRom};
}
async function translateViaMyMemory(text,sl,tl){
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+sl+"|"+tl;
  const res=await fetchWithTimeout(url,8000);
  if(!res.ok)throw new Error("mymemory "+res.status);
  const data=await res.json();
  const t=data&&data.responseData&&data.responseData.translatedText;
  if(!t)throw new Error("empty");
  return {translated:t,targetRom:"",sourceRom:""};
}

let currentTranslation=null;
let translateRequestId=0;

function renderTranslateTab(){
  const div=document.getElementById("unit-translate");
  if(!div)return;
  div.innerHTML=`<div class="unit-title">Translate</div>
    <div class="unit-sub">Type English or Japanese - it detects which automatically. Save anything useful to your Saved Phrases.</div>
    <div class="tr-card">
      <textarea id="trInput" class="tr-input" rows="3" maxlength="500" placeholder="e.g. Where is the nearest convenience store?" oninput="updateTrDirection()" onkeydown="trKeydown(event)"></textarea>
      <div class="tr-row">
        <span class="tr-dir" id="trDir">English &rarr; Japanese</span>
        <button id="trBtn" class="tr-btn" onclick="runTranslate()">Translate</button>
      </div>
    </div>
    <div id="trResult"></div>
    <div class="tr-disclaimer">Needs an internet connection. Machine translation isn't perfect - for anything important (allergies, medical, directions to your hotel), double-check with a person or show them the screen.</div>`;
}
function updateTrDirection(){
  const v=document.getElementById("trInput").value;
  document.getElementById("trDir").innerHTML=hasJapanese(v)?"Japanese &rarr; English":"English &rarr; Japanese";
}
function trKeydown(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();runTranslate();}
}
async function runTranslate(){
  const input=document.getElementById("trInput");
  const out=document.getElementById("trResult");
  const btn=document.getElementById("trBtn");
  const text=input.value.trim();
  if(!text){out.innerHTML="";return;}
  if(typeof navigator!=="undefined"&&navigator.onLine===false){
    out.innerHTML='<div class="tr-error">You appear to be offline. Translation needs internet - your Saved Phrases still work offline.</div>';
    return;
  }
  const jpToEn=hasJapanese(text);
  const sl=jpToEn?"ja":"en",tl=jpToEn?"en":"ja";
  const myId=++translateRequestId;
  out.innerHTML='<div class="tr-loading">Translating...</div>';
  btn.disabled=true;
  let r=null;
  try{r=await translateViaGoogle(text,sl,tl);}
  catch(e){try{r=await translateViaMyMemory(text,sl,tl);}catch(e2){r=null;}}
  if(myId!==translateRequestId)return; // a newer request replaced this one
  btn.disabled=false;
  if(!r){
    out.innerHTML='<div class="tr-error">Couldn\'t reach the translation service. Check your connection and try again.</div>';
    return;
  }
  let jp,en,rom;
  if(jpToEn){jp=text;en=r.translated;rom=r.sourceRom;}
  else{jp=r.translated;en=text;rom=r.targetRom;}
  if(!rom&&!hasKanji(jp))rom=kanaToRomaji(jp);
  currentTranslation={jp,en,rom,dir:jpToEn?"ja-en":"en-ja"};
  renderTranslationResult();
}
function renderTranslationResult(savedMsg){
  const out=document.getElementById("trResult");
  if(!out||!currentTranslation)return;
  const t=currentTranslation;
  const already=loadSaved().some(s=>s.jp===t.jp);
  out.innerHTML=`<div class="tr-result-card">
    <div class="tr-result-label">Japanese</div>
    <div class="tr-result-jp">${escHtml(t.jp)}</div>
    ${t.rom?`<div class="tr-result-rom">${escHtml(t.rom)}</div>`:""}
    <div class="tr-result-label">English</div>
    <div class="tr-result-en">${escHtml(t.en)}</div>
    <div class="tr-result-actions">
      <button class="tr-listen" onclick="playCurrentTranslation()">&#9654; Listen</button>
      <button class="tr-listen slow" onclick="playCurrentTranslation(0.6)">&#9654; Slow</button>
    </div>
    ${already
      ?`<div class="tr-saved-state">&#10003; ${savedMsg||"In your Saved Phrases"} <button class="tr-link" onclick="switchTab('saved')">View</button></div>`
      :`<input id="trNote" class="tr-note" type="text" maxlength="120" placeholder="Optional note (e.g. where you'd use it)">
        <button class="tr-save" onclick="saveCurrentTranslation()">&#9733; Save to Saved Phrases</button>`}
  </div>`;
}
function playCurrentTranslation(rate){
  if(!currentTranslation)return;
  const prev=currentSpeed;
  if(rate)currentSpeed=rate;
  speakPhrase(currentTranslation.jp,currentTranslation.en,null);
  currentSpeed=prev;
}
function saveCurrentTranslation(){
  if(!currentTranslation)return;
  const noteEl=document.getElementById("trNote");
  const t=currentTranslation;
  const result=addSavedPhrase({jp:t.jp,en:t.en,rom:t.rom,note:noteEl?noteEl.value.trim():""});
  if(result==="fail"){alert("Couldn't save - your browser storage may be full or disabled.");return;}
  renderTranslationResult(result==="dup"?"Already in your Saved Phrases":"Saved!");
  renderSavedTab();
  buildSearchIndex();
}

// Saved phrases storage
function loadSaved(){
  try{const raw=localStorage.getItem("jpGuideSaved");const a=raw?JSON.parse(raw):[];return Array.isArray(a)?a:[];}
  catch(e){return [];}
}
function saveSavedList(list){
  try{localStorage.setItem("jpGuideSaved",JSON.stringify(list));return true;}catch(e){return false;}
}
function addSavedPhrase(item){
  const list=loadSaved();
  if(list.some(s=>s.jp===item.jp))return "dup";
  list.unshift({
    id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    jp:item.jp,en:item.en,rom:item.rom||"",note:item.note||"",created:Date.now()
  });
  return saveSavedList(list)?"ok":"fail";
}
function deleteSavedPhrase(id){
  if(!confirm("Remove this phrase from Saved Phrases?"))return;
  saveSavedList(loadSaved().filter(s=>s.id!==id));
  renderSavedTab();
  buildSearchIndex();
  if(currentTranslation)renderTranslationResult();
}
function playSaved(id,btn){
  const it=loadSaved().find(s=>s.id===id);
  if(it)speakPhrase(it.jp,it.en,btn);
}
function addManualSaved(){
  const jp=document.getElementById("svJp").value.trim();
  const en=document.getElementById("svEn").value.trim();
  let rom=document.getElementById("svRom").value.trim();
  const note=document.getElementById("svNote").value.trim();
  if(!jp||!en){alert("Add at least the Japanese and the English.");return;}
  if(!rom&&!hasKanji(jp))rom=kanaToRomaji(jp);
  const result=addSavedPhrase({jp,en,rom,note});
  if(result==="dup"){alert("That phrase is already saved.");return;}
  if(result==="fail"){alert("Couldn't save - your browser storage may be full or disabled.");return;}
  renderSavedTab();
  buildSearchIndex();
}
function startSavedReview(){
  const items=shuffleArr(loadSaved()).map(s=>({jp:escHtml(s.jp),en:escHtml(s.en),rom:escHtml(s.rom||"")}));
  starReviewSessions["saved"]={items,index:0,known:0,review:0,flipped:false};
  renderStarReviewSession("saved");
}
function renderSavedTab(){
  const div=document.getElementById("unit-saved");
  if(!div)return;
  const list=loadSaved();
  let html=`<div class="unit-title">Saved Phrases</div>
    <div class="unit-sub">Phrases you saved from Translate or added yourself. Stored on this device and available offline.</div>
    <details class="saved-add">
      <summary>+ Add a phrase manually</summary>
      <div class="saved-add-body">
        <input id="svJp" class="tr-note" type="text" placeholder="Japanese (required)">
        <input id="svRom" class="tr-note" type="text" placeholder="Romaji (optional - auto-filled for kana)">
        <input id="svEn" class="tr-note" type="text" placeholder="English (required)">
        <input id="svNote" class="tr-note" type="text" placeholder="Note (optional)">
        <button class="tr-save" onclick="addManualSaved()">Add Phrase</button>
      </div>
    </details>`;
  if(!list.length){
    html+=`<div class="saved-empty">
      <div class="saved-empty-icon">&#9734;</div>
      <div>No saved phrases yet.</div>
      <div class="saved-empty-sub">Translate a sentence and tap "Save to Saved Phrases" - it will show up here.</div>
      <button class="tr-btn" onclick="switchTab('translate')">Go to Translate</button>
    </div>`;
  } else {
    html+=`<div class="section-divider blue">Your phrases (${list.length})</div>
      <button class="star-review-btn" onclick="startSavedReview()">Review as Flashcards</button>
      <div id="star-review-session-saved"></div>
      <div class="vocab-table" style="margin-top:12px;">`;
    list.forEach(it=>{
      html+=`<div class="vocab-row" data-skey="${escHtml("saved::"+it.jp)}" onclick="playSaved('${it.id}',this.querySelector('.vocab-play'))">
        <div class="vocab-main">
          <div class="vocab-jp">${escHtml(it.jp)}</div>
          <div class="vocab-sub"><span class="vocab-rom">${escHtml(it.rom||"")}</span><span class="vocab-en">${escHtml(it.en)}</span></div>
          ${it.note?`<div class="vocab-note">* ${escHtml(it.note)}</div>`:""}
        </div>
        <div class="vocab-actions">
          <button class="saved-del" onclick="event.stopPropagation();deleteSavedPhrase('${it.id}')">&times;</button>
          <button class="vocab-play" onclick="event.stopPropagation();playSaved('${it.id}',this)">&gt;&gt;</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  div.innerHTML=html;
}

renderTranslateTab();
renderSavedTab();
buildSearchIndex();
</script>
