// ── Voice setup ──────────────────────────────────────────────────
let jpVoice=null,enVoice=null,currentSpeed=0.85,isPlayingAll=false;
function loadVoices(){
  const voices=window.speechSynthesis.getVoices();
  if(!voices.length)return;
  const jpSel=document.getElementById("jpVoice");
  const enSel=document.getElementById("enVoice");
  jpSel.innerHTML="";enSel.innerHTML="";
  const jpV=voices.filter(v=>v.lang.startsWith("ja"));
  const enV=voices.filter(v=>v.lang.startsWith("en"));
  jpV.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name;jpSel.appendChild(o);});
  enV.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name;enSel.appendChild(o);});
  jpVoice=jpV[0]||null;
  enVoice=enV[0]||null;
  jpSel.onchange=()=>{jpVoice=jpV[jpSel.value];};
  document.getElementById("voiceStatus").textContent=jpVoice?"Japanese voice ready":"No Japanese voice - install Japanese in device settings";
}
window.speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

function cleanForSpeech(text){
  return text.replace(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g,"").replace(/[○✕×◎]/g,"").replace(/【|】/g,"").replace(/^[\s・\-]+/,"").trim();
}

function speak(text,onEnd){
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(cleanForSpeech(text));
  utt.voice=jpVoice;utt.lang="ja-JP";utt.rate=currentSpeed;utt.pitch=1.0;
  utt.onend=onEnd||null;
  window.speechSynthesis.speak(utt);
}

function speakPhrase(jp,en,btnEl){
  stopAll();
  document.getElementById("npJp").textContent=jp;
  document.getElementById("npEn").textContent=en;
  document.getElementById("nowPlaying").classList.add("visible");
  if(btnEl){btnEl.textContent="||";btnEl.classList.add("playing");}
  speak(jp,()=>{
    if(btnEl){btnEl.textContent=">>";btnEl.classList.remove("playing");}
    document.getElementById("nowPlaying").classList.remove("visible");
  });
}

function stopAll(){
  window.speechSynthesis.cancel();isPlayingAll=false;
  document.getElementById("nowPlaying").classList.remove("visible");
  document.querySelectorAll(".play-btn").forEach(b=>{b.textContent=">>";b.classList.remove("playing");});
  document.querySelectorAll(".play-all-btn").forEach(b=>{b.textContent="Play All";b.classList.remove("stop");b.onclick=()=>playAll(b.dataset.unit);});
  const p=document.getElementById("progressText");if(p)p.textContent="";
}

function playAll(unitId){
  stopAll();
  const unit=units.find(u=>u.id===unitId);if(!unit)return;
  const allPhrases=unit.sections.flatMap(s=>(s.phrases||[]));
  isPlayingAll=true;
  const btn=document.getElementById("play-all-"+unitId);
  if(btn){btn.textContent="Stop";btn.classList.add("stop");btn.onclick=stopAll;}
  let i=0;
  function playNext(){
    if(!isPlayingAll||i>=allPhrases.length){stopAll();return;}
    const p=allPhrases[i];
    if(!p.jp){i++;setTimeout(playNext,200);return;}
    const prog=document.getElementById("progressText");
    if(prog)prog.textContent=(i+1)+" / "+allPhrases.length;
    document.getElementById("npJp").textContent=p.jp;
    document.getElementById("npEn").textContent=p.en;
    document.getElementById("nowPlaying").classList.add("visible");
    speak(p.jp,()=>{if(!isPlayingAll)return;i++;setTimeout(playNext,900);});
  }
  playNext();
}

function setSpeed(rate){
  currentSpeed=rate;
  document.querySelectorAll(".speed-btn").forEach(b=>{
    b.classList.toggle("active",
      (rate===0.65&&b.textContent==="Slow")||
      (rate===0.85&&b.textContent==="Normal")||
      (rate===1.0&&b.textContent==="Fast"));
  });
}

function renderTabs(){
  const el=document.getElementById("tabs");
  units.forEach((u,i)=>{
    const t=document.createElement("div");
    t.className="tab"+(i===0?" active":"");
    t.textContent=u.tab;t.onclick=()=>switchTab(u.id);
    el.appendChild(t);
  });
}

function switchTab(unitId){
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",units[i].id===unitId));
  document.querySelectorAll(".unit").forEach(u=>u.classList.toggle("active",u.id==="unit-"+unitId));
  stopAll();
}

function esc(s){
  return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
}

// ── Star / favorite system (persisted in localStorage) ──────────
function loadStars(){
  try{
    const raw=localStorage.getItem("jpGuideStars");
    return raw?JSON.parse(raw):[];
  }catch(e){return [];}
}
function saveStars(arr){
  try{localStorage.setItem("jpGuideStars",JSON.stringify(arr));}catch(e){}
}
function isStarred(unitId,jp){
  return loadStars().some(s=>s.unitId===unitId && s.jp===jp);
}
function starBtnHtml(unitId,jp,en,rom,extraClass){
  if(!unitId)return "";
  const starred=isStarred(unitId,jp);
  const cls=(extraClass||"star-btn")+(starred?" starred":"");
  return `<button class="${cls}" onclick="event.stopPropagation();toggleStar(this,'${unitId}','${esc(jp)}','${esc(en||"")}','${esc(rom||"")}')">${starred?"&#9733;":"&#9734;"}</button>`;
}
function toggleStar(btn,unitId,jp,en,rom){
  let stars=loadStars();
  const idx=stars.findIndex(s=>s.unitId===unitId && s.jp===jp);
  if(idx>=0){
    stars.splice(idx,1);
    btn.classList.remove("starred");
    btn.innerHTML="&#9734;";
  } else {
    stars.push({unitId,jp,en,rom});
    btn.classList.add("starred");
    btn.innerHTML="&#9733;";
  }
  saveStars(stars);
  refreshStarReviewWrap(unitId);
}
function refreshStarReviewWrap(unitId){
  const el=document.getElementById("star-review-wrap-"+unitId);
  if(el)el.innerHTML=buildStarReviewInner(unitId);
}
function buildStarReviewInner(unitId){
  const items=loadStars().filter(s=>s.unitId===unitId);
  if(!items.length)return "";
  return `<div class="star-review-card">
    <div class="star-review-header">
      <span class="star-review-title">&#9733; Starred in this section</span>
      <span class="star-review-count">${items.length} item${items.length===1?"":"s"}</span>
    </div>
    <div class="star-review-chips">${items.map(it=>`<span class="star-chip">${it.jp}</span>`).join("")}</div>
    <button class="star-review-btn" onclick="startStarReview('${unitId}')">Review as Flashcards</button>
    <div id="star-review-session-${unitId}"></div>
  </div>`;
}

const starReviewSessions={};
function startStarReview(unitId){
  const items=shuffleArr(loadStars().filter(s=>s.unitId===unitId));
  starReviewSessions[unitId]={items,index:0,known:0,review:0,flipped:false};
  renderStarReviewSession(unitId);
}
function renderStarReviewSession(unitId){
  const s=starReviewSessions[unitId];
  const wrap=document.getElementById("star-review-session-"+unitId);
  if(!wrap)return;
  if(!s || s.index>=s.items.length){
    if(s && s.items.length){
      wrap.innerHTML=`<div class="star-session-done">Reviewed ${s.items.length} item${s.items.length===1?"":"s"} &middot; ${s.known} known, ${s.review} still learning.
        <button class="star-review-btn" onclick="${unitId==="saved"?"startSavedReview()":"startStarReview('"+unitId+"')"}">Review Again</button></div>`;
    } else {
      wrap.innerHTML="";
    }
    return;
  }
  const item=s.items[s.index];
  let html=`<div class="star-flip-card${s.flipped?" flipped":""}" onclick="flipStarCard('${unitId}')">
    <div class="star-flip-progress">${s.index+1} / ${s.items.length}</div>
    <div class="star-flip-front">${item.en}</div>`;
  if(s.flipped){
    html+=`<div class="star-flip-back">
      <div class="star-flip-jp">${item.jp}</div>
      <div class="star-flip-rom">${item.rom||""}</div>
      <button class="star-flip-play" onclick="event.stopPropagation();speakPhrase('${esc(item.jp)}','${esc(item.en)}',this)">&gt;&gt;</button>
    </div>`;
  } else {
    html+=`<div class="star-flip-hint">Tap to reveal</div>`;
  }
  html+=`</div>`;
  if(s.flipped){
    html+=`<div class="star-flip-actions">
      <button class="star-flip-btn learning" onclick="answerStarCard('${unitId}',false)">Still Learning</button>
      <button class="star-flip-btn known" onclick="answerStarCard('${unitId}',true)">Got It</button>
    </div>`;
  }
  wrap.innerHTML=html;
}
function flipStarCard(unitId){
  const s=starReviewSessions[unitId];
  if(!s)return;
  s.flipped=true;
  renderStarReviewSession(unitId);
}
function answerStarCard(unitId,known){
  const s=starReviewSessions[unitId];
  if(!s)return;
  if(known)s.known++; else s.review++;
  s.index++;
  s.flipped=false;
  renderStarReviewSession(unitId);
}

// ── Phrase-type detection & renderers (table / chat / conjugation) ──
function phraseType(p){
  if(p.jp && p.jp.indexOf("→")!==-1) return "conj";
  if(p.role) return "chat";
  return "vocab";
}

function renderPhraseRuns(phrases,unitId){
  let html="";
  let i=0;
  while(i<phrases.length){
    const type=phraseType(phrases[i]);
    const run=[];
    while(i<phrases.length && phraseType(phrases[i])===type){run.push(phrases[i]);i++;}
    if(type==="vocab") html+=renderVocabTable(run,unitId);
    else if(type==="chat"){
      const roles=new Set(run.map(p=>p.role));
      if(roles.size>1){
        html+=renderChatThread(run,unitId);
      } else {
        html+=renderVocabTable(run,unitId);
      }
    }
    else html+=renderConjGrid(run,unitId);
  }
  return html;
}

function renderVocabTable(phrases,unitId){
  let html='<div class="vocab-table">';
  phrases.forEach(p=>{
    html+=`<div class="vocab-row" data-skey="${esc(unitId+"::"+p.jp)}" onclick="speakPhrase('${esc(p.jp)}','${esc(p.en)}',this.querySelector('.vocab-play'))">
      <div class="vocab-main">
        <div class="vocab-jp">${p.jp}</div>
        <div class="vocab-sub"><span class="vocab-rom">${p.rom||""}</span><span class="vocab-en">${p.en||""}</span></div>
        ${p.note?`<div class="vocab-note">* ${p.note}</div>`:""}
      </div>
      <div class="vocab-actions">
        ${starBtnHtml(unitId,p.jp,p.en,p.rom)}
        <button class="vocab-play" onclick="event.stopPropagation();speakPhrase('${esc(p.jp)}','${esc(p.en)}',this)">&gt;&gt;</button>
      </div>
    </div>`;
  });
  html+='</div>';
  return html;
}

function renderChatThread(phrases,unitId){
  let html='<div class="chat-thread">';
  phrases.forEach(p=>{
    const role=p.role==="staff"?"staff":"you";
    const label=p.role==="staff"?"Staff":"You";
    html+=`<div class="chat-row ${role}">
      <div class="chat-bubble" data-skey="${esc(unitId+"::"+p.jp)}" onclick="speakPhrase('${esc(p.jp)}','${esc(p.en)}',this.querySelector('.chat-play-inline'))">
        <div class="chat-label">${label}</div>
        <div class="chat-jp">${p.jp}<span class="chat-play-inline">&gt;&gt;</span>${starBtnHtml(unitId,p.jp,p.en,p.rom,"chat-star")}</div>
        <div class="chat-rom">${p.rom||""}</div>
        <div class="chat-en">${p.en||""}</div>
        ${p.note?`<div class="chat-note">* ${p.note}</div>`:""}
      </div>
    </div>`;
  });
  html+='</div>';
  return html;
}

function renderKosoadoTable(cfg,unitId){
  if(!cfg)return "";
  let html='<div class="kosoado-wrap"><div class="kosoado-table">';
  html+='<div class="kosoado-cell kosoado-corner"></div>';
  cfg.columns.forEach(col=>{
    html+=`<div class="kosoado-cell kosoado-head ${col.key}">${col.label}<span class="kosoado-head-jp">${col.kana}</span></div>`;
  });
  cfg.rows.forEach(row=>{
    html+=`<div class="kosoado-cell kosoado-row-label">${row.label}${row.sub?`<span class="kosoado-row-sub">${row.sub}</span>`:""}</div>`;
    cfg.columns.forEach(col=>{
      const cell=row.cells[col.key];
      if(!cell){html+='<div class="kosoado-cell kosoado-data"></div>';return;}
      html+=`<div class="kosoado-cell kosoado-data ${col.key}" data-skey="${esc(unitId+"::"+cell.jp)}" onclick="speakPhrase('${esc(cell.jp)}','${esc(cell.en)}',null)">
        ${starBtnHtml(unitId,cell.jp,cell.en,cell.rom,"num-star")}
        <div class="kosoado-jp">${cell.jp}</div>
        <div class="kosoado-rom">${cell.rom}</div>
        <div class="kosoado-en">${cell.en}</div>
      </div>`;
    });
  });
  html+='</div></div>';
  return html;
}

function renderGrammarCard(phrases,unitId){
  if(!phrases.length)return "";

      <div class="grammar-rule-badge">${rule.jp}</div>
      <div class="grammar-rule-text">
        <div class="grammar-rule-en">${rule.en||""}</div>
        ${rule.note?`<div class="grammar-rule-note">${rule.note}</div>`:""}
      </div>

      html+=`<div class="grammar-ex-row" data-skey="${esc(unitId+"::"+ex.jp)}" onclick="speakPhrase('${esc(ex.jp)}','${esc(ex.en)}',this.querySelector('.grammar-ex-play'))">
        <div class="grammar-ex-main">
          <div class="grammar-ex-jp">${ex.jp}</div>

function renderNumberGrid(phrases,unitId,extraClass){
  let html=`<div class="num-grid ${extraClass||""}">`;

    const speakText=p.reading||p.jp;
    html+=`<div class="num-cell" data-skey="${esc(unitId+"::"+p.jp)}" onclick="speakPhrase('${esc(speakText)}','${esc(p.en)}',null)">
      ${starBtnHtml(unitId,p.jp,p.en,p.rom,"num-star")}
      <div class="num-jp">${p.jp}</div>
      <div class="num-rom">${p.rom||""}</div>
      ${p.en?`<div class="num-en">${p.en}</div>`:""}
      ${p.note?`<div class="num-note">${p.note}</div>`:""}
    </div>`;
  });
  html+="</div>";
  return html;
}

function renderConjGrid(phrases,unitId){
  let html='<div class="conj-grid">';
  phrases.forEach(p=>{
    const jpParts=p.jp.split("→").map(s=>s.trim());
    const romParts=(p.rom||"").split(" - ").map(s=>s.trim()).filter(Boolean);
    const speakText=jpParts.join(" ");
    let chipsHtml="";
    jpParts.forEach((part,idx)=>{
      const isLast=idx===jpParts.length-1;
      chipsHtml+=`<span class="conj-chip ${isLast?"target":"base"}">${part}</span>`;
      if(!isLast)chipsHtml+=`<span class="conj-arrow">&#8594;</span>`;
    });
    const romLine=romParts.join(" &rarr; ");
    html+=`<div class="conj-card" data-skey="${esc(unitId+"::"+p.jp)}" onclick="speakPhrase('${esc(speakText)}','${esc(p.en)}',this.querySelector('.conj-play'))">
      <div class="conj-row">${chipsHtml}
        ${starBtnHtml(unitId,p.jp,p.en,p.rom,"conj-star")}
        <button class="conj-play" onclick="event.stopPropagation();speakPhrase('${esc(speakText)}','${esc(p.en)}',this)">&gt;&gt;</button>
      </div>
      ${romLine?`<div class="conj-rom">${romLine}</div>`:""}
      <div class="conj-en">${p.en||""}</div>
      ${p.note?`<div class="conj-note">* ${p.note}</div>`:""}
    </div>`;
  });
  html+='</div>';
  return html;
}

function renderUnits(){
  const content=document.getElementById("content");
  units.forEach(unit=>{
    const div=document.createElement("div");
    div.className="unit"+(unit.id===units[0].id?" active":"");
    div.id="unit-"+unit.id;
    if(["__KANA__","__QUIZ__","__TRANSLATE__","__SAVED__","__ROADMAP__","__BUILDER__","__MOCK__","__READING__","__RECORD__"].indexOf(unit.title)!==-1){content.appendChild(div);return;}

    let html=`<div class="unit-title">${unit.title}</div>
      <div class="unit-sub">${unit.sub}</div>
      <div class="play-all-bar">
        <button class="play-all-btn" id="play-all-${unit.id}" data-unit="${unit.id}" onclick="playAll('${unit.id}')">Play All</button>
        <span class="speed-label">Speed:</span>
        <button class="speed-btn" onclick="setSpeed(0.65)">Slow</button>
        <button class="speed-btn active" onclick="setSpeed(0.85)">Normal</button>
        <button class="speed-btn" onclick="setSpeed(1.0)">Fast</button>
        <span class="progress-text" id="progressText"></span>
      </div>`;

    unit.sections.forEach(sec=>{
      const c=sec.color||"";
      html+=`<div class="section-divider ${c}">${sec.title}</div>`;
      if(sec.infoCards){
        sec.infoCards.forEach(card=>{
          html+=`<div class="info-card ${card.style}">
            <div class="info-card-title">${card.heading}</div>
            <div class="info-card-body">${card.body}</div>
          </div>`;
        });
      }
      const phrases=sec.phrases||[];
      if(sec.layout==="kosoado"){
        html+=renderKosoadoTable(sec.kosoado,unit.id);
      } else if(sec.layout==="grammar"){
        html+=renderGrammarCard(phrases,unit.id);
      } else if(sec.grid){
        html+=renderNumberGrid(phrases, unit.id, sec.grid==="kanji"?"kanji-grid":"");
      } else {
        html+=renderPhraseRuns(phrases,unit.id);
      }
    });
    html+=`<div id="star-review-wrap-${unit.id}">${buildStarReviewInner(unit.id)}</div>`;
    div.innerHTML=html;
    content.appendChild(div);
  });
}

function renderKana(){
  const div=document.getElementById("unit-kana");
  if(!div)return;

function playKanaAll(which){
  stopAll();
  const div=document.getElementById("unit-kana");
  const cells=which==="hira"?div._hiraAll:div._kataAll;
  isPlayingAll=true;
  let i=0;
  function next(){
    if(!isPlayingAll||i>=cells.length){stopAll();return;}
    const cell=cells[i];
    document.getElementById("npJp").textContent=cell.c;
    document.getElementById("npEn").textContent=cell.r;
    document.getElementById("nowPlaying").classList.add("visible");
    speak(cell.c,()=>{if(!isPlayingAll)return;i++;setTimeout(next,600);});
  }
  next();
}

function speakKana(char,rom,cellId){
  stopAll();
  document.querySelectorAll(".kana-cell").forEach(c=>c.classList.remove("playing"));
  const el=document.getElementById(cellId);
  if(el)el.classList.add("playing");
  document.getElementById("npJp").textContent=char;
  document.getElementById("npEn").textContent=rom;
  document.getElementById("nowPlaying").classList.add("visible");
  speak(char,()=>{
    if(el)el.classList.remove("playing");
    document.getElementById("nowPlaying").classList.remove("visible");
  });
}

let quizState=null;

function collectQuizItemsFromUnit(u){
  const out=[];
  (u.sections||[]).forEach(sec=>{
    (sec.phrases||[]).forEach(p=>{
      if(p.jp && p.en && p.jp.indexOf("→")===-1){
        out.push({jp:p.jp,en:p.en,rom:p.rom||""});
      }
    });
  });
  return out;
}

function dedupeQuizItems(items){
  const seen=new Set();
  const out=[];
  items.forEach(it=>{
    const key=it.jp+"|"+it.en;
    if(!seen.has(key)){seen.add(key);out.push(it);}
  });
  return out;
}

function buildQuizPool(topicId){
  let items=[];
  if(topicId==="saved"){
    items=loadSaved().map(s=>({jp:s.jp,en:s.en,rom:s.rom||""}));
  } else if(topicId==="kana"){
    items=KANA_QUIZ_ITEMS.map(k=>({jp:k.c,en:k.r,rom:k.r}));
  } else if(topicId==="all"){
    units.forEach(u=>{
      if(u.id==="quiz"||u.id==="translate")return;
      if(u.id==="saved"){items=items.concat(loadSaved().map(s=>({jp:s.jp,en:s.en,rom:s.rom||""})));return;}
      if(u.id==="kana"){items=items.concat(KANA_QUIZ_ITEMS.map(k=>({jp:k.c,en:k.r,rom:k.r})));}
      else{items=items.concat(collectQuizItemsFromUnit(u));}
    });
  } else {
    const u=units.find(x=>x.id===topicId);
    if(u)items=collectQuizItemsFromUnit(u);
  }
  return dedupeQuizItems(items);
}

function shuffleArr(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}

function startQuiz(){
  stopAll();
  const topicSel=document.getElementById("quizTopic");
  const topicId=topicSel.value;
  const topicLabel=topicSel.options[topicSel.selectedIndex].textContent;
  const direction=document.querySelector(".quiz-toggle-btn.active").dataset.dir;
  const countVal=document.querySelector(".quiz-count-btn.active").dataset.count;
  const pool=buildQuizPool(topicId);
  if(pool.length<2){
    alert("Not enough items in this topic for a quiz. Try a bigger topic like All Topics.");
    return;
  }
  const shuffledPool=shuffleArr(pool);
  const total=countVal==="all"?Math.min(shuffledPool.length,40):Math.min(parseInt(countVal,10),shuffledPool.length);
  quizState={
    topicId,topicLabel,direction,
    pool:shuffledPool,
    questions:shuffledPool.slice(0,total),
    index:0,score:0,answered:false
  };
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const div=document.getElementById("unit-quiz");
  const qs=quizState;
  const item=qs.questions[qs.index];
  const isEnToJp=qs.direction==="en-jp";
  const promptText=isEnToJp?item.en:item.jp;
  const correctText=isEnToJp?item.jp:item.en;

  const others=qs.pool.filter(p=>p!==item);
  const shuffledOthers=shuffleArr(others);
  const seenTexts=new Set([correctText.trim().toLowerCase()]);
  const distractors=[];
  for(let k=0;k<shuffledOthers.length && distractors.length<3;k++){
    const t=(isEnToJp?shuffledOthers[k].jp:shuffledOthers[k].en).trim();
    const key=t.toLowerCase();
    if(!seenTexts.has(key)){seenTexts.add(key);distractors.push(t);}
  }
  const options=shuffleArr([correctText].concat(distractors));
  const correctIndex=options.indexOf(correctText);

  qs.currentOptions=options;
  qs.currentCorrectIndex=correctIndex;
  qs.currentItem=item;
  qs.answered=false;

  const optClass=isEnToJp?"quiz-option-jp":"";
  let html=`<div class="quiz-progress">Question ${qs.index+1} of ${qs.questions.length} &middot; ${qs.topicLabel} &middot; Score ${qs.score}</div>
  <div class="quiz-prompt-card">
    <div class="quiz-prompt-label">${isEnToJp?"English &rarr; Japanese":"Japanese &rarr; English"}</div>
    <div class="quiz-prompt-main${isEnToJp?"":" quiz-jp"}">${promptText}</div>
  </div>
  <div class="quiz-options" id="quizOptions">`;
  options.forEach((opt,i)=>{
    html+=`<button class="quiz-option-btn ${optClass}" onclick="selectQuizAnswer(${i})">${opt}</button>`;
  });
  html+=`</div><div class="quiz-feedback" id="quizFeedback"></div><div id="quizNextWrap"></div>`;
  div.innerHTML=html;
}

function selectQuizAnswer(i){
  const qs=quizState;
  if(qs.answered)return;
  qs.answered=true;
  const correct=i===qs.currentCorrectIndex;
  if(correct)qs.score++;
  const buttons=document.querySelectorAll("#quizOptions .quiz-option-btn");
  buttons.forEach((b,idx)=>{
    b.classList.add("disabled");
    if(idx===qs.currentCorrectIndex)b.classList.add("correct");
    else if(idx===i)b.classList.add("wrong");
  });
  const item=qs.currentItem;
  const fb=document.getElementById("quizFeedback");
  fb.innerHTML=correct
    ?`<div class="quiz-fb-good">Correct!<button class="quiz-fb-play" onclick="speakPhrase('${esc(item.jp)}','${esc(item.en)}',this)">&gt;&gt;</button></div>${item.rom?`<div class="quiz-fb-rom">${item.rom}</div>`:""}`
    :`<div class="quiz-fb-bad">Not quite &mdash; correct answer:<button class="quiz-fb-play" onclick="speakPhrase('${esc(item.jp)}','${esc(item.en)}',this)">&gt;&gt;</button></div><div class="quiz-fb-rom">${item.jp}${item.rom?" &middot; "+item.rom:""} &mdash; ${item.en}</div>`;
  const isLast=qs.index>=qs.questions.length-1;
  document.getElementById("quizNextWrap").innerHTML=
    `<button class="quiz-next-btn" onclick="${isLast?"showQuizResults()":"nextQuizQuestion()"}">${isLast?"See Results":"Next Question"}</button>`;
}

function nextQuizQuestion(){
  quizState.index++;
  renderQuizQuestion();
}

function showQuizResults(){
  const qs=quizState;
  const pct=Math.round((qs.score/qs.questions.length)*100);
  const msg=pct>=90?"Excellent! You've got this down.":pct>=70?"Great job!":pct>=50?"Good effort, keep practicing!":"Keep at it - repetition is how it sticks.";
  const div=document.getElementById("unit-quiz");
  div.innerHTML=`<div class="quiz-result-card">
    <div class="quiz-result-score">${qs.score} / ${qs.questions.length}</div>
    <div class="quiz-result-pct">${pct}% &middot; ${qs.topicLabel}</div>
    <div class="quiz-result-msg">${msg}</div>
    <div class="quiz-result-buttons">
      <button class="quiz-start-btn" onclick="retryQuiz()">Try Again</button>
      <button class="quiz-secondary-btn" onclick="renderQuizTab()">New Quiz</button>
    </div>
  </div>`;
}

function retryQuiz(){
  const qs=quizState;
  const freshPool=shuffleArr(qs.pool);
  quizState={
    topicId:qs.topicId,topicLabel:qs.topicLabel,direction:qs.direction,
    pool:freshPool,
    questions:freshPool.slice(0,qs.questions.length),
    index:0,score:0,answered:false
  };
  renderQuizQuestion();
}

let searchIndex=[];
let currentSearchResults=[];

function buildSearchIndex(){
  const idx=[];
  units.forEach(unit=>{
    if(unit.id==="quiz")return;
    (unit.sections||[]).forEach(sec=>{
      if(sec.layout==="kosoado" && sec.kosoado){
        sec.kosoado.rows.forEach(row=>{
          sec.kosoado.columns.forEach(col=>{
            const cell=row.cells[col.key];
            if(cell){
              idx.push({unitId:unit.id,unitTab:unit.tab,sectionTitle:sec.title,jp:cell.jp,rom:cell.rom||"",en:cell.en||"",note:""});
            }
          });
        });
      }
      (sec.phrases||[]).forEach(p=>{
        if(!p.jp)return;
        idx.push({unitId:unit.id,unitTab:unit.tab,sectionTitle:sec.title,jp:p.jp,rom:p.rom||"",en:p.en||"",note:p.note||""});
      });
    });
  });
  if(typeof KANA_QUIZ_ITEMS!=="undefined"){
    KANA_QUIZ_ITEMS.forEach(k=>{
      idx.push({unitId:"kana",unitTab:"Hiragana and Katakana",sectionTitle:"Kana chart",jp:k.c,rom:k.r,en:k.r,note:""});
    });
  }
  loadSaved().forEach(s=>{
    idx.push({unitId:"saved",unitTab:"Saved Phrases",sectionTitle:"Saved",jp:s.jp,rom:s.rom||"",en:s.en||"",note:s.note||""});
  });
  searchIndex=idx;
}

function performSearch(q){
  const ql=q.toLowerCase();
  return searchIndex.filter(item=>
    item.jp.indexOf(q)!==-1 ||
    (item.rom && item.rom.toLowerCase().indexOf(ql)!==-1) ||
    (item.en && item.en.toLowerCase().indexOf(ql)!==-1) ||
    (item.note && item.note.toLowerCase().indexOf(ql)!==-1)
  );
}

function handleSearchInput(){
  const input=document.getElementById("searchInput");
  const clearBtn=document.getElementById("searchClearBtn");
  const q=input.value.trim();
  clearBtn.style.display=q?"flex":"none";
  if(!q){hideSearchResults();return;}
  renderSearchResults(performSearch(q),q);
}

function renderSearchResults(results,q){
  const wrap=document.getElementById("searchResults");
  if(!results.length){
    wrap.innerHTML=`<div class="search-empty">No matches for "${esc(q)}"</div>`;
    wrap.classList.add("show");
    currentSearchResults=[];
    return;
  }
  const LIMIT=40;
  const shown=results.slice(0,LIMIT);
  let html="";
  shown.forEach((r,i)=>{
    html+=`<div class="search-result-row" onclick="goToSearchResult(${i})">
      <div class="search-result-main">
        <div class="search-result-jp">${escHtml(r.jp)}</div>
        <div class="search-result-en">${r.rom?escHtml(r.rom)+" &middot; ":""}${escHtml(r.en)}</div>
      </div>
      <span class="search-result-tag">${r.unitTab}</span>
    </div>`;
  });
  if(results.length>LIMIT){
    html+=`<div class="search-more">Showing ${LIMIT} of ${results.length} matches - keep typing to narrow it down</div>`;
  }
  wrap.innerHTML=html;
  wrap.classList.add("show");
  currentSearchResults=shown;
}

function goToSearchResult(i){
  const r=currentSearchResults[i];
  if(!r)return;
  switchTab(r.unitId);
  hideSearchResults();
  const input=document.getElementById("searchInput");
  if(input)input.blur();
  setTimeout(()=>{
    const key=r.unitId+"::"+r.jp;
    const el=document.querySelector('#unit-'+r.unitId+' [data-skey="'+CSS.escape(key)+'"]');
    if(el){
      if(typeof el.scrollIntoView==="function")el.scrollIntoView({behavior:"smooth",block:"center"});
      el.classList.add("search-highlight-flash");
      setTimeout(()=>el.classList.remove("search-highlight-flash"),1600);
    }
  },60);
}

function hideSearchResults(){
  const wrap=document.getElementById("searchResults");
  if(wrap)wrap.classList.remove("show");
}

function clearSearch(){
  const input=document.getElementById("searchInput");
  input.value="";
  document.getElementById("searchClearBtn").style.display="none";
  hideSearchResults();
  input.focus();
}

document.addEventListener("click",function(e){
  const wrap=document.getElementById("searchBarWrap");
  if(wrap && !wrap.contains(e.target))hideSearchResults();
});


// ═══════════════════════════════════════════════════════════════
// Cross-device progress sync
//  - GitHub Gist backend (private gist, token with "gist" scope)
//  - Manual backup code (copy / paste) as a no-setup fallback
//  Per-key timestamps: the newest change to each item wins.
// ═══════════════════════════════════════════════════════════════
const SYNC_KEYS=["jpGuideStars","jpGuideSaved","jpRoadmapDone","jpReadingDone","jpQuizPrefs","jpHideRomaji","jpHideFuri","jpSRS"];
const SYNC_ARRAY_KEYS=["jpGuideStars","jpGuideSaved","jpRoadmapDone","jpReadingDone"];
const SYNC_FILE="n5-guide-progress.json";
const SYNC_META="jpSyncMeta", SYNC_CFG="jpSyncCfg";
let syncState={status:"off",last:null,timer:null,busy:false,pendingPush:false,msg:""};

function _lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function _lsSetRaw(k,v){try{Storage.prototype.__origSet.call(localStorage,k,v);}catch(e){}}
function syncMeta(){try{const m=JSON.parse(_lsGet(SYNC_META)||"{}");return m&&typeof m==="object"?m:{};}catch(e){return {};}}
function syncCfg(){try{const c=JSON.parse(_lsGet(SYNC_CFG)||"null");return c&&c.token?c:null;}catch(e){return null;}}
function saveSyncCfg(c){_lsSetRaw(SYNC_CFG,c?JSON.stringify(c):"");if(!c){try{localStorage.removeItem(SYNC_CFG);}catch(e){}}}

// Stamp tracked keys whenever their value really changes, then schedule a push.
(function installSyncHook(){
  try{
    if(Storage.prototype.__origSet)return;
    Storage.prototype.__origSet=Storage.prototype.setItem;
    Storage.prototype.setItem=function(k,v){
      let changed=false;
      if(this===window.localStorage&&SYNC_KEYS.indexOf(k)>=0){changed=Storage.prototype.getItem.call(this,k)!==String(v);}
      Storage.prototype.__origSet.call(this,k,v);
      if(changed){
        const m=syncMeta();m[k]=Date.now();
        Storage.prototype.__origSet.call(this,SYNC_META,JSON.stringify(m));
        scheduleSyncPush();
      }
    };
  }catch(e){}
})();

function localSnapshot(){
  const m=syncMeta(),items={};
  SYNC_KEYS.forEach(k=>{const v=_lsGet(k);if(v!==null)items[k]={v:v,t:m[k]||0};});
  return {app:"n5-guide",version:1,updated:Date.now(),items:items};
}
function _arr(s){try{const a=JSON.parse(s);return Array.isArray(a)?a:[];}catch(e){return [];}}
function _unionJson(a,b){
  const out=[],seen=new Set();
  _arr(a).concat(_arr(b)).forEach(x=>{const key=JSON.stringify(x);if(!seen.has(key)){seen.add(key);out.push(x);}});
  return JSON.stringify(out);
}
// Review history merges per question: the most recent answer for each one wins.
function _mergeSRS(a,b){
  let A={},B={};try{A=JSON.parse(a||"{}")||{};}catch(e){}try{B=JSON.parse(b||"{}")||{};}catch(e){}
  const cleared=Math.max(A._clearedAt||0,B._clearedAt||0),out={};
  if(cleared)out._clearedAt=cleared;
  new Set(Object.keys(A).concat(Object.keys(B))).forEach(k=>{
    if(k==="_clearedAt")return;
    const x=A[k],y=B[k];
    const w=!x?y:!y?x:((y.l||0)>(x.l||0)?y:x);
    if(w&&(w.l||0)>=cleared)out[k]=w;
  });
  return JSON.stringify(out);
}
// Merge a remote snapshot into localStorage. Returns {changedLocal, needPush}.
function mergeSnapshot(remote){
  const res={changedLocal:false,needPush:false};
  if(!remote||!remote.items)return {changedLocal:false,needPush:true};
  const m=syncMeta();
  SYNC_KEYS.forEach(k=>{
    const r=remote.items[k],lv=_lsGet(k),lt=m[k]||0;
    if(!r){if(lv!==null)res.needPush=true;return;}
    let winV,winT;
    if(k==="jpSRS"&&lv!==null){winV=_mergeSRS(lv,r.v);winT=Math.max(lt,r.t);}
    else if(lv===null){winV=r.v;winT=r.t;}
    else if(r.t>lt){winV=r.v;winT=r.t;}
    else if(lt>r.t){winV=lv;winT=lt;}
    else{ // tie (usually both never edited since sync started)
      winV=SYNC_ARRAY_KEYS.indexOf(k)>=0?_unionJson(r.v,lv):r.v;winT=lt;
    }
    if(winV!==lv){_lsSetRaw(k,winV);res.changedLocal=true;}
    if(winV!==r.v||winT!==r.t)res.needPush=true;
    m[k]=winT;
  });
  _lsSetRaw(SYNC_META,JSON.stringify(m));
  return res;
}

// ── GitHub Gist backend ──
async function gh(path,opts){
  const c=syncCfg();
  const o=Object.assign({cache:"no-store"},opts||{});
  o.headers=Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+c.token},(opts&&opts.headers)||{});
  const r=await fetch("https://api.github.com"+path,o);
  if(r.status===401){const e=new Error("bad_token");e.code=401;throw e;}
  if(r.status===404){const e=new Error("not_found");e.code=404;throw e;}
  if(!r.ok){const e=new Error("http_"+r.status);e.code=r.status;throw e;}
  return r.status===204?null:r.json();
}
async function findOrCreateGist(){
  const c=syncCfg();
  if(c.gistId){
    try{await gh("/gists/"+c.gistId);return c.gistId;}catch(e){if(e.code!==404)throw e;}
  }
  for(let page=1;page<=5;page++){
    const list=await gh("/gists?per_page=100&page="+page);
    const hit=list.find(g=>g.files&&g.files[SYNC_FILE]);
    if(hit){c.gistId=hit.id;saveSyncCfg(c);return hit.id;}
    if(list.length<100)break;
  }
  const g=await gh("/gists",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({description:"N5 study guide progress (synced by the guide)",public:false,files:{[SYNC_FILE]:{content:JSON.stringify(localSnapshot())}}})});
  c.gistId=g.id;saveSyncCfg(c);
  return g.id;
}
async function pullRemote(){
  const c=syncCfg();
  const g=await gh("/gists/"+c.gistId);
  const f=g.files&&g.files[SYNC_FILE];
  if(!f)return null;
  let txt=f.content;
  if(f.truncated&&f.raw_url){txt=await (await fetch(f.raw_url,{cache:"no-store"})).text();}
  try{return JSON.parse(txt);}catch(e){return null;}
}
async function pushRemote(keepalive){
  const c=syncCfg();
  await gh("/gists/"+c.gistId,{method:"PATCH",keepalive:!!keepalive,headers:{"Content-Type":"application/json"},body:JSON.stringify({files:{[SYNC_FILE]:{content:JSON.stringify(localSnapshot())}}})});
}

function setSyncStatus(s,msg){syncState.status=s;syncState.msg=msg||"";renderSyncPill();}
function syncErrText(e){
  if(e&&e.code===401)return "GitHub rejected the key. Make a new one and connect again.";
  if(e&&e.code===403)return "GitHub refused (the key needs the 'gist' permission, or you hit a rate limit).";
  if(!navigator.onLine)return "You're offline - changes are kept on this device and will sync later.";
  return "Couldn't reach GitHub - will retry.";
}
async function syncNow(opts){
  opts=opts||{};
  if(!syncCfg()){setSyncStatus("off");return;}
  if(syncState.busy){syncState.pendingPush=true;return;}
  clearTimeout(syncState.timer);
  syncState.busy=true;setSyncStatus("syncing");
  try{
    if(!syncCfg().gistId)await findOrCreateGist();
    let remote;
    try{remote=await pullRemote();}catch(e){if(e.code===404){saveSyncCfg(Object.assign(syncCfg(),{gistId:null}));await findOrCreateGist();remote=await pullRemote();}else throw e;}
    const r=mergeSnapshot(remote);
    if(r.needPush||opts.forcePush)await pushRemote();
    syncState.last=Date.now();setSyncStatus("ok");
    if(r.changedLocal)onRemoteChanges(opts.initial);
  }catch(e){
    setSyncStatus(e&&e.code===401?"error":"retry",syncErrText(e));
    if(!(e&&(e.code===401||e.code===403)))setTimeout(()=>syncNow(),30000);
  }finally{
    syncState.busy=false;
    if(syncState.pendingPush){syncState.pendingPush=false;scheduleSyncPush(300);}
  }
}
function scheduleSyncPush(delay){
  if(!syncCfg())return;
  clearTimeout(syncState.timer);
  setSyncStatus("pending");
  syncState.timer=setTimeout(()=>syncNow(),delay==null?2500:delay);
}
function onRemoteChanges(initial){
  // progress arrived from another device: reload so every tab reflects it
  let recent=false;
  try{recent=Date.now()-Number(sessionStorage.getItem("jpSyncReloaded")||0)<15000;}catch(e){}
  const busy=(typeof quizState!=="undefined"&&quizState&&!quizState._done&&quizState.index>0)||(typeof mockState!=="undefined"&&mockState&&mockState.i>0);
  if(initial&&!recent&&!busy){
    try{sessionStorage.setItem("jpSyncReloaded",String(Date.now()));}catch(e){}
    location.reload();
  } else {
    showSyncBanner();
  }
}
function showSyncBanner(){
  if(document.getElementById("syncBanner"))return;
  const d=document.createElement("div");
  d.id="syncBanner";d.className="sync-banner";
  d.innerHTML=`<span>New progress from another device.</span><button onclick="location.reload()">Refresh</button>`;
  document.body.appendChild(d);
}

// ── UI: header pill + panel ──
function renderSyncPill(){
  const b=document.getElementById("syncPill");
  if(!b)return;
  const s=syncState.status;
  const t=syncState.last?new Date(syncState.last).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"";
  const label={off:"Sync: off",syncing:"Syncing…",pending:"Saving…",ok:"Synced"+(t?" "+t:""),retry:"Sync: waiting",error:"Sync: fix key"}[s]||"Sync";
  b.textContent="☁ "+label;
  b.className="sync-pill "+s;
  const st=document.getElementById("syncPanelStatus");
  if(st)st.textContent=syncState.msg||(s==="ok"?"Everything is saved to your GitHub.":s==="off"?"Sync is off on this device.":"");
}
function openSyncPanel(){
  closeSyncPanel();
  const c=syncCfg();
  const d=document.createElement("div");
  d.id="syncPanel";d.className="sync-overlay";
  d.onclick=e=>{if(e.target===d)closeSyncPanel();};
  d.innerHTML=`<div class="sync-card" role="dialog" aria-label="Sync progress">
    <div class="sync-head"><b>Sync your progress</b><button class="sync-x" onclick="closeSyncPanel()" aria-label="Close">&times;</button></div>
    <div class="sync-sub">Stars, saved phrases, Roadmap ticks, finished reading passages and your settings - on every computer and your phone.</div>
    ${c?`<div class="sync-box ok">
      <div><b>Connected to GitHub</b> on this device.</div>
      <div class="sync-status" id="syncPanelStatus"></div>
      <div class="sync-row"><button class="sync-btn" onclick="syncNow({forcePush:true})">Sync now</button><button class="sync-btn ghost" onclick="disconnectSync()">Disconnect this device</button></div>
      <div class="sync-small">Other devices: open the guide there, tap ☁ Sync and paste the same key.</div>
    </div>`:`<div class="sync-box">
      <div class="sync-step"><span>1</span><div>Create a GitHub key that can only touch Gists: <a class="ext-link" href="https://github.com/settings/tokens/new?scopes=gist&description=N5%20Guide%20sync" target="_blank" rel="noopener">Open GitHub</a><div class="sync-small">Leave "gist" ticked (nothing else), pick an expiration (or "No expiration"), press <i>Generate token</i> and copy it. Keep it in your password manager or notes - you'll paste it on each device.</div></div></div>
      <div class="sync-step"><span>2</span><div>Paste the key here:<input id="syncTokenInput" class="sync-input" type="password" placeholder="ghp_..." autocomplete="off" spellcheck="false"></div></div>
      <div class="sync-row"><button class="sync-btn" onclick="connectSync()">Connect</button></div>
      <div class="sync-status" id="syncPanelStatus"></div>
      <div class="sync-small">Your progress goes into one <b>private</b> Gist on your GitHub account. The key is stored only in this browser.</div>
    </div>`}
    <details class="sync-details"><summary>No GitHub? Use a backup code</summary>
      <div class="sync-small">Copy the code on one device and paste it on another. It's a one-time copy, not live sync.</div>
      <div class="sync-row"><button class="sync-btn ghost" onclick="copyBackupCode(this)">Copy my progress code</button></div>
      <textarea id="syncCodeInput" class="sync-input" rows="3" placeholder="Paste a progress code here"></textarea>
      <div class="sync-row"><button class="sync-btn ghost" onclick="importBackupCode()">Load code</button></div>
    </details>
  </div>`;
  document.body.appendChild(d);
  renderSyncPill();
}
function closeSyncPanel(){const d=document.getElementById("syncPanel");if(d)d.remove();}
async function connectSync(){
  const inp=document.getElementById("syncTokenInput");
  const token=(inp&&inp.value||"").trim();
  const st=document.getElementById("syncPanelStatus");
  if(!/^(ghp_|github_pat_|gho_)[A-Za-z0-9_]{20,}$/.test(token)){if(st)st.textContent="That doesn't look like a GitHub key (it starts with ghp_).";return;}
  saveSyncCfg({token:token,gistId:null});
  if(st)st.textContent="Connecting…";
  await syncNow({initial:true});
  if(syncState.status==="ok"){openSyncPanel();}
  else{const msg=syncState.msg;if(syncState.status==="error")saveSyncCfg(null);openSyncPanel();const s2=document.getElementById("syncPanelStatus");if(s2)s2.textContent=msg;}
}
function disconnectSync(){
  if(!confirm("Stop syncing on this device? Your progress stays here and on GitHub."))return;
  saveSyncCfg(null);setSyncStatus("off");openSyncPanel();
}
function backupCode(){
  const json=JSON.stringify(localSnapshot());
  return "N5G1."+btoa(unescape(encodeURIComponent(json)));
}
function copyBackupCode(btn){
  const code=backupCode();
  const done=()=>{btn.textContent="Copied!";setTimeout(()=>btn.textContent="Copy my progress code",1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,()=>{const t=document.getElementById("syncCodeInput");t.value=code;t.select();btn.textContent="Code shown below - copy it";});}
  else{const t=document.getElementById("syncCodeInput");t.value=code;t.select();btn.textContent="Code shown below - copy it";}
}
function importBackupCode(){
  const raw=(document.getElementById("syncCodeInput").value||"").trim();
  try{
    if(raw.indexOf("N5G1.")!==0)throw 0;
    const snap=JSON.parse(decodeURIComponent(escape(atob(raw.slice(5)))));
    if(!snap||snap.app!=="n5-guide")throw 0;
    const r=mergeSnapshot(snap);
    if(syncCfg())scheduleSyncPush(200);
    alert(r.changedLocal?"Progress loaded. The page will refresh.":"Nothing new in that code - you're already up to date.");
    if(r.changedLocal)location.reload();
  }catch(e){alert("That code didn't work. Copy the whole code, starting with N5G1.");}
}
// lifecycle: pull on load and when you come back to the tab; flush on leave
function initSync(){
  renderSyncPill();
  if(!syncCfg()){setSyncStatus("off");return;}
  syncNow({initial:true});
  document.addEventListener("visibilitychange",()=>{
    if(!syncCfg())return;
    if(document.visibilityState==="visible"){if(!syncState.busy)syncNow();}
    else if(syncState.status==="pending"){clearTimeout(syncState.timer);pushRemote(true).catch(()=>{});}
  });
  window.addEventListener("online",()=>syncNow());
}
setTimeout(initSync,0);

function loadRoadmap(){try{const r=localStorage.getItem("jpRoadmapDone");const a=r?JSON.parse(r):[];return Array.isArray(a)?a:[];}catch(e){return [];}}
function saveRoadmap(a){try{localStorage.setItem("jpRoadmapDone",JSON.stringify(a));}catch(e){}}
function fmtDate(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});}
function toggleRoadmapTask(id){
  let a=loadRoadmap();
  const i=a.indexOf(id);
  if(i>=0)a.splice(i,1);else a.push(id);
  saveRoadmap(a);
  renderRoadmap();
}

  const PHASES={0:"Phase 1 - Learn the content (weeks 1-12, about 45 min/day)",12:"Phase 2 - Keep it alive (months 4-9, about 20-30 min/day)",18:"Phase 3 - Sharpen (months 10-12)",21:"Phase 4 - Exam mode (about 11 weeks before the test)"};

let builderState=null;
function renderBuilderIntro(){
  const div=document.getElementById("unit-builder");
  if(!div)return;
  div.innerHTML=`<div class="unit-title">Sentence Builder</div>
  <div class="unit-sub">Read the English, then tap the Japanese pieces in the right order. Word order is the hardest part of Japanese - this drills it.</div>
  <div class="quiz-config-card">
    <div style="font-size:13px;color:#444;line-height:1.6">${BUILDER_ITEMS.length} sentences. Tap pieces to build the sentence, tap a placed piece to remove it, then press Check. Correct answers are played aloud.</div>
    <button class="quiz-start-btn" onclick="startBuilder(10)">Start (10 sentences)</button>
    <button class="quiz-secondary-btn" onclick="startBuilder(${BUILDER_ITEMS.length})">All ${BUILDER_ITEMS.length} sentences</button>
  </div>`;
}
function startBuilder(n){
  stopAll();
  const items=shuffleArr(BUILDER_ITEMS).slice(0,n);
  builderState={items:items,i:0,score:0,answer:[],chips:[],checked:false};
  loadBuilderQuestion();
}
function loadBuilderQuestion(){
  const s=builderState;
  const it=s.items[s.i];
  s.answer=[];
  s.checked=false;
  s.chips=shuffleArr(it.t.map((x,idx)=>({txt:x,idx:idx,used:false})));
  if(s.chips.length>1 && s.chips.every((c,k)=>c.idx===k)){s.chips.reverse();}
  renderBuilderQuestion();
}
function renderBuilderQuestion(msg){
  const div=document.getElementById("unit-builder");
  const s=builderState;
  const it=s.items[s.i];
  let html=`<div class="quiz-progress">Sentence ${s.i+1} of ${s.items.length} - Score ${s.score}</div>
  <div class="quiz-prompt-card"><div class="quiz-prompt-label">Build this sentence</div><div class="quiz-prompt-main">${it.en}</div></div>
  <div class="bld-answer" id="bldAnswer">`;
  if(!s.answer.length)html+=`<span class="bld-placeholder">Tap the pieces below</span>`;
  s.answer.forEach((c,k)=>{html+=`<button class="bld-chip placed" onclick="builderRemove(${k})">${c.txt}</button>`;});
  html+=`</div><div class="bld-bank">`;
  s.chips.forEach((c,k)=>{html+=`<button class="bld-chip${c.used?" used":""}" ${c.used?"disabled":""} onclick="builderPick(${k})">${c.txt}</button>`;});
  html+=`</div>`;
  if(msg)html+=`<div class="quiz-feedback">${msg}</div>`;
  if(!s.checked){
    html+=`<button class="quiz-start-btn" style="margin-top:6px" onclick="builderCheck()" ${s.answer.length?"":"disabled"}>Check</button>
    <button class="quiz-secondary-btn" onclick="builderReset()">Reset</button>`;
  }
  div.innerHTML=html;
}
function builderPick(k){
  const s=builderState;
  if(s.checked||s.chips[k].used)return;
  s.chips[k].used=true;
  s.answer.push(s.chips[k]);
  renderBuilderQuestion();
}
function builderRemove(k){
  const s=builderState;
  if(s.checked)return;
  const c=s.answer.splice(k,1)[0];
  c.used=false;
  renderBuilderQuestion();
}
function builderReset(){
  const s=builderState;
  s.answer=[];
  s.chips.forEach(c=>c.used=false);
  renderBuilderQuestion();
}
function builderCheck(){
  const s=builderState;
  const it=s.items[s.i];
  const mine=s.answer.map(c=>c.txt).join("");
  const right=it.t.join("");
  s.checked=true;
  const last=s.i>=s.items.length-1;
  let msg;
  if(mine===right){
    s.score++;
    msg=`<div class="quiz-fb-good">Correct!</div><div class="quiz-fb-rom">${right}</div>`;
    renderBuilderQuestion(msg);
    speakPhrase(right,it.en,null);
  } else {
    msg=`<div class="quiz-fb-bad">Not quite. Correct order:</div><div class="quiz-fb-rom">${it.t.join(" ")}</div><div class="quiz-fb-rom">You built: ${s.answer.map(c=>c.txt).join(" ")}</div>`;
    renderBuilderQuestion(msg);
  }
  const div=document.getElementById("unit-builder");
  div.insertAdjacentHTML("beforeend",`<button class="quiz-next-btn" onclick="${last?"builderResults()":"builderNext()"}">${last?"See Results":"Next Sentence"}</button>`);
}
function builderNext(){builderState.i++;loadBuilderQuestion();}
function builderResults(){
  const s=builderState;
  const pct=Math.round(s.score/s.items.length*100);
  document.getElementById("unit-builder").innerHTML=`<div class="quiz-result-card">
    <div class="quiz-result-score">${s.score} / ${s.items.length}</div>
    <div class="quiz-result-pct">${pct}%</div>
    <div class="quiz-result-msg">${pct>=90?"Excellent word order!":pct>=70?"Good. Review the ones you missed in Sentence Lab.":"Keep going - word order gets natural with repetition."}</div>
    <div class="quiz-result-buttons"><button class="quiz-start-btn" onclick="startBuilder(${s.items.length})">Try Again</button>
    <button class="quiz-secondary-btn" onclick="renderBuilderIntro()">Back</button></div></div>`;
}

const MOCK_ORDER=["kanji","vocab","grammar","reading","listening"];
let mockState=null;
function renderMockMenu(){
  const div=document.getElementById("unit-mock");
  if(!div)return;
  let html=`<div class="unit-title">Mock N5 Test</div>
  <div class="unit-sub">Questions modeled on the N5 sections (not real test questions). Take a part at a time, or the Full Mock.</div>
  <div class="quiz-config-card">`;
  MOCK_ORDER.forEach(k=>{
    const p=MOCK[k];
    html+=`<button class="quiz-secondary-btn" style="margin-top:0" onclick="startMock('${k}')">${p.title} - ${p.qs.length} questions (${p.time})</button>`;
  });
  html+=`<button class="quiz-start-btn" onclick="startMock('full')">Full Mock (${MOCK_ORDER.reduce((n,k)=>n+MOCK[k].qs.length,0)} questions)</button>
  <div style="font-size:12px;color:#888;line-height:1.6;margin-top:6px">The real N5 passes at about 44% overall with section minimums, but aim for 70%+ here so you have a margin. Listening plays text-to-speech audio - use headphones.</div></div>`;
  div.innerHTML=html;
}
function startMock(key){
  stopAll();
  let qs=[];
  const keys=key==="full"?MOCK_ORDER:[key];
  keys.forEach(k=>{MOCK[k].qs.forEach(x=>{qs.push(Object.assign({part:k},x));});});
  qs.forEach(x=>{x.opts=shuffleArr([x.c].concat(x.w));});
  mockState={key:key,qs:qs,i:0,score:0,answered:false,misses:[],byPart:{}};
  MOCK_ORDER.forEach(k=>{mockState.byPart[k]={n:0,s:0};});
  renderMockQuestion();
}
function renderMockQuestion(){
  const s=mockState;
  const it=s.qs[s.i];
  const div=document.getElementById("unit-mock");
  let html=`<div class="quiz-progress">${MOCK[it.part].title} - Question ${s.i+1} of ${s.qs.length} - Score ${s.score}</div>`;
  if(it.p)html+=`<div class="quiz-prompt-card" style="text-align:left"><div class="quiz-prompt-label">Read</div><div class="quiz-prompt-main" style="font-size:17px;line-height:1.7">${it.p}</div></div>`;
  html+=`<div class="quiz-prompt-card">`;
  if(it.a){
    html+=`<div class="quiz-prompt-label">Listen</div><button class="quiz-start-btn" style="margin:0 0 12px" onclick="speak(mockState.qs[mockState.i].a)">&#9654; Play audio</button>`;
  }
  const isJp=!it.a && !it.p;
  html+=`<div class="quiz-prompt-main${it.part==="kanji"?" quiz-jp":""}">${it.q}</div></div>
  <div class="quiz-options" id="mockOptions">`;
  it.opts.forEach((o,k)=>{html+=`<button class="quiz-option-btn" onclick="mockAnswer(${k})">${o}</button>`;});
  html+=`</div><div class="quiz-feedback" id="mockFeedback"></div><div id="mockNextWrap"></div>`;
  div.innerHTML=html;
  s.answered=false;
  if(it.a)setTimeout(()=>speak(it.a),300);
}
function mockAnswer(k){
  const s=mockState;
  if(s.answered)return;
  s.answered=true;
  const it=s.qs[s.i];
  const ok=it.opts[k]===it.c;
  s.byPart[it.part].n++;
  if(ok){s.score++;s.byPart[it.part].s++;}
  else s.misses.push(it);
  document.querySelectorAll("#mockOptions .quiz-option-btn").forEach((b,idx)=>{
    b.classList.add("disabled");
    if(it.opts[idx]===it.c)b.classList.add("correct");
    else if(idx===k)b.classList.add("wrong");
  });
  document.getElementById("mockFeedback").innerHTML=(ok?`<div class="quiz-fb-good">Correct!</div>`:`<div class="quiz-fb-bad">Not quite.</div>`)+`<div class="quiz-fb-rom">${it.e}</div>`;
  const last=s.i>=s.qs.length-1;
  document.getElementById("mockNextWrap").innerHTML=`<button class="quiz-next-btn" onclick="${last?"mockResults()":"mockNext()"}">${last?"See Results":"Next"}</button>`;
}
function mockNext(){mockState.i++;renderMockQuestion();}
function mockResults(){
  const s=mockState;
  const pct=Math.round(s.score/s.qs.length*100);
  let html=`<div class="quiz-result-card"><div class="quiz-result-score">${s.score} / ${s.qs.length}</div><div class="quiz-result-pct">${pct}%</div>
  <div class="quiz-result-msg">${pct>=80?"Excellent - you are on track for N5.":pct>=70?"Solid. Review the misses below.":pct>=50?"Getting there. Focus on the weakest part.":"Keep studying - revisit the roadmap tasks for the weak parts."}</div>`;
  if(s.key==="full"){
    html+=`<div style="margin-top:14px;text-align:left">`;
    MOCK_ORDER.forEach(k=>{const b=s.byPart[k];if(b.n)html+=`<div style="font-size:13px;color:#444;margin:4px 0">${MOCK[k].title}: ${b.s}/${b.n} (${Math.round(b.s/b.n*100)}%)</div>`;});
    html+=`</div>`;
  }
  if(s.misses.length){
    html+=`<div style="margin-top:16px;text-align:left;font-size:13px;font-weight:700;color:#993C1D">Review your misses</div>`;
    s.misses.forEach(m=>{html+=`<div style="margin-top:8px;text-align:left;font-size:13px;color:#444;border-left:3px solid #993C1D;padding-left:8px"><b>${m.a?"(audio) "+m.a:m.q}</b><br>Answer: ${m.c}<br><span style="color:#888">${m.e}</span></div>`;});
  }
  html+=`<div class="quiz-result-buttons"><button class="quiz-start-btn" onclick="startMock('${s.key}')">Try Again</button><button class="quiz-secondary-btn" onclick="renderMockMenu()">Back to Mock Menu</button></div></div>`;
  document.getElementById("unit-mock").innerHTML=html;
}


// ── Hide-romaji mode: global toggle + tap-to-reveal ─────────────
const ROM_SEL=".romaji,.vocab-rom,.chat-rom,.kana-rom,.conj-rom,.num-rom,.grammar-ex-rom,.kosoado-rom,.star-flip-rom";
function setRomajiHidden(on){
  document.body.classList.toggle("hide-romaji",on);
  document.querySelectorAll(".rom-shown").forEach(el=>el.classList.remove("rom-shown"));
  const b=document.getElementById("romToggleBtn");
  if(b){b.classList.toggle("on",on);b.textContent=on?"Show romaji":"Hide romaji";b.setAttribute("aria-pressed",on?"true":"false");}
  try{localStorage.setItem("jpHideRomaji",on?"1":"0");}catch(e){}
}
function toggleRomajiMode(){setRomajiHidden(!document.body.classList.contains("hide-romaji"));}
// capture phase so a tap on hidden romaji reveals it instead of also playing the row's audio
document.addEventListener("click",function(ev){
  if(!document.body.classList.contains("hide-romaji"))return;
  const el=ev.target.closest&&ev.target.closest(ROM_SEL);
  if(!el||!el.textContent.trim())return;
  ev.stopPropagation();ev.preventDefault();
  el.classList.toggle("rom-shown");
},true);
(function initRomajiMode(){
  let on=false;
  try{on=localStorage.getItem("jpHideRomaji")==="1";}catch(e){}
  setRomajiHidden(on);
})();

function furi(t){return String(t).replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/\n/g,"<br>");}
function plainJp(t){return String(t).replace(/\{([^|}]+)\|([^}]+)\}/g,"$1").replace(/\n+/g,"。").replace(/。。+/g,"。");}
function loadReadDone(){try{const a=JSON.parse(localStorage.getItem("jpReadingDone")||"[]");return Array.isArray(a)?a:[];}catch(e){return [];}}
function saveReadDone(a){try{localStorage.setItem("jpReadingDone",JSON.stringify(a));}catch(e){}}
let readState={};
function renderReading(){
  const div=document.getElementById("unit-reading");
  if(!div)return;
  const done=loadReadDone();
  let html=`<div class="unit-title">Reading Practice</div>
  <div class="unit-sub">${READING.length} short passages in the style of the N5 reading section. ${done.length} of ${READING.length} completed.</div>
  <div class="info-card green"><div class="info-card-title">How to use</div><div class="info-card-body">1) Read the passage once without help. 2) Answer the questions. 3) Check the translation only after answering. 4) Press Listen and read along. Once a passage is easy, turn furigana off and read it again. Real N5 passages use spaces between words, just like these.</div></div>
  <div class="rd-toolbar"><button class="rom-toggle" id="furiBtn" onclick="toggleFurigana()">${document.body.classList.contains("hide-furi")?"Show furigana":"Hide furigana"}</button></div>`;
  READING.forEach((r,ri)=>{
    const isDone=done.indexOf(r.id)>=0;
    html+=`<div class="section-divider ${isDone?"":"blue"}">${ri+1}. <span class="rd-title">${furi(r.title)}</span> <span class="rd-tag">${r.type}</span>${isDone?' <span class="rd-done">&#10003; done</span>':""}</div>
    <div class="rd-card">
      <div class="rd-text">${furi(r.text)}</div>
      <div class="rd-actions">
        <button class="rd-btn" onclick="readListen(${ri},this)">&#9654; Listen</button>
        <button class="rd-btn" onclick="this.closest('.rd-card').querySelector('.rd-en').classList.toggle('show')">Translation</button>
      </div>
      <div class="rd-en">${r.en}</div>
      <div class="rd-qs">`;
    r.qs.forEach((q,qi)=>{
      const opts=shuffleArr([q.c].concat(q.w));
      html+=`<div class="rd-q" id="rdq-${ri}-${qi}"><div class="rd-qtext">Q${qi+1}. ${furi(q.q)}</div><div class="rd-qen">${q.qen}</div><div class="rd-opts">`;
      opts.forEach(o=>{html+=`<button class="rd-opt" data-ok="${o===q.c?1:0}" onclick="readAnswer(${ri},${qi},this)">${o}</button>`;});
      html+=`</div><div class="rd-fb"></div></div>`;
    });
    html+=`</div></div>`;
  });
  div.innerHTML=html;
}
function readListen(ri,btn){
  const r=READING[ri];
  speakPhrase(plainJp(r.text),r.en,btn);
}
function readAnswer(ri,qi,btn){
  const box=document.getElementById(`rdq-${ri}-${qi}`);
  if(box.dataset.answered)return;
  box.dataset.answered="1";
  const ok=btn.dataset.ok==="1";
  box.dataset.correct=ok?"1":"0";
  box.querySelectorAll(".rd-opt").forEach(b=>{b.disabled=true;if(b.dataset.ok==="1")b.classList.add("correct");else if(b===btn)b.classList.add("wrong");});
  box.querySelector(".rd-fb").innerHTML=`<b>${ok?"Correct!":"Not quite."}</b> ${furi(READING[ri].qs[qi].e)}`;
  const all=[...document.querySelectorAll(`[id^="rdq-${ri}-"]`)];
  if(all.every(b=>b.dataset.answered)&&all.every(b=>b.dataset.correct==="1")){
    const d=loadReadDone();if(d.indexOf(READING[ri].id)<0){d.push(READING[ri].id);saveReadDone(d);}
  }
}
function toggleFurigana(){
  const on=!document.body.classList.contains("hide-furi");
  document.body.classList.toggle("hide-furi",on);
  try{localStorage.setItem("jpHideFuri",on?"1":"0");}catch(e){}
  const b=document.getElementById("furiBtn");if(b){b.textContent=on?"Show furigana":"Hide furigana";b.classList.toggle("on",on);}
}
(function(){try{if(localStorage.getItem("jpHideFuri")==="1")document.body.classList.add("hide-furi");}catch(e){}})();

// ── Generated drills: verb conjugation and adjective forms
const A_ROW={"い":"わ","き":"か","ぎ":"が","し":"さ","ち":"た","に":"な","び":"ば","み":"ま","り":"ら"};
function _uniq3(correct,cands){
  const out=[];const seen=new Set([correct]);
  cands.forEach(c=>{if(c&&c.length>=2&&!seen.has(c)){seen.add(c);out.push(c);}});
  return shuffleArr(out).slice(0,3);
}
function buildVerbDrills(){
  const out=[];
  units.forEach(u=>(u.sections||[]).forEach(sec=>{
    if(!/masu.*te.*nai/i.test(sec.title||""))return;
    (sec.phrases||[]).forEach(p=>{
      const parts=(p.jp||"").split("→");
      if(parts.length!==3||!/ます$/.test(parts[0]))return;
      const masu=parts[0],te=parts[1],nai=parts[2];
      const stem=masu.slice(0,-2),base=stem.slice(0,-1),last=stem.slice(-1);
      const roms=(p.rom||"").split(" - ");
      const meaning=p.en||"";
      const vset=/^More/.test(sec.title)?"more verbs":"core verbs";
      const wTe=_uniq3(te,[stem+"て",stem+"って",base+"って",base+"んで",base+"いて",base+"して"]);
      if(wTe.length===3)out.push({fixed:true,prompt:`${masu} <span class="qz-sub">(${meaning})</span>`,label:"Make the て-form",correct:te,wrong:wTe,expl:`${masu} → ${te}${roms[1]?" ("+roms[1]+")":""}${p.note?". "+p.note:""}`,speak:te,key:"te|"+masu,sub:"て-form · "+vset});
      const toTa=x=>x.replace(/て$/,"た").replace(/で$/,"だ");
      const ta=toTa(te);
      const wTa=_uniq3(ta,[stem+"た",stem+"った",base+"った",base+"んだ",base+"いた",base+"した",masu.slice(0,-2)+"ました"]);
      if(wTa.length===3)out.push({fixed:true,prompt:`${masu} <span class="qz-sub">(${meaning})</span>`,label:"Make the た-form (plain past)",correct:ta,wrong:wTa,expl:`Same as the て-form with て→た / で→だ: ${te} → ${ta}`,speak:ta,key:"ta|"+masu,sub:"た-form · "+vset});
      const wNai=_uniq3(nai,[stem+"ない",(A_ROW[last]?base+A_ROW[last]+"ない":""),base+"らない",base+"わない",stem+"らない",base+"かない"]);
      if(wNai.length===3)out.push({fixed:true,prompt:`${masu} <span class="qz-sub">(${meaning})</span>`,label:"Make the ない-form",correct:nai,wrong:wNai,expl:`${masu} → ${nai}${roms[2]?" ("+roms[2]+")":""}${p.note?". "+p.note:""}`,speak:nai,key:"nai|"+masu,sub:"ない-form · "+vset});
    });
  }));
  return out;
}
function buildAdjDrills(){
  const out=[];
  const u=units.find(x=>x.id==="n5vocab");
  if(!u)return out;
  u.sections.forEach(sec=>{
    const isI=/^い-adjectives/.test(sec.title),isNa=/^な-adjectives/.test(sec.title);
    if(!isI&&!isNa)return;
    sec.phrases.forEach(p=>{
      const words=p.jp.split(" / ").map(s=>s.trim());
      const ens=(p.en||"").split(" / ").map(s=>s.trim());
      words.forEach((w,i)=>{
        if(!w||w==="いい")return;
        const en=ens[i]||ens[0]||"";
        if(isI&&/い$/.test(w)){
          const s=w.slice(0,-1);
          out.push({fixed:true,prompt:`${w} <span class="qz-sub">(${en})</span>`,label:"Plain negative (not ___)",correct:s+"くない",wrong:[w+"ない",s+"じゃない",s+"くなかった"],expl:`い-adjective: drop い + くない → ${s}くない`,speak:s+"くない",key:"ineg|"+w,sub:"い-adjectives: negative"});
          out.push({fixed:true,prompt:`${w} <span class="qz-sub">(${en})</span>`,label:"Plain past (was ___)",correct:s+"かった",wrong:[w+"かった",s+"だった",s+"くなかった"],expl:`い-adjective: drop い + かった → ${s}かった`,speak:s+"かった",key:"ipast|"+w,sub:"い-adjectives: past"});
        } else if(isNa){
          out.push({fixed:true,prompt:`${w} <span class="qz-sub">(${en})</span>`,label:"Polite negative (is not ___)",correct:w+"じゃないです",wrong:[w+"くないです",w+"ないです",w+"でした"],expl:`な-adjective: + じゃないです (or じゃありません). ${/い$/.test(w)?"Trap: it ends in い but it is a な-adjective!":""}`,speak:w+"じゃないです",key:"naneg|"+w,sub:"な-adjectives: negative"});
          out.push({fixed:true,prompt:`${w} <span class="qz-sub">(${en})</span>`,label:"Polite past (was ___)",correct:w+"でした",wrong:[w+"かったです",w+"いでした",w+"じゃなかったです"],expl:`な-adjective: + でした. ${/い$/.test(w)?"Trap: it ends in い but it is a な-adjective!":""}`,speak:w+"でした",key:"napast|"+w,sub:"な-adjectives: past"});
        }
      });
    });
  });
  return out;
}
function fillSub(x){
  const c=x.c,e=x.e||"";
  if(/^(を|に|で|が|は|も|と|へ|の|から|まで|より|や|か|ね|よ)$/.test(c))return "Particles";
  if(/^(どこ|いつ|だれ|だれの|どう|どれ|いくら|いくつ|どちら|どうやって|なに|なん|なんにん|なんまい|なんじ)$/.test(c))return "Question words";
  if(/^(この|その|あの|どの|これ|それ|あれ|ここ|そこ|あそこ)$/.test(c))return "Ko-so-a-do (this / that)";
  if(/count|^People:/i.test(e))return "Counters";
  if(/^(あまり|ぜんぜん|まだ|もう|とても|すこし|よく|しか|だけ)$/.test(c))return "Adverbs, だけ / しか";
  if(/^(まえ|まえに|あとで|とき)$/.test(c))return "Before / after / when";
  if(/adjective/i.test(e))return "Adjective forms";
  return "Verbs & sentence patterns";
}
function buildFillinDrills(){
  const out=[];
  const add=(x,src,sub)=>out.push({sub:sub||fillSub(x),fixed:true,prompt:x.q.replace("（　）",'<span class="qz-blank">（　）</span>').replace("B：","<br>B：")+(x.h?`<div class="qz-hint">${x.h}</div>`:""),label:src,correct:x.c,wrong:x.w.slice(0,3),expl:x.e,speak:x.q.replace("（　）",x.c).replace(/^A：|B：/g," "),key:"fill|"+x.q});
  FILLIN_EXTRA.forEach(x=>add(x,"Fill in the blank"));
  MOCK.grammar.qs.forEach(x=>add(x,"Fill in the blank"));

  return out;
}

// near-miss readings, the way real N5 kanji questions trick you
const DAKU={"か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご","さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ","た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど","は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ"};
const UNDAKU={};Object.keys(DAKU).forEach(k=>{UNDAKU[DAKU[k]]=k;});
const SMALL={"ゃ":"や","ゅ":"ゆ","ょ":"よ"};
const O_ROW="おこそとのほもよろごぞどぼぽょ";
function readingVariants(r){
  const out=new Set();
  const ch=[...r];
  // 1. dakuten on / off at each position (first two positions first)
  ch.forEach((c,i)=>{if(DAKU[c]){const t=ch.slice();t[i]=DAKU[c];out.add(t.join(""));}else if(UNDAKU[c]){const t=ch.slice();t[i]=UNDAKU[c];out.add(t.join(""));}});
  // 2. small っ removed / added
  ch.forEach((c,i)=>{if(c==="っ"){const t=ch.slice();t.splice(i,1);out.add(t.join(""));}});
  for(let i=1;i<ch.length;i++){if(/[かきくけこさしすせそたちつてとぱぴぷぺぽ]/.test(ch[i])&&ch[i-1]!=="っ"&&ch[i-1]!=="ん"){const t=ch.slice();t.splice(i,0,"っ");out.add(t.join(""));break;}}
  // 3. long vowel う removed / added after o-sounds
  ch.forEach((c,i)=>{if(c==="う"&&i>0&&O_ROW.indexOf(ch[i-1])>=0){const t=ch.slice();t.splice(i,1);out.add(t.join(""));}});
  for(let i=0;i<ch.length;i++){if(O_ROW.indexOf(ch[i])>=0&&ch[i+1]!=="う"&&!SMALL[ch[i+1]]){const t=ch.slice();t.splice(i+1,0,"う");out.add(t.join(""));break;}}
  // 4. small ゃゅょ written big
  ch.forEach((c,i)=>{if(SMALL[c]){const t=ch.slice();t[i]=SMALL[c];out.add(t.join(""));}});
  // 5. ん dropped
  ch.forEach((c,i)=>{if(c==="ん"&&i>0){const t=ch.slice();t.splice(i,1);out.add(t.join(""));}});
  out.delete(r);
  return [...out].filter(x=>x.length>=1);
}
function buildKanjiReadDrills(){
  const out=[];
  const u=units.find(x=>x.id==="kanjiplus");
  if(!u)return out;
  const all=[];
  u.sections.forEach(sec=>(sec.phrases||[]).forEach(p=>{if(p.kana)all.push({p:p,sec:sec});}));
  const allKana=new Set(all.map(x=>x.p.kana));
  all.forEach(({p,sec})=>{
    const near=shuffleArr(readingVariants(p.kana));
    const same=shuffleArr(all.filter(x=>x.sec===sec&&x.p!==p&&Math.abs(x.p.kana.length-p.kana.length)<=1).map(x=>x.p.kana));
    const w=[];const seen=new Set([p.kana]);near.concat(same).forEach(c=>{if(w.length<3&&c&&!seen.has(c)){seen.add(c);w.push(c);}});
    if(w.length===3)out.push({fixed:true,prompt:`<span class="quiz-jp" style="font-size:30px">${p.jp}</span>`,label:"How is this word read?",correct:p.kana,wrong:w,expl:`${p.jp} = ${p.kana} (${p.en})${p.note?". "+p.note:""}`,speak:p.kana,key:"kw|"+p.jp,sub:sec.title});
  });
  return out;
}
function buildReadingDrills(){
  const out=[];
  if(typeof READING==="undefined")return out;
  READING.forEach((r,ri)=>r.qs.forEach((q,qi)=>out.push({sub:(ri+1)+". "+plainJp(r.title)+" ("+r.type+")",fixed:true,prompt:`<div class="qz-passage">${furi(r.text)}</div><div class="qz-rq">${furi(q.q)}</div><div class="qz-hint">${q.qen}</div>`,label:"Reading: "+r.type,correct:q.c,wrong:q.w.slice(0,3),expl:furi(q.e),speak:q.c,key:"rd|"+r.id+"|"+qi})));
  return out;
}

function collectQuizItemsFromUnit(u){
  const out=[];
  (u.sections||[]).forEach(sec=>{
    (sec.phrases||[]).forEach(p=>{
      const en=p.en||p.rom||"";
      if(p.jp&&en&&JP_RE.test(p.jp)&&p.jp.indexOf("→")===-1&&p.jp.length<=45&&en.length<=80&&p.jp!==en)out.push({jp:p.jp,en:en,rom:p.rom||"",sub:sec.title||"Other"});
    });

function topicItems(id){
  if(SPECIAL_TOPICS[id])return SPECIAL_TOPICS[id].build();
  if(id==="saved")return loadSaved().map(s=>({jp:s.jp,en:s.en,rom:s.rom||"",sub:"Saved phrases"}));

function kanaItemsWithRows(){
  const rowOf=r=>{if(/^[aiueo]$/.test(r))return "a";if(r==="n"||/^w/.test(r))return "w";if(/^(sh|s)/.test(r))return "s";if(/^(ch|ts|t)/.test(r))return "t";if(/^(f|h)/.test(r))return "h";return r[0];};
  const items=KANA_QUIZ_ITEMS.map(k=>({jp:k.c,en:k.r,rom:k.r,_s:/[\u3041-\u309f]/.test(k.c)?"Hiragana":"Katakana",_r:rowOf(k.r)}));
  const chars={};items.forEach(it=>{const key=it._s+"|"+it._r;(chars[key]=chars[key]||[]).push(it.jp);});
  items.forEach(it=>{it.sub=it._s+": "+chars[it._s+"|"+it._r].join(" ");delete it._s;delete it._r;});
  return items;
}
function topicLabel(id){
  if(SPECIAL_TOPICS[id])return SPECIAL_TOPICS[id].label;

function itemKey(it){return it.fixed?it.key:(it.jp+"|"+it.en);}
function dedupeQuizItems(items){
  const seen=new Set(),out=[];
  items.forEach(it=>{const k=itemKey(it);if(!seen.has(k)){seen.add(k);out.push(it);}});
  return out;
}
function buildQuizPool(ids,excl){

  QUIZ_GROUPS.forEach((g,gi)=>{
    let chips="",panels="";
    g.ids.forEach(id=>{
      if(!SPECIAL_TOPICS[id]&&id!=="saved"&&id!=="kana"&&!units.find(u=>u.id===id))return;
      const n=topicItemsCached(id).length;
      const isReview=id==="__starred"||id==="saved";
      if(!n&&!isReview)return;
      const on=quizSel.topics.indexOf(id)>=0&&n>0;
      const selN=on?topicSelCount(id):0;
      const subs=topicSubs(id);
      const open=on&&quizOpen.indexOf(id)>=0;
      const countTxt=on&&selN<n?`${selN}/${n}`:`${n}`;
      chips+=`<span class="qz-topic${on?" on":""}${n?"":" empty"}${open?" open":""}" data-id="${id}">
        <button class="qz-topic-main" ${n?"":"disabled"} onclick="qzTapTopic('${id}')" aria-pressed="${on}"><span class="qz-name">${topicLabel(id)}</span><span class="qz-n">${countTxt}</span></button>${on&&subs.length>1?`<button class="qz-caret" onclick="qzTogglePanel('${id}')" aria-label="Choose sections of ${topicLabel(id)}" aria-expanded="${open}">${open?"&#9650;":"&#9660;"}</button>`:""}
      </span>`;
      if(open&&subs.length>1){
        const ex=quizSel.excl[id]||[];
        panels+=`<div class="qz-subpanel"><div class="qz-subhead"><b>${topicLabel(id)}</b> <span class="qz-note">${selN} of ${n} questions</span>
          <span class="qz-subbtns"><button class="qz-mini" onclick="qzSubAll('${id}',true)">All</button><button class="qz-mini" onclick="qzSubAll('${id}',false)">None</button><button class="qz-mini" onclick="qzTogglePanel('${id}')">Done</button></span></div>
          <div class="qz-subchips">${subs.map((s,si)=>`<button class="qz-sub${ex.indexOf(s.name)<0?" on":""}" onclick="qzToggleSub('${id}',${si})">${escHtml(s.name)} <span class="qz-n">${s.n}</span></button>`).join("")}</div></div>`;
      }
    });
    if(chips)html+=`<div class="qz-group"><div class="qz-group-head"><span>${g.name}</span><button class="qz-mini" onclick="quizGroupToggle(${gi})">all</button></div><div class="qz-chips">${chips}</div>${panels}</div>`;
  });
  box.innerHTML=html;
  updateQuizAvail();
}
function qzTapTopic(id){
  const i=quizSel.topics.indexOf(id);
  if(i>=0){quizSel.topics.splice(i,1);quizOpen=quizOpen.filter(x=>x!==id);}
  else{
    quizSel.topics.push(id);
    const ex=quizSel.excl[id]||[];
    if(topicSubs(id).every(s=>ex.indexOf(s.name)>=0))delete quizSel.excl[id]; // re-adding a fully emptied topic starts with everything
    if(topicSubs(id).length>1&&quizOpen.indexOf(id)<0)quizOpen.push(id);
  }
  renderQuizTopics();
}
function qzTogglePanel(id){
  const i=quizOpen.indexOf(id);
  if(i>=0)quizOpen.splice(i,1);else quizOpen.push(id);
  renderQuizTopics();
}
function qzToggleSub(id,si){
  const sub=topicSubs(id)[si];if(!sub)return;
  const ex=(quizSel.excl[id]=quizSel.excl[id]||[]);
  const j=ex.indexOf(sub.name);
  if(j>=0)ex.splice(j,1);else ex.push(sub.name);
  if(!ex.length)delete quizSel.excl[id];
  renderQuizTopics();
}
function qzSubAll(id,on){
  if(on)delete quizSel.excl[id];
  else quizSel.excl[id]=topicSubs(id).map(s=>s.name);
  renderQuizTopics();
}
function quizSelectAll(on){
  if(on){quizSel.topics=quizTopicIds().filter(id=>topicItemsCached(id).length);quizSel.excl={};}
  else{quizSel.topics=[];quizOpen=[];}
  renderQuizTopics();
}
function quizGroupToggle(gi){
  const ids=QUIZ_GROUPS[gi].ids.filter(id=>quizTopicIds().indexOf(id)>=0&&topicItemsCached(id).length);
  const allOn=ids.length&&ids.every(id=>quizSel.topics.indexOf(id)>=0);
  if(allOn){quizSel.topics=quizSel.topics.filter(id=>ids.indexOf(id)<0);quizOpen=quizOpen.filter(id=>ids.indexOf(id)<0);}
  else ids.forEach(id=>{if(quizSel.topics.indexOf(id)<0)quizSel.topics.push(id);delete quizSel.excl[id];});
  renderQuizTopics();
}
function updateQuizAvail(){
  if(!quizSel)return;
  saveQuizPrefs(quizSel);
  const el=document.getElementById("qzAvail"),btn=document.getElementById("qzStart");
  if(!el)return;
  const active=quizSel.topics.filter(id=>topicItemsCached(id).length&&topicSelCount(id)>0);
  let avail=0;const seen=new Set();
  active.forEach(id=>{const ex=quizSel.excl[id]||[];topicItemsCached(id).forEach(it=>{if(ex.indexOf(it.sub||"Other")<0){const k=itemKey(it);if(!seen.has(k)){seen.add(k);avail++;}}});});
  const n=quizSel.count==="all"?avail:Math.min(avail,parseInt(quizSel.count,10));
  el.innerHTML=active.length?`<b>${avail}</b> questions available in ${active.length} topic${active.length>1?"s":""} &middot; this quiz: <b>${n}</b>`:"Tap at least one topic.";
  btn.disabled=avail<1;
}
function setQuizDirection(btn){
  document.querySelectorAll(".quiz-toggle-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");quizSel.dir=btn.dataset.dir;updateQuizAvail();
}
function setQuizCount(btn){
  document.querySelectorAll(".quiz-count-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");quizSel.count=btn.dataset.count;updateQuizAvail();
}
function quizLabelFor(ids,excl){
  excl=excl||{};
  const names=ids.map(id=>{
    const ex=excl[id]||[];
    if(!ex.length)return topicLabel(id);
    const inc=topicSubs(id).filter(s=>ex.indexOf(s.name)<0).map(s=>s.name);
    return topicLabel(id)+(inc.length===1?": "+inc[0]:" ("+inc.length+" sections)");
  });
  return names.length<=3?names.join(", "):names.slice(0,2).join(", ")+` +${names.length-2} more`;
}
function startQuiz(opts){
  stopAll();
  const p=opts||currentQuizPrefs();
  if(!opts)saveQuizPrefs(p);
  if(!opts)p.topics=p.topics.filter(id=>topicSelCount(id)>0);
  const pool=p.pool||buildQuizPool(p.topics,p.excl);
  if(!pool.length){alert("Tick at least one topic with questions.");return;}
  const shuffled=shuffleArr(p.only||pool);
  const total=p.count==="all"?shuffled.length:Math.min(parseInt(p.count,10),shuffled.length);
  quizState={
    topics:p.topics,excl:p.excl,topicLabel:p.label||quizLabelFor(p.topics,p.excl),direction:p.dir,count:p.count,
    pool:pool,questions:shuffled.slice(0,total),index:0,score:0,answered:false,missed:[]
  };
  renderQuizQuestion();
}
function makeOptions(item,isEnToJp){
  const correctText=isEnToJp?item.jp:item.en;
  const seen=new Set([correctText.trim().toLowerCase()]);
  const ds=[];
  const tryFrom=list=>{for(const o of shuffleArr(list)){if(ds.length>=3)break;if(o.fixed||o===item)continue;const t=(isEnToJp?o.jp:o.en).trim();const k=t.toLowerCase();if(!t||seen.has(k))continue;seen.add(k);ds.push(t);}};
  tryFrom(quizState.pool);
  if(ds.length<3)tryFrom(globalBank());
  return {options:shuffleArr([correctText].concat(ds)),correctText:correctText};
}
function renderQuizQuestion(){
  const div=document.getElementById("unit-quiz");
  const qs=quizState;
  const item=qs.questions[qs.index];
  let promptHtml,label,options,correctText,promptJp=false;
  if(item.fixed){
    label=item.label;promptHtml=item.prompt;correctText=item.correct;
    options=shuffleArr([item.correct].concat(item.wrong));promptJp=true;
  } else {
    const isEnToJp=qs.direction==="mixed"?Math.random()<0.5:qs.direction==="en-jp";
    const o=makeOptions(item,isEnToJp);
    options=o.options;correctText=o.correctText;
    label=isEnToJp?"English &rarr; Japanese":"Japanese &rarr; English";
    promptHtml=isEnToJp?item.en:item.jp;promptJp=!isEnToJp;
  }
  qs.currentOptions=options;qs.currentCorrectIndex=options.indexOf(correctText);qs.currentItem=item;qs.answered=false;
  const optJp=JP_RE.test(correctText);
  let html=`<div class="quiz-progress">Question ${qs.index+1} of ${qs.questions.length} &middot; ${qs.topicLabel} &middot; Score ${qs.score}</div>
  <div class="quiz-prompt-card"><div class="quiz-prompt-label">${label}</div>
    <div class="quiz-prompt-main${promptJp&&!item.fixed?" quiz-jp":""}${item.fixed?" qz-fixed":""}">${promptHtml}</div></div>
  <div class="quiz-options" id="quizOptions">`;
  options.forEach((opt,i)=>{html+=`<button class="quiz-option-btn ${optJp?"quiz-option-jp":""}" onclick="selectQuizAnswer(${i})">${opt}</button>`;});
  html+=`</div><div class="quiz-feedback" id="quizFeedback"></div><div id="quizNextWrap"></div>
  <button class="qz-quit" onclick="showQuizResults()">End quiz now</button>`;
  div.innerHTML=html;
}
function quizPlayCurrent(btn){
  const it=quizState.currentItem;
  if(it.fixed)speakPhrase(it.speak||it.correct,"",btn);else speakPhrase(it.jp,it.en,btn);
}
function selectQuizAnswer(i){
  const qs=quizState;
  if(qs.answered)return;
  qs.answered=true;
  const correct=i===qs.currentCorrectIndex;
  const item=qs.currentItem;
  if(correct)qs.score++;else qs.missed.push(item);
  document.querySelectorAll("#quizOptions .quiz-option-btn").forEach((b,idx)=>{
    b.classList.add("disabled");
    if(idx===qs.currentCorrectIndex)b.classList.add("correct");
    else if(idx===i)b.classList.add("wrong");
  });
  const play=`<button class="quiz-fb-play" onclick="quizPlayCurrent(this)">&gt;&gt;</button>`;
  let body;
  if(item.fixed)body=`<div class="quiz-fb-rom">${correct?"":"Answer: <b>"+item.correct+"</b><br>"}${item.expl||""}</div>`;
  else body=correct?(item.rom?`<div class="quiz-fb-rom">${item.rom}</div>`:""):`<div class="quiz-fb-rom">${item.jp}${item.rom&&item.rom!==item.en?" &middot; "+item.rom:""} &mdash; ${item.en}</div>`;
  document.getElementById("quizFeedback").innerHTML=(correct?`<div class="quiz-fb-good">Correct!${play}</div>`:`<div class="quiz-fb-bad">Not quite &mdash; correct answer:${play}</div>`)+body;
  const isLast=qs.index>=qs.questions.length-1;
  document.getElementById("quizNextWrap").innerHTML=`<button class="quiz-next-btn" onclick="${isLast?"showQuizResults()":"nextQuizQuestion()"}">${isLast?"See Results":"Next Question"}</button>`;
}
function nextQuizQuestion(){quizState.index++;renderQuizQuestion();}
function showQuizResults(){
  const qs=quizState;
  const done=qs.index+(qs.answered?1:0);
  const asked=Math.max(done,1);
  const pct=Math.round(qs.score/asked*100);
  const msg=pct>=90?"Excellent! You've got this down.":pct>=70?"Great job!":pct>=50?"Good effort, keep practicing!":"Keep at it - repetition is how it sticks.";
  let missHtml="";
  if(qs.missed.length){
    missHtml=`<div class="qz-miss-head">Review your misses</div>`+qs.missed.map(m=>m.fixed
      ?`<div class="qz-miss"><div>${m.prompt}</div><div>Answer: <b>${m.correct}</b></div></div>`
      :`<div class="qz-miss"><div class="quiz-jp" style="font-size:16px">${m.jp}</div><div>${m.rom&&m.rom!==m.en?m.rom+" &middot; ":""}${m.en}</div></div>`).join("");
  }
  document.getElementById("unit-quiz").innerHTML=`<div class="quiz-result-card">
    <div class="quiz-result-score">${qs.score} / ${done}</div>
    <div class="quiz-result-pct">${pct}% &middot; ${qs.topicLabel}</div>
    <div class="quiz-result-msg">${msg}</div>
    <div class="quiz-result-buttons">
      ${qs.missed.length?`<button class="quiz-start-btn" onclick="retryMissed()">Retry missed (${qs.missed.length})</button>`:""}
      <button class="${qs.missed.length?"quiz-secondary-btn":"quiz-start-btn"}" onclick="retryQuiz()">New round, same topics</button>
      <button class="quiz-secondary-btn" onclick="renderQuizTab()">Change topics</button>
    </div>${missHtml}
  </div>`;
}
function retryQuiz(){const q=quizState;startQuiz({topics:q.topics,excl:q.excl,dir:q.direction,count:q.count,pool:buildQuizPool(q.topics,q.excl),label:q.topicLabel});}
function retryMissed(){const q=quizState;startQuiz({topics:q.topics,dir:q.direction,count:"all",pool:q.pool,only:q.missed.slice(),label:"Missed: "+q.topicLabel});}

  keys.forEach(k=>{
