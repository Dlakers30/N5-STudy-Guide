<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Donovan's JLPT N5 Guide</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="N5 Guide">
<meta name="theme-color" content="#0F6E56">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Donovan%27s%20JLPT%20N5%20Guide%22%2C%22short_name%22%3A%22JP%20Guide%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230F6E56%22%2C%22theme_color%22%3A%22%230F6E56%22%7D">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F0F4F2;color:#1a1a1a;}
.header{background:#0F6E56;color:white;padding:20px;text-align:center;}
.header h1{font-size:22px;margin-bottom:4px;}
.header p{font-size:13px;opacity:0.85;}
.install-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:200;background:#0F6E56;color:white;padding:max(12px,env(safe-area-inset-top)) 16px 12px;flex-direction:column;gap:6px;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.install-banner.show{display:flex;}
.install-banner-row{display:flex;align-items:center;gap:10px;}
.install-banner-text{font-size:13px;line-height:1.4;flex:1;}
.install-banner-text strong{font-size:14px;display:block;margin-bottom:2px;}
.install-steps{font-size:12px;opacity:0.9;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;}
.install-step{background:rgba(255,255,255,0.15);border-radius:6px;padding:4px 8px;white-space:nowrap;}
.install-close{background:rgba(255,255,255,0.2);border:none;color:white;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;flex-shrink:0;}
.voice-bar{background:#085041;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.voice-bar label{color:#a0f0d8;font-size:12px;}
.voice-bar select{font-size:12px;padding:4px 8px;border-radius:6px;border:none;background:#0a5e48;color:white;}
.voice-status{font-size:11px;color:#6ee7c0;margin-left:auto;}

/* ── Search ───────────────────────────────────────────────────── */
.search-bar-wrap{position:sticky;top:0;z-index:50;background:white;}
.search-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #e5e5e5;background:white;}
.search-icon{font-size:15px;color:#888;flex-shrink:0;}
.search-input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:#1a1a1a;padding:6px 0;min-width:0;}
.search-input::placeholder{color:#aaa;}
.search-clear{background:#eee;border:none;border-radius:50%;width:22px;height:22px;font-size:14px;color:#666;cursor:pointer;flex-shrink:0;line-height:1;}
.search-results{position:absolute;left:0;right:0;top:100%;max-height:65vh;overflow-y:auto;background:white;border-bottom:2px solid #0F6E56;box-shadow:0 8px 20px rgba(0,0,0,0.15);display:none;}
.search-results.show{display:block;}
.search-result-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer;}
.search-result-row:active{background:#F0F4F2;}
.search-result-main{flex:1;min-width:0;}
.search-result-jp{font-size:15.5px;font-weight:500;color:#1a1a1a;}
.search-result-en{font-size:12px;color:#555;margin-top:1px;}
.search-result-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:#0F6E56;background:#E1F5EE;border-radius:8px;padding:3px 8px;flex-shrink:0;white-space:nowrap;}
.search-empty{padding:20px 16px;text-align:center;color:#999;font-size:13px;}
.search-more{padding:10px 16px;text-align:center;color:#888;font-size:11.5px;font-style:italic;}
.search-highlight-flash{animation:searchFlash 1.6s ease;}
@keyframes searchFlash{
  0%{background:#FFF3D6;}
  100%{background:transparent;}
}
.tabs{display:flex;overflow-x:auto;background:white;border-bottom:2px solid #e0e0e0;}
.tab{padding:12px 16px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;color:#666;flex-shrink:0;}
.tab.active{border-bottom-color:#0F6E56;color:#0F6E56;}
.content{max-width:680px;margin:0 auto;padding:16px 16px max(80px,calc(60px + env(safe-area-inset-bottom)));}
.unit{display:none;}
.unit.active{display:block;}
.unit-title{font-size:18px;font-weight:600;color:#0F6E56;margin-bottom:4px;}
.unit-sub{font-size:12px;color:#888;margin-bottom:16px;}
.phrase-card{background:white;border-radius:14px;padding:14px 52px 14px 16px;margin-bottom:10px;border:1px solid #e8e8e8;position:relative;}
.phrase-card.staff{border-left:4px solid #0F6E56;}
.phrase-card.you{border-left:4px solid #185FA5;}
.card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.card-label.staff-lbl{color:#0F6E56;}
.card-label.you-lbl{color:#185FA5;}
.jp-text{font-size:20px;font-weight:500;color:#1a1a1a;line-height:1.4;margin-bottom:4px;}
.romaji{font-size:12px;color:#6B21A8;margin-bottom:4px;}
.english{font-size:13px;color:#444;margin-bottom:4px;}
.note{font-size:11px;color:#888;font-style:italic;}
.play-btn{position:absolute;top:50%;right:12px;transform:translateY(-50%);background:#0F6E56;color:white;border:none;border-radius:50%;width:36px;height:36px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.play-btn:hover{background:#085041;}
.play-btn.playing{background:#6B21A8;}
.play-btn.you-btn{background:#185FA5;}
.play-all-bar{background:white;border-radius:14px;padding:12px 16px;margin-bottom:16px;border:1px solid #e8e8e8;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.play-all-btn{background:#0F6E56;color:white;border:none;border-radius:10px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:500;}
.play-all-btn.stop{background:#cc3333;}
.speed-label{font-size:12px;color:#888;}
.speed-btn{background:#f0f0f0;border:1px solid #ddd;border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;color:#444;}
.speed-btn.active{background:#0F6E56;color:white;border-color:#0F6E56;}
.progress-text{font-size:12px;color:#888;margin-left:auto;}
.section-divider{background:#f5f5f3;border-radius:8px;padding:9px 12px;margin:18px 0 9px;font-size:12.5px;font-weight:700;letter-spacing:0.01em;color:#444;border-left:3px solid #0F6E56;}
.section-divider.blue{border-left-color:#185FA5;}
.section-divider.amber{border-left-color:#854F0B;}
.section-divider.purple{border-left-color:#6B21A8;}
.section-divider.red{border-left-color:#993C1D;}
.now-playing{position:fixed;bottom:0;left:0;right:0;background:#0F6E56;color:white;padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;z-index:100;}
.now-playing.visible{display:flex;}
.now-playing-jp{font-size:18px;font-weight:500;}
.now-playing-en{font-size:11px;opacity:0.8;}
.stop-btn{margin-left:auto;background:rgba(255,255,255,0.2);border:none;border-radius:8px;color:white;padding:6px 12px;cursor:pointer;font-size:13px;}
.info-card{border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.info-card.amber{background:#FAEEDA;border-left:4px solid #854F0B;}
.info-card.red{background:#FAECE7;border-left:4px solid #993C1D;}
.info-card.green{background:#E1F5EE;border-left:4px solid #0F6E56;}
.info-card-title{font-size:13px;font-weight:600;margin-bottom:4px;}
.info-card.amber .info-card-title{color:#633806;}
.info-card.red .info-card-title{color:#993C1D;}
.info-card.green .info-card-title{color:#085041;}
.info-card-body{font-size:13px;line-height:1.6;}
.info-card.amber .info-card-body{color:#412402;}
.info-card.red .info-card-body{color:#4A1B0C;}
.info-card.green .info-card-body{color:#04342C;}
.kana-grid{display:grid;grid-template-columns:36px repeat(5,1fr);gap:5px;margin-bottom:6px;}
.kana-hdr{background:#e8e8e8;border-radius:6px;padding:6px 2px;text-align:center;font-size:11px;font-weight:600;color:#555;}
.kana-row{background:#e8e8e8;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#555;}
.kana-cell{background:white;border:1px solid #e0e0e0;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;transition:all 0.15s;}
.kana-cell:hover{background:#E1F5EE;border-color:#0F6E56;transform:scale(1.05);}
.kana-cell.empty{background:#f9f9f9;border:1px dashed #ddd;cursor:default;}
.kana-cell.empty:hover{transform:none;background:#f9f9f9;border-color:#ddd;}
.kana-char{font-size:22px;font-weight:500;color:#1a1a1a;line-height:1.2;display:block;}
.kana-rom{font-size:10px;color:#6B21A8;margin-top:2px;display:block;}
.kana-play-all{background:#0F6E56;color:white;border:none;border-radius:10px;padding:8px 16px;font-size:12px;cursor:pointer;font-weight:500;margin-bottom:14px;margin-right:8px;}
.kana-play-all.kata{background:#185FA5;}
.kana-tip{background:#FAEEDA;border-left:3px solid #EF9F27;border-radius:8px;padding:10px 14px;font-size:12px;color:#633806;margin-bottom:14px;}

/* ── Vocab table ─────────────────────────────────────────────── */
.vocab-table{background:white;border-radius:14px;border:1px solid #e8e8e8;overflow:hidden;margin-bottom:10px;}
.vocab-row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:10px 8px 10px 16px;border-bottom:1px solid #eeeeee;gap:6px;cursor:pointer;}
.vocab-row:last-child{border-bottom:none;}
.vocab-row:active{background:#F0F4F2;}
.vocab-main{min-width:0;}
.vocab-jp{font-size:18px;font-weight:500;color:#1a1a1a;line-height:1.35;}
.vocab-sub{display:flex;flex-wrap:wrap;column-gap:8px;align-items:baseline;}
.vocab-rom{font-size:12px;color:#6B21A8;}
.vocab-en{font-size:12.5px;color:#444;}
.vocab-note{font-size:10.5px;color:#888;font-style:italic;margin-top:2px;}
.vocab-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.vocab-play{background:#0F6E56;color:white;border:none;border-radius:50%;width:32px;height:32px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.vocab-play.playing{background:#6B21A8;}

/* ── Chat-style dialogue thread ──────────────────────────────── */
.chat-thread{margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.chat-row{display:flex;}
.chat-row.staff{justify-content:flex-start;}
.chat-row.you{justify-content:flex-end;}
.chat-bubble{max-width:82%;border-radius:16px;padding:10px 14px;position:relative;background:white;border:1px solid #e8e8e8;cursor:pointer;}
.chat-row.staff .chat-bubble{border-bottom-left-radius:4px;border-left:3px solid #0F6E56;}
.chat-row.you .chat-bubble{border-bottom-right-radius:4px;border-right:3px solid #185FA5;background:#EAF3FF;}
.chat-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.chat-row.staff .chat-label{color:#0F6E56;}
.chat-row.you .chat-label{color:#185FA5;}
.chat-jp{font-size:16.5px;font-weight:500;color:#1a1a1a;line-height:1.4;}
.chat-rom{font-size:11.5px;color:#6B21A8;margin-top:3px;}
.chat-en{font-size:12.5px;color:#444;margin-top:2px;}
.chat-note{font-size:10.5px;color:#888;font-style:italic;margin-top:3px;}
.chat-play-inline{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:rgba(15,110,86,0.12);color:#0F6E56;font-size:10px;margin-left:6px;vertical-align:middle;}
.chat-row.you .chat-play-inline{background:rgba(24,95,165,0.14);color:#185FA5;}

/* ── Conjugation diagram grid ────────────────────────────────── */
.conj-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.conj-card{background:white;border:1px solid #e8e8e8;border-radius:14px;padding:12px 14px;cursor:pointer;}
.conj-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.conj-chip{border-radius:10px;padding:7px 12px;font-size:16px;font-weight:500;line-height:1.3;}
.conj-chip.base{background:#F0F4F2;color:#444;border:1px solid #ddd;}
.conj-chip.target{background:#F3E8FF;color:#6B21A8;border:1px solid #d9b8ff;font-weight:700;}
.conj-arrow{font-size:16px;color:#aaa;flex-shrink:0;}
.conj-play{margin-left:auto;background:#6B21A8;color:white;border:none;border-radius:50%;width:30px;height:30px;font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.conj-rom{font-size:11.5px;color:#888;margin-top:7px;}
.conj-en{font-size:12.5px;color:#444;margin-top:2px;}
.conj-note{font-size:10.5px;color:#888;font-style:italic;margin-top:3px;}

/* ── Quiz tab ─────────────────────────────────────────────────── */
.quiz-config-card{background:white;border-radius:14px;border:1px solid #e8e8e8;padding:18px 16px;display:flex;flex-direction:column;gap:6px;}
.quiz-field-label{font-size:12px;font-weight:600;color:#555;margin-top:12px;margin-bottom:2px;}
.quiz-field-label:first-child{margin-top:0;}
.quiz-select{font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid #ddd;background:#F0F4F2;color:#1a1a1a;width:100%;}
.quiz-toggle-group{display:flex;gap:8px;}
.quiz-toggle-btn{flex:1;background:#F0F4F2;border:1px solid #ddd;border-radius:10px;padding:10px 8px;font-size:12.5px;font-weight:500;color:#555;cursor:pointer;}
.quiz-toggle-btn.active{background:#0F6E56;border-color:#0F6E56;color:white;}
.quiz-count-group{display:flex;gap:6px;flex-wrap:wrap;}
.quiz-count-btn{flex:1;min-width:44px;background:#F0F4F2;border:1px solid #ddd;border-radius:10px;padding:9px 4px;font-size:13px;font-weight:600;color:#555;cursor:pointer;}
.quiz-count-btn.active{background:#6B21A8;border-color:#6B21A8;color:white;}
.quiz-start-btn{margin-top:18px;background:#0F6E56;color:white;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;width:100%;}
.quiz-secondary-btn{margin-top:10px;background:white;color:#0F6E56;border:1.5px solid #0F6E56;border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;width:100%;}
.quiz-progress{font-size:12.5px;color:#666;font-weight:600;margin-bottom:10px;}
.quiz-prompt-card{background:white;border:1px solid #e8e8e8;border-radius:14px;padding:22px 18px;text-align:center;margin-bottom:14px;}
.quiz-prompt-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#0F6E56;margin-bottom:10px;}
.quiz-prompt-main{font-size:18px;font-weight:500;color:#1a1a1a;line-height:1.4;}
.quiz-prompt-main.quiz-jp{font-size:27px;}
.quiz-options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
.quiz-option-btn{background:white;border:1.5px solid #ddd;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:500;color:#1a1a1a;text-align:left;cursor:pointer;line-height:1.4;}
.quiz-option-btn.quiz-option-jp{font-size:18px;}
.quiz-option-btn.correct{background:#E1F5EE;border-color:#0F6E56;color:#085041;font-weight:700;}
.quiz-option-btn.wrong{background:#FAECE7;border-color:#993C1D;color:#993C1D;}
.quiz-option-btn.disabled{cursor:default;}
.quiz-feedback{margin-bottom:14px;}
.quiz-fb-good{color:#085041;font-weight:700;font-size:15px;}
.quiz-fb-bad{color:#993C1D;font-weight:700;font-size:15px;}
.quiz-fb-rom{color:#6B21A8;font-size:13px;margin-top:4px;}
.quiz-fb-play{background:#6B21A8;color:white;border:none;border-radius:50%;width:26px;height:26px;font-size:11px;cursor:pointer;margin-left:6px;vertical-align:middle;}
.quiz-next-btn{background:#185FA5;color:white;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;width:100%;}
.quiz-result-card{background:white;border:1px solid #e8e8e8;border-radius:16px;padding:32px 20px;text-align:center;}
.quiz-result-score{font-size:38px;font-weight:700;color:#0F6E56;}
.quiz-result-pct{font-size:14px;color:#888;margin-top:2px;}
.quiz-result-msg{font-size:14px;color:#444;margin-top:14px;}
.quiz-result-buttons{margin-top:6px;}

/* ── Number / date / kanji grid ──────────────────────────────── */
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin-bottom:10px;}
.num-cell{background:white;border:1px solid #e0e0e0;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;position:relative;}
.num-cell:hover{background:#E1F5EE;border-color:#0F6E56;transform:scale(1.04);}
.num-jp{font-size:18px;font-weight:600;color:#1a1a1a;line-height:1.2;}
.num-rom{font-size:10px;color:#6B21A8;margin-top:3px;}
.num-en{font-size:9px;color:#888;margin-top:2px;line-height:1.2;}
.num-note{font-size:7.5px;color:#993C1D;margin-top:1px;font-weight:600;line-height:1.2;}
.kanji-grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));}
.kanji-grid .num-cell{min-height:88px;}
.kanji-grid .num-jp{font-size:32px;}

/* ── Star / favorite buttons ─────────────────────────────────── */
.star-btn{background:none;border:1.5px solid #ddd;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;color:#ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.star-btn.starred{color:#EF9F27;border-color:#EF9F27;background:#FFF6E5;}
.chat-star{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;font-size:14px;color:#ccc;margin-left:4px;vertical-align:middle;cursor:pointer;background:none;border:none;padding:0;}
.chat-star.starred{color:#EF9F27;}
.conj-star{background:none;border:1.5px solid #ddd;border-radius:50%;width:28px;height:28px;font-size:13px;cursor:pointer;color:#ccc;margin-left:auto;flex-shrink:0;}
.conj-star.starred{color:#EF9F27;border-color:#EF9F27;background:#FFF6E5;}
.grammar-ex-star{background:none;border:none;font-size:16px;cursor:pointer;color:#ccc;padding:2px;}
.grammar-ex-star.starred{color:#EF9F27;}
.grammar-ex-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.num-star{position:absolute;top:2px;right:2px;font-size:11px;color:#ccc;background:rgba(255,255,255,0.85);border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;padding:0;line-height:1;}
.num-star.starred{color:#EF9F27;}

/* ── Star review / flashcard widget ──────────────────────────── */
.star-review-card{background:#FFFBF0;border:1.5px solid #EF9F27;border-radius:14px;padding:16px;margin-top:20px;}
.star-review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.star-review-title{font-size:14px;font-weight:700;color:#854F0B;}
.star-review-count{font-size:11.5px;color:#996b1f;background:#FAEEDA;padding:3px 9px;border-radius:20px;font-weight:600;}
.star-review-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.star-chip{background:white;border:1px solid #EF9F27;border-radius:20px;padding:4px 10px;font-size:12.5px;color:#633806;}
.star-review-btn{background:#EF9F27;color:white;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;width:100%;}
.star-flip-card{background:white;border:1.5px solid #EF9F27;border-radius:14px;padding:26px 18px;text-align:center;margin-top:12px;cursor:pointer;min-height:90px;display:flex;flex-direction:column;justify-content:center;position:relative;}
.star-flip-progress{position:absolute;top:8px;left:12px;font-size:10px;color:#aaa;font-weight:700;}
.star-flip-front{font-size:17px;font-weight:600;color:#1a1a1a;}
.star-flip-hint{font-size:11px;color:#aaa;margin-top:10px;}
.star-flip-back{margin-top:6px;}
.star-flip-jp{font-size:22px;font-weight:600;color:#1a1a1a;}
.star-flip-rom{font-size:12.5px;color:#6B21A8;margin-top:4px;}
.star-flip-play{margin-top:8px;background:#6B21A8;color:white;border:none;border-radius:50%;width:28px;height:28px;font-size:12px;cursor:pointer;}
.star-flip-actions{display:flex;gap:8px;margin-top:10px;}
.star-flip-btn{flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;}
.star-flip-btn.learning{background:#FAECE7;color:#993C1D;}
.star-flip-btn.known{background:#E1F5EE;color:#085041;}
.star-session-done{font-size:13px;color:#444;text-align:center;padding:10px 0;line-height:1.6;}

/* ── Grammar rule card (particles, verb forms) ───────────────── */
.grammar-card{background:white;border:1px solid #e8e8e8;border-radius:14px;overflow:hidden;margin-bottom:10px;}
.grammar-rule-row{display:flex;align-items:center;gap:12px;padding:14px 14px;background:#F3E8FF;cursor:pointer;}
.grammar-rule-badge{background:#6B21A8;color:white;font-size:17px;font-weight:700;border-radius:10px;padding:9px 12px;flex-shrink:0;white-space:nowrap;}
.grammar-rule-text{min-width:0;flex:1;}
.grammar-rule-en{font-size:13.5px;font-weight:600;color:#4C1D7A;line-height:1.4;}
.grammar-rule-note{font-size:11.5px;color:#6B21A8;font-style:italic;margin-top:3px;}
.grammar-rule-play{background:#6B21A8;color:white;border:none;border-radius:50%;width:30px;height:30px;font-size:12px;cursor:pointer;flex-shrink:0;}
.grammar-examples-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#999;padding:10px 14px 4px;}
.grammar-examples{padding:0 0 4px;}
.grammar-ex-row{display:grid;grid-template-columns:1fr 36px;align-items:center;padding:8px 14px;gap:6px;cursor:pointer;border-top:1px solid #f2f2f2;}
.grammar-ex-row:active{background:#F0F4F2;}
.grammar-ex-main{min-width:0;}
.grammar-ex-jp{font-size:15.5px;font-weight:500;color:#1a1a1a;line-height:1.4;}
.grammar-ex-sub{display:flex;flex-wrap:wrap;column-gap:8px;align-items:baseline;}
.grammar-ex-rom{font-size:11.5px;color:#6B21A8;}
.grammar-ex-en{font-size:12px;color:#444;}
.grammar-ex-note{font-size:10px;color:#888;font-style:italic;margin-top:2px;}
.grammar-ex-play{background:#F0F4F2;color:#0F6E56;border:1px solid #ddd;border-radius:50%;width:28px;height:28px;font-size:11px;cursor:pointer;}

/* ── KO-SO-A-DO demonstratives table ─────────────────────────── */
.kosoado-wrap{overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch;}
.kosoado-table{display:grid;grid-template-columns:70px repeat(4,minmax(84px,1fr));gap:4px;min-width:460px;}
.kosoado-cell{border-radius:8px;padding:6px 4px;text-align:center;}
.kosoado-corner{background:transparent;}
.kosoado-head{color:white;font-weight:700;font-size:12px;padding:8px 4px;border-radius:8px;}
.kosoado-head-jp{font-size:11px;font-weight:500;opacity:0.9;display:block;margin-top:2px;}
.kosoado-head.ko{background:#185FA5;}
.kosoado-head.so{background:#0F6E56;}
.kosoado-head.a{background:#854F0B;}
.kosoado-head.do{background:#6B21A8;}
.kosoado-row-label{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5f5f3;border-radius:8px;padding:6px 2px;font-size:10.5px;font-weight:700;color:#444;}
.kosoado-row-sub{font-size:8px;color:#888;font-weight:500;margin-top:2px;}
.kosoado-data{background:white;border:1px solid #e8e8e8;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;min-height:64px;}
.kosoado-data:active{background:#f5f5f3;}
.kosoado-data.ko{border-top:3px solid #185FA5;}
.kosoado-data.so{border-top:3px solid #0F6E56;}
.kosoado-data.a{border-top:3px solid #854F0B;}
.kosoado-data.do{border-top:3px solid #6B21A8;}
.kosoado-jp{font-size:16px;font-weight:600;color:#1a1a1a;}
.kosoado-rom{font-size:9px;color:#6B21A8;margin-top:2px;}
.kosoado-en{font-size:8px;color:#888;margin-top:1px;line-height:1.2;}

/* ── Translate + Saved Phrases ───────────────────────────────── */
.tr-card{background:white;border:1px solid #e8e8e8;border-radius:14px;padding:12px;margin-bottom:12px;}
.tr-input{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;resize:vertical;min-height:70px;background:#FAFAFA;color:#1a1a1a;}
.tr-input:focus{outline:none;border-color:#0F6E56;background:white;}
.tr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
.tr-dir{font-size:12px;font-weight:600;color:#0F6E56;background:#E1F5EE;border-radius:20px;padding:5px 10px;}
.tr-btn{background:#0F6E56;color:white;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;}
.tr-btn:disabled{opacity:0.5;cursor:default;}
.tr-loading{text-align:center;color:#888;font-size:13px;padding:18px;}
.tr-error{background:#FAECE7;border-left:4px solid #993C1D;border-radius:10px;padding:12px 14px;font-size:13px;color:#4A1B0C;margin-bottom:12px;}
.tr-result-card{background:white;border:1.5px solid #0F6E56;border-radius:14px;padding:16px;margin-bottom:12px;}
.tr-result-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#999;margin-top:8px;}
.tr-result-label:first-child{margin-top:0;}
.tr-result-jp{font-size:22px;font-weight:600;color:#1a1a1a;line-height:1.45;margin-top:2px;}
.tr-result-rom{font-size:13px;color:#6B21A8;margin-top:3px;}
.tr-result-en{font-size:15px;color:#333;margin-top:2px;line-height:1.45;}
.tr-result-actions{display:flex;gap:8px;margin:14px 0 12px;}
.tr-listen{background:#6B21A8;color:white;border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.tr-listen.slow{background:#F3E8FF;color:#6B21A8;}
.tr-note{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:8px;font-family:inherit;background:#FAFAFA;}
.tr-save{width:100%;background:#EF9F27;color:white;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;}
.tr-saved-state{background:#E1F5EE;color:#085041;border-radius:10px;padding:11px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;}
.tr-link{margin-left:auto;background:white;border:1px solid #0F6E56;color:#0F6E56;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.tr-disclaimer{font-size:11.5px;color:#888;line-height:1.5;padding:4px 4px 0;}
.saved-add{background:white;border:1px solid #e8e8e8;border-radius:12px;padding:10px 14px;margin-bottom:12px;}
.saved-add summary{font-size:13px;font-weight:600;color:#0F6E56;cursor:pointer;}
.saved-add-body{margin-top:10px;}
.saved-empty{background:white;border:1px dashed #ccc;border-radius:14px;padding:28px 18px;text-align:center;color:#555;font-size:14px;}
.saved-empty-icon{font-size:30px;color:#EF9F27;margin-bottom:6px;}
.saved-empty-sub{font-size:12px;color:#888;margin:6px 0 14px;line-height:1.5;}
.saved-del{background:none;border:1.5px solid #e5c5bb;color:#993C1D;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;line-height:1;}

/* ── N5 additions ────────────────────────────────────────────── */
.ext-link{display:inline-block;margin:3px 0;color:#185FA5;font-weight:600;text-decoration:underline;word-break:break-word;}
.info-card-body a{color:#185FA5;}
.rm-progress{background:white;border:1px solid #e8e8e8;border-radius:14px;padding:14px 16px;margin-bottom:14px;}
.rm-bar{height:10px;background:#e8e8e8;border-radius:6px;overflow:hidden;}
.rm-fill{height:100%;background:#0F6E56;border-radius:6px;transition:width .3s;}
.rm-pct{font-size:12px;color:#666;font-weight:600;margin-top:6px;}
.rm-goal{font-size:12.5px;color:#085041;background:#E1F5EE;border-radius:8px;padding:8px 12px;margin-bottom:8px;}
.rm-task{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #eee;}
.rm-task:last-child{border-bottom:none;}
.rm-check{display:flex;align-items:flex-start;gap:10px;flex:1;font-size:13.5px;color:#1a1a1a;line-height:1.4;cursor:pointer;}
.rm-check input{width:20px;height:20px;margin-top:1px;flex-shrink:0;accent-color:#0F6E56;}
.rm-task.done .rm-check span{text-decoration:line-through;color:#999;}
.rm-go{background:#F0F4F2;border:1px solid #ddd;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:#0F6E56;cursor:pointer;flex-shrink:0;}
.bld-answer{min-height:58px;background:white;border:2px dashed #c9d6d0;border-radius:14px;padding:10px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.bld-placeholder{color:#aaa;font-size:13px;}
.bld-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.bld-chip{background:white;border:1.5px solid #0F6E56;color:#085041;border-radius:10px;padding:10px 14px;font-size:17px;font-weight:500;cursor:pointer;}
.bld-chip.placed{background:#E1F5EE;}
.bld-chip.used{opacity:0.25;cursor:default;}
.quiz-start-btn:disabled{opacity:0.45;}

.rm-phase{background:#0F6E56;color:white;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;margin:22px 0 4px;}

/* ── Hide-romaji mode ─────────────────────────────────────────── */
.rom-toggle{flex-shrink:0;background:#F3EEF9;color:#6B21A8;border:1.5px solid #6B21A8;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.rom-toggle.on{background:#6B21A8;color:white;}
body.hide-romaji :is(.romaji,.vocab-rom,.chat-rom,.kana-rom,.conj-rom,.num-rom,.grammar-ex-rom,.kosoado-rom,.star-flip-rom):not(:empty):not(.rom-shown){
  color:transparent !important;background:repeating-linear-gradient(135deg,#E9DFF5 0 6px,#F3EEF9 6px 12px);
  border-radius:5px;cursor:pointer;user-select:none;-webkit-user-select:none;min-width:44px;display:inline-block;
  text-shadow:none;position:relative;}
body.hide-romaji .vocab-rom:not(:empty):not(.rom-shown){margin-right:8px;}
body.hide-romaji :is(.romaji,.vocab-rom,.chat-rom,.kana-rom,.conj-rom,.num-rom,.grammar-ex-rom,.kosoado-rom,.star-flip-rom).rom-shown{
  outline:1.5px dashed #C4A8E3;outline-offset:2px;border-radius:4px;cursor:pointer;}

/* ── Quiz v2 ──────────────────────────────────────────────────── */
.qz-topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.qz-mini{background:none;border:1px solid #cfd8d4;color:#0F6E56;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer;margin-left:6px;}
.qz-group{margin-top:10px;}
.qz-group-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#888;margin-bottom:6px;}
.qz-chips{display:flex;flex-wrap:wrap;gap:6px;}
.qz-topic{display:inline-flex;align-items:center;gap:6px;background:#F0F4F2;border:1.5px solid #dde5e1;border-radius:10px;padding:7px 10px;font-size:13px;color:#333;cursor:pointer;user-select:none;}
.qz-topic input{position:absolute;opacity:0;pointer-events:none;}
.qz-topic:has(input:checked){background:#0F6E56;border-color:#0F6E56;color:white;}
.qz-topic:has(input:focus-visible){outline:2px solid #6B21A8;outline-offset:2px;}
.qz-topic.empty{opacity:.45;cursor:default;}
.qz-n{font-size:11px;font-weight:700;background:rgba(0,0,0,.08);border-radius:999px;padding:1px 7px;}
.qz-topic:has(input:checked) .qz-n{background:rgba(255,255,255,.25);}
.qz-note{font-weight:400;color:#999;font-size:11px;}
.qz-avail{font-size:12.5px;color:#555;background:#F3EEF9;border-radius:8px;padding:8px 12px;margin-top:12px;}
.qz-fixed{font-size:19px;line-height:1.6;}
.qz-hint{font-size:13px;color:#777;margin-top:8px;font-weight:400;}
.qz-blank{color:#6B21A8;font-weight:700;}
.qz-sub{font-size:14px;color:#888;font-weight:400;}
.qz-quit{display:block;margin:14px auto 0;background:none;border:none;color:#999;font-size:12px;text-decoration:underline;cursor:pointer;}
.qz-miss-head{margin-top:18px;text-align:left;font-size:13px;font-weight:700;color:#993C1D;}
.qz-miss{margin-top:8px;text-align:left;font-size:13px;color:#444;border-left:3px solid #993C1D;padding-left:8px;line-height:1.5;}
.qz-miss .qz-hint{font-size:12px;margin-top:2px;}

/* ── Reading tab ──────────────────────────────────────────────── */
.rd-toolbar{display:flex;justify-content:flex-end;margin:4px 0 6px;}
.rd-title ruby rt,.rd-text ruby rt,.qz-passage ruby rt,.qz-rq ruby rt,.rd-qtext ruby rt,.rd-fb ruby rt,.quiz-fb-rom ruby rt,.qz-miss ruby rt{font-size:.5em;color:#6B21A8;font-weight:400;}
body.hide-furi ruby rt{visibility:hidden;}
.rd-tag{font-size:10.5px;font-weight:700;background:#E1F5EE;color:#085041;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;}
.rd-done{font-size:11px;color:#0F6E56;font-weight:700;margin-left:4px;}
.rd-card{background:white;border:1px solid #e8e8e8;border-radius:14px;padding:16px;margin-bottom:14px;}
.rd-text{font-size:18px;line-height:2.1;color:#1a1a1a;word-break:normal;}
.rd-actions{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap;}
.rd-btn{background:#F0F4F2;border:1px solid #ddd;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:#0F6E56;cursor:pointer;}
.rd-btn.playing{background:#6B21A8;color:white;border-color:#6B21A8;}
.rd-en{display:none;font-size:13px;color:#555;background:#FAF6EE;border-radius:8px;padding:10px 12px;margin-top:8px;line-height:1.6;}
.rd-en.show{display:block;}
.rd-qs{margin-top:10px;border-top:1px dashed #e0e0e0;padding-top:8px;}
.rd-q{margin-top:12px;}
.rd-qtext{font-size:16px;line-height:2;color:#1a1a1a;}
.rd-qen{font-size:12px;color:#888;margin-bottom:6px;}
.rd-opts{display:grid;grid-template-columns:1fr;gap:6px;}
.rd-opt{text-align:left;background:white;border:1.5px solid #ddd;border-radius:10px;padding:10px 12px;font-size:15px;cursor:pointer;color:#1a1a1a;}
.rd-opt.correct{background:#E1F5EE;border-color:#0F6E56;color:#085041;}
.rd-opt.wrong{background:#FAECE7;border-color:#993C1D;color:#993C1D;}
.rd-opt:disabled{cursor:default;}
.rd-fb{font-size:13px;color:#6B21A8;margin-top:6px;line-height:1.8;}
.qz-passage{font-size:15px;line-height:2;text-align:left;background:#FAFAF7;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:400;}
.qz-rq{font-size:16px;line-height:2;}
.mk-break{margin-top:14px;text-align:left;}
.mk-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#444;margin:6px 0;}
.mk-row span:first-child{width:110px;flex-shrink:0;}
.mk-bar{flex:1;height:8px;background:#eee;border-radius:5px;overflow:hidden;display:block;}
.mk-bar span{display:block;height:100%;border-radius:5px;}

/* long grammar patterns: wrap instead of overflowing */
.grammar-rule-row{flex-wrap:wrap;}
.grammar-rule-badge{white-space:normal;max-width:100%;flex-shrink:1;line-height:1.35;overflow-wrap:anywhere;}
.grammar-rule-text{min-width:170px;}

/* ── Sync ─────────────────────────────────────────────────────── */
.header{position:relative;}
.sync-pill{margin-top:10px;background:rgba(255,255,255,.15);color:white;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;}
.sync-pill.ok{background:white;color:#0F6E56;border-color:white;}
.sync-pill.error,.sync-pill.retry{background:#FFF4E5;color:#8A4B00;border-color:#FFF4E5;}
.sync-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
.sync-card{background:white;border-radius:16px;max-width:460px;width:100%;padding:18px 18px 14px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
.sync-head{display:flex;justify-content:space-between;align-items:center;font-size:17px;color:#0F6E56;}
.sync-x{background:none;border:none;font-size:26px;line-height:1;color:#999;cursor:pointer;}
.sync-sub{font-size:13px;color:#555;margin:6px 0 12px;line-height:1.5;}
.sync-box{background:#F7F9F8;border:1px solid #e3e9e6;border-radius:12px;padding:12px;font-size:13.5px;color:#222;line-height:1.5;}
.sync-box.ok{background:#E1F5EE;border-color:#bfe3d4;}
.sync-step{display:flex;gap:10px;margin-bottom:12px;}
.sync-step>span{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#0F6E56;color:white;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
.sync-step>div{flex:1;min-width:0;}
.sync-input{display:block;width:100%;box-sizing:border-box;margin-top:6px;border:1.5px solid #cfd8d4;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;}
.sync-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px;}
.sync-btn{background:#0F6E56;color:white;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;}
.sync-btn.ghost{background:white;color:#0F6E56;border:1.5px solid #0F6E56;}
.sync-small{font-size:12px;color:#666;margin-top:6px;line-height:1.5;}
.sync-status{font-size:12.5px;color:#6B21A8;margin-top:6px;min-height:1em;}
.sync-details{margin-top:12px;font-size:13px;color:#333;}
.sync-details summary{cursor:pointer;font-weight:700;color:#555;padding:6px 0;}
.sync-banner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1a1a1a;color:white;border-radius:12px;padding:10px 12px 10px 16px;font-size:13px;display:flex;gap:12px;align-items:center;z-index:150;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);}
.sync-banner button{background:#0F6E56;color:white;border:none;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;}

/* ── Quiz v3: topics with subgroups ───────────────────────────── */
.qz-topic{padding:0;gap:0;overflow:hidden;}
.qz-topic-main{display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:7px 10px;font-size:13px;color:inherit;cursor:pointer;font-family:inherit;}
.qz-topic-main:disabled{cursor:default;}
.qz-topic.on{background:#0F6E56;border-color:#0F6E56;color:white;}
.qz-topic.on .qz-n{background:rgba(255,255,255,.25);}
.qz-topic.open{box-shadow:0 0 0 2px #B9E2D2;}
.qz-caret{background:rgba(255,255,255,.18);border:none;border-left:1px solid rgba(255,255,255,.35);color:white;font-size:10px;padding:0 9px;align-self:stretch;cursor:pointer;}
.qz-subpanel{margin-top:8px;background:#F7FAF9;border:1.5px solid #B9E2D2;border-radius:12px;padding:10px;}
.qz-subhead{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:#085041;margin-bottom:8px;}
.qz-subbtns{margin-left:auto;display:inline-flex;}
.qz-subbtns .qz-mini{margin-left:4px;}
.qz-subchips{display:flex;flex-wrap:wrap;gap:6px;}
.qz-sub{background:white;border:1.5px solid #d4ddd9;border-radius:999px;padding:5px 10px;font-size:12px;color:#777;cursor:pointer;font-family:inherit;text-align:left;}
.qz-sub .qz-n{font-size:10.5px;padding:0 6px;}
.qz-sub.on{background:#E1F5EE;border-color:#0F6E56;color:#085041;font-weight:600;}
.qz-sub:not(.on){text-decoration:line-through;text-decoration-color:#bbb;}

/* ── Spaced-repetition review ─────────────────────────────────── */
.srs-card{background:white;border:1.5px solid #e3e9e6;border-radius:14px;padding:14px 16px;margin-bottom:14px;}
.srs-card.due{border-color:#6B21A8;background:#FAF5FF;}
.srs-card.empty{background:#F7F9F8;}

  {title:"Transport manners and tips",color:"amber",infoCards:[
    {style:"amber",heading:"Keep your voice down",body:"Speak quietly on all public transport. Never talk loudly."},
    {style:"amber",heading:"No phone calls on trains",body:"It is considered very rude. Text instead."},
    {style:"amber",heading:"Use earphones",body:"Never play music out loud. Always use earphones."},
    {style:"amber",heading:"Line up and wait your turn",body:"Queue in the marked areas. Let passengers off first before you board."}
  ]},
  {title:"Eating on trains",color:"amber",infoCards:[
    {style:"amber",heading:"Local trains - avoid eating",body:"Eating on local commuter trains is generally avoided. No tables and people are commuting."},
    {style:"green",heading:"Shinkansen - totally fine!",body:"Eating on the shinkansen is completely normal. Pick up an ekiben station bento box at the station before you board!"},
    {style:"amber",heading:"Manners tip",body:"Even on the shinkansen, avoid strong-smelling food out of respect for other passengers."}
  ]},
  {title:"How to take a bus",color:"",infoCards:[
    {style:"green",heading:"Board from the back door (Iriguchi)",body:"Get on from the rear entrance door. Do not board from the front."},
    {style:"green",heading:"Take a ticket or tap IC card",body:"Grab a numbered ticket as you board, or tap your Suica on the reader."},
    {style:"amber",heading:"Check the fare on the screen",body:"A screen at the front shows the current fare. Your fare changes as the bus moves."},
    {style:"amber",heading:"Press the stop button before your stop",body:"Press the red teisha button before your stop to signal the driver."},
    {style:"amber",heading:"Pay at the front door when exiting",body:"Pay the exact fare shown when you get off. Have coins ready."}
  ]},
  {title:"IC Card - Welcome Suica",color:"blue",infoCards:[
    {style:"green",heading:"Welcome Suica - recommended for tourists",body:"Rechargeable tap-to-pay card. No deposit required, valid 28 days. Use on trains, buses, and convenience stores."},
    {style:"green",heading:"Welcome Suica Mobile app",body:"Download on your iPhone via Apple Pay. Search Welcome Suica in the App Store. Works immediately on arrival."},
    {style:"amber",heading:"Topping up - Chaaiji",body:"Add money at any convenience store or train station machine. 1000 to 20000 yen at a time."}
  ]},
  {title:"JR East Rail Passes",color:"blue",infoCards:[
    {style:"green",heading:"JR Tokyo Wide Pass - 15000 adult / 7500 child",body:"Unlimited rides to Tokyo, Lake Kawaguchi, Karuizawa, and GALA Yuzawa Snow Resort."},
    {style:"green",heading:"JR East Pass Nagano Niigata - 27000 adult / 13500 child",body:"Unlimited rides to Tokyo, Matsumoto, GALA Yuzawa, and the Nagano Niigata area."},
    {style:"green",heading:"JR East Pass Tohoku 10-day - 48000 adult / 24000 child",body:"For travelers with more time. Covers the Tohoku region including Sendai and Akita."},
    {style:"green",heading:"N'EX Narita Express",body:"Direct train from Narita Airport to Tokyo, Shinjuku, Shibuya, Shinagawa, and Yokohama."}
  ]},
  {title:"Situational dialogue - At the station",color:"",phrases:[
    {jp:"すみません。しんじゅくえきは どこですか？",rom:"Sumimasen. Shinjuku-eki wa doko desuka?",en:"Excuse me. Where is Shinjuku Station?",role:"you"},

  ]},
  {title:"Situational dialogue - Buying a ticket",color:"",phrases:[

  {title:"Core conversation pattern",color:"",phrases:[

  {title:"Situational dialogue - Lost in the city",color:"",phrases:[

{id:"taxi",tab:"Taxi",title:"Taking a Taxi",sub:"How to get a taxi, key phrases, and destination pattern",sections:[
  {title:"Key vocab",color:"blue",phrases:[
    {jp:"タクシー",rom:"takushii",en:"Taxi"},
    {jp:"くうしゃ",rom:"kuusha",en:"Vacant taxi look for the RED sign"},
    {jp:"うんてんしゅ",rom:"untenshu",en:"Driver"},
    {jp:"メーター",rom:"meetaa",en:"Meter Fare meter"},
    {jp:"りょうきん",rom:"ryoukin",en:"Fare Charge"},
    {jp:"じゅうしょ",rom:"juusho",en:"Address"},
    {jp:"じどうドア",rom:"jidou doa",en:"Automatic door - do not touch it opens automatically"},
    {jp:"チップ",rom:"chippu",en:"Tip - no tipping in Japan it can be rude"}
  ]},
  {title:"The key taxi phrase",color:"",phrases:[
    {jp:"すみません。おおさかじょうまで おねがいします。",rom:"Sumimasen. Osakajo made onegaishimasu.",en:"Excuse me. To Osaka Castle please.",note:"Replace destination with where you want to go",role:"you"},
    {jp:"わかりました。",rom:"Wakarimashita.",en:"Understood. Got it.",role:"staff"}
  ]},
  {title:"Practice - swap the destination",color:"purple",phrases:[
    {jp:"えきまで おねがいします。",rom:"Eki made onegaishimasu.",en:"To the station please.",role:"you"},
    {jp:"ホテルまで おねがいします。",rom:"Hoteru made onegaishimasu.",en:"To the hotel please.",role:"you"},
    {jp:"くうこうまで おねがいします。",rom:"Kuukou made onegaishimasu.",en:"To the airport please.",role:"you"},

    {jp:"このじゅうしょまで おねがいします。",rom:"Kono juusho made onegaishimasu.",en:"To this address please. Show your phone screen if needed",role:"you"}

  {title:"Useful taxi extras",color:"amber",phrases:[

  ]},
  {title:"Automatic door tip",color:"amber",infoCards:[
    {style:"amber",heading:"Taxi doors in Japan are automatic!",body:"The driver controls the door. It opens and closes automatically. Never try to open or close the door yourself - it surprises the driver and can cause damage."}
  ]},
  {title:"Situational dialogue - Taking a taxi",color:"",phrases:[
    {jp:"すみません！タクシー！",rom:"Sumimasen! Takushii!",en:"Excuse me! Taxi! Flagging one down",role:"you"},

    {jp:"１８００えんです。",rom:"Sennihyaku-en desu.",en:"That is 1800 yen.",role:"staff"},
    {jp:"カードで いいですか？",rom:"Kado de ii desuka?",en:"Can I pay by card?",role:"you"},
    {jp:"はい、つかえます。",rom:"Hai, tsukaemasu.",en:"Yes you can.",role:"staff"}
  ]}
]},

{id:"sos",tab:"SOS",title:"When You Are in Trouble",sub:"Communication trouble, lost items, emergencies, kanji signs",sections:[

    {jp:"かぎ",rom:"kagi",en:"Key"},
    {jp:"パスポート",rom:"pasupoto",en:"Passport"},
    {jp:"さいふを なくしました。",rom:"Saifu wo nakushimashita.",en:"I lost my wallet.",role:"you"},
    {jp:"パスポートを なくしました。",rom:"Pasupoto wo nakushimashita.",en:"I lost my passport.",role:"you"},
    {jp:"スマホを なくしました。",rom:"Sumaho wo nakushimashita.",en:"I lost my smartphone.",role:"you"}
  ]},
  {title:"Emergency phrases",color:"amber",phrases:[
    {jp:"じしん です！",rom:"Jishin desu!",en:"It is an earthquake!",role:"you"},
    {jp:"つなみが きます！",rom:"Tsunami ga kimasu!",en:"A tsunami is coming!",role:"you"},
    {jp:"たすけて！",rom:"Tasukete!",en:"Help me! urgent",role:"you"},
    {jp:"ひなんばしょは どこですか？",rom:"Hinan basho wa doko desuka?",en:"Where is the evacuation site?",role:"you"},
    {jp:"けがを しました。",rom:"Kega wo shimashita.",en:"I am injured.",role:"you"}
  ]},
  {title:"Earthquake safety actions",color:"",infoCards:[
    {style:"red",heading:"Drop Cover Hold On",body:"Get under a table, protect your head with your arms, and hold on until shaking stops. Get low immediately."},
    {style:"red",heading:"Stay indoors until shaking stops",body:"Do not run outside. Falling glass and debris are the biggest danger. Stay away from windows and heavy furniture."},
    {style:"red",heading:"If you are outside",body:"Move to an open space away from buildings, power lines, and trees. Crouch low and protect your head."},
    {style:"red",heading:"Use stairs NOT the elevator",body:"Elevators may get stuck during or after an earthquake. Always take the stairs to evacuate."},
    {style:"amber",heading:"After the shaking stops",body:"Check yourself and others for injuries. Turn off gas if you smell it. Follow official safety updates on your phone."}
  ]},
  {title:"Tsunami safety actions",color:"",infoCards:[
    {style:"red",heading:"Move to higher ground IMMEDIATELY",body:"Do not wait. Go to a hill, tall building, or marked tsunami evacuation area. Every second counts."},
    {style:"red",heading:"Follow official evacuation routes",body:"Use marked tsunami signs. Stay away from the beach, rivers, and low areas. Do NOT stop to take pictures - it is extremely dangerous."},
    {style:"red",heading:"Do NOT go back to the shore",body:"A tsunami comes in multiple waves. The second or third wave is often bigger than the first. Wait for the all-clear."},
    {style:"amber",heading:"Stay in a safe area until all clear",body:"Listen to emergency alerts on your phone. Japan sends loud emergency alerts automatically. Return home only when authorities say it is safe."}
  ]},
  {title:"Must-know Kanji signs",color:"purple",phrases:[
    {jp:"入口（いりぐち）　⇔　出口（でぐち）",rom:"iriguchi / deguchi",en:"Entrance and Exit - you will see these everywhere"},
    {jp:"男（おとこ）　⇔　女（おんな）",rom:"otoko / onna",en:"Men and Women - bathroom signs"},
    {jp:"免税（めんぜい）",rom:"menzei",en:"Tax-free - show your passport at shops"},
    {jp:"危ない（あぶない）",rom:"abunai",en:"Danger Dangerous - stay away!"},
    {jp:"非常口（ひじょうぐち）",rom:"hijouguchi",en:"Emergency exit - the green running man sign"},
    {jp:"禁止（きんし）",rom:"kinshi",en:"Prohibited No ___ allowed"},
    {jp:"営業中（えいぎょうちゅう）",rom:"eigyouchuu",en:"Open for business"},
    {jp:"準備中（じゅんびちゅう）",rom:"junbichuu",en:"Closed Preparing - not open yet"}
  ]},
  {title:"Situational dialogue - Lost my wallet",color:"",phrases:[
    {jp:"すみません！たすけてください！",rom:"Sumimasen! Tasukete kudasai!",en:"Excuse me! Please help me!",role:"you"},

    {jp:"どこで なくしましたか？",rom:"Doko de nakushimashita ka?",en:"Where did you lose it?",role:"staff"},
    {jp:"えきの なかだと おもいます。",rom:"Eki no naka dato omoimasu.",en:"I think it was inside the station.",role:"you"},
    {jp:"こうばんに いきましょう。",rom:"Kouban ni ikimashou.",en:"Let us go to the police box.",role:"staff"},
    {jp:"ゆっくり はなしてください。",rom:"Yukkuri hanashite kudasai.",en:"Please speak slowly.",role:"you"}
  ]},
  {title:"Situational dialogue - Language trouble",color:"",phrases:[
    {jp:"すみません。わかりません。",rom:"Sumimasen. Wakarimasen.",en:"Excuse me. I do not understand.",role:"you"},
    {jp:"もういちど いいですか？",rom:"Mou ichido ii desuka?",en:"Could you say it again?",role:"you"},
    {jp:"ゆっくり はなしてください。",rom:"Yukkuri hanashite kudasai.",en:"Please speak slowly.",role:"you"},
    {jp:"えいごを はなしますか？",rom:"Eigo wo hanashimasu ka?",en:"Do you speak English?",role:"you"},
    {jp:"すこし はなせます。",rom:"Sukoshi hanasemasu.",en:"I can speak a little.",role:"staff"},
    {jp:"グーグルほんやくをつかいましょう。",rom:"Guuguru honyaku wo tsukaimashou.",en:"Let us use Google Translate!",role:"staff"}
  ]}
]},
{id:"tips",tab:"Japan Tips",title:"Japan Tips and Culture",sub:"7 essential tips, shrines, temples, onsen, escalator rules, quiz answers",sections:[
  {title:"7 Must-know tips",color:"amber",infoCards:[
    {style:"amber",heading:"Always carry cash",body:"Some places do not accept cards even in big cities. ATMs at 7-Eleven and Japan Post always work for foreign cards."},
    {style:"amber",heading:"Check restaurant hours",body:"Many places close between lunch and dinner around 2 to 5pm, or have one specific closed day per week."},
    {style:"amber",heading:"Do not stick chopsticks upright in rice",body:"This is a funeral custom in Japan and considered very rude. Lay them across your bowl instead."},
    {style:"amber",heading:"Take off your shoes",body:"Remove shoes when entering ryokan, temples, many traditional restaurants, and some homes. Slip-on shoes are convenient!"},
    {style:"amber",heading:"Trash cans are rare",body:"Carry a small bag for your trash. Convenience stores have bins but they are for store purchases only."},
    {style:"amber",heading:"Look for elevators with luggage",body:"Some station exits have only stairs. Look for elevator signs. Station staff are always happy to help."},
    {style:"amber",heading:"Give yourself extra time",body:"Trains and buses are famously punctual. If it says 10:32 it leaves at 10:32. Plan to arrive 5 to 10 minutes early."}
  ]},
  {title:"Shrine etiquette",color:"blue",phrases:[
    {jp:"じんじゃ",rom:"jinja",en:"Shinto shrine"},
    {jp:"とりい",rom:"torii",en:"Torii gate - bow once before entering"}
  ],infoCards:[
    {style:"green",heading:"Bow before entering the torii gate",body:"Give one bow before walking through the red torii gate. Walk on the side of the path - the center is for the gods."},
    {style:"green",heading:"Wash hands at the water basin",body:"Use the ladle to rinse your left hand, then right hand, then rinse your mouth. This purifies you before praying."},
    {style:"green",heading:"At the offering box - the 5-step prayer",body:"1 Throw a coin   2 Bow twice deep bows   3 Clap twice   4 Pray silently with hands together   5 Bow once to finish"}
  ]},
  {title:"Temple etiquette",color:"blue",phrases:[
    {jp:"おてら",rom:"otera",en:"Buddhist temple"}
  ],infoCards:[
    {style:"amber",heading:"No clapping at temples!",body:"Unlike shrines, temples require NO clapping. Join your hands quietly together and pray silently. This is the most common tourist mistake."},
    {style:"amber",heading:"Incense smoke",body:"Wave the incense smoke toward yourself - it is believed to have healing and purifying properties."}
  ]},
  {title:"Onsen etiquette",color:"blue",phrases:[
    {jp:"おんせん",rom:"onsen",en:"Hot spring bath"}
  ],infoCards:[
    {style:"green",heading:"Wash your body FIRST - mandatory",body:"Always shower and wash your entire body before entering the onsen. There are shower stations along the wall for this."},
    {style:"amber",heading:"No swimsuits",body:"Onsen are entered without clothing. This is standard and everyone follows this rule."},
    {style:"amber",heading:"No towel in the water",body:"Fold your small towel and rest it on your head or on the edge. Never dip it in the onsen water."},
    {style:"amber",heading:"Tattoos - check in advance",body:"Many onsen do not allow visible tattoos. Some have private baths you can book. Always check before going."}
  ]},
  {title:"Escalator rules",color:"",infoCards:[
    {style:"green",heading:"Eastern Japan - Tokyo Nagoya Kyoto",body:"Stand on the LEFT and leave the right side open for people who want to walk."},
    {style:"green",heading:"Western Japan - Osaka Kobe",body:"Stand on the RIGHT and leave the left side open for people who want to walk."}
  ]},
  {title:"Situational dialogue - At a shrine",color:"",phrases:[
    {jp:"ここは じんじゃですか？",rom:"Koko wa jinja desuka?",en:"Is this a shrine?",role:"you"},
    {jp:"はい、そうです！ゆうめいな じんじゃです。",rom:"Hai, sou desu! Yuumei na jinja desu.",en:"Yes it is! It is a famous shrine.",role:"staff"},
    {jp:"てを あらう ばしょは どこですか？",rom:"Te wo arau basho wa doko desuka?",en:"Where is the place to wash hands?",role:"you"},
    {jp:"あそこです。いりぐちの そばです。",rom:"Asoko desu. Iriguchi no soba desu.",en:"It is over there near the entrance.",role:"staff"},
    {jp:"ありがとうございます！やってみます！",rom:"Arigatou gozaimasu! Yatte mimasu!",en:"Thank you! I will give it a try!",role:"you"}
  ]}
]},

  {title:"Asking about items",color:"",phrases:[

    {jp:"これは なんですか？",rom:"Kore wa nan desuka?",en:"What is this?",role:"you"},
    {jp:"さわっても いいですか？",rom:"Sawatte mo ii desuka?",en:"May I touch it?",role:"you"},
    {jp:"きても いいですか？",rom:"Kite mo ii desuka?",en:"May I try it on?",role:"you"},
    {jp:"しちゃくしつは どこですか？",rom:"Shichaku shitsu wa doko desuka?",en:"Where is the fitting room?",role:"you"},
    {jp:"これを ください。",rom:"Kore wo kudasai.",en:"I will take this one.",role:"you"},
    {jp:"これに します。",rom:"Kore ni shimasu.",en:"I will go with this one.",role:"you"},
    {jp:"けっこうです。",rom:"Kekkou desu.",en:"No thank you. I am fine.",role:"you"},
    {jp:"かんがえます。",rom:"Kangaemasu.",en:"I will think about it.",role:"you"}
  ]},
  {title:"Gift wrapping and bags",color:"amber",phrases:[
    {jp:"ふくろは いりますか？",rom:"Fukuro wa irimasuka?",en:"Do you need a bag? Japan charges a small fee",role:"staff"},
    {jp:"はい、おねがいします。",rom:"Hai, onegaishimasu.",en:"Yes please.",role:"you"},
    {jp:"いいえ、だいじょうぶです。",rom:"Iie, daijoubu desu.",en:"No thanks.",role:"you"},
    {jp:"プレゼントように つつんでもらえますか？",rom:"Purezento you ni tsutsunde moraemasu ka?",en:"Could you gift wrap it please?",role:"you"},
    {jp:"レシートを ください。",rom:"Reshito wo kudasai.",en:"Please give me a receipt.",role:"you"}
  ]},
  {title:"Situational dialogue - Clothes shopping",color:"",phrases:[
    {jp:"いらっしゃいませ！",rom:"Irasshaimase!",en:"Welcome!",role:"staff"},
    {jp:"このシャツは いくらですか？",rom:"Kono shatsu wa ikura desuka?",en:"How much is this shirt?",role:"you"},
    {jp:"３５００えんです。",rom:"Sanzen gohyaku-en desu.",en:"It is 3500 yen.",role:"staff"},
    {jp:"Mサイズは ありますか？",rom:"M saizu wa arimasu ka?",en:"Do you have a medium size?",role:"you"},
    {jp:"はい、ございます。どうぞ。",rom:"Hai, gozaimasu. Douzo.",en:"Yes we do. Here you go.",role:"staff"},
    {jp:"きても いいですか？",rom:"Kite mo ii desuka?",en:"May I try it on?",role:"you"},
    {jp:"もちろんです。しちゃくしつは あちらです。",rom:"Mochiron desu. Shichaku shitsu wa achira desu.",en:"Of course! The fitting room is over there.",role:"staff"},
    {jp:"これに します。おねがいします。",rom:"Kore ni shimasu. Onegaishimasu.",en:"I will take this one please.",role:"you"},
    {jp:"カードは つかえますか？",rom:"Kado wa tsukaemasu ka?",en:"Can I use a card?",role:"you"},
    {jp:"はい、つかえます。プレゼントように つつみますか？",rom:"Hai, tsukaemasu. Purezento you ni tsutsumimasu ka?",en:"Yes you can. Would you like it gift wrapped?",role:"staff"},
    {jp:"はい、おねがいします！ありがとうございました！",rom:"Hai, onegaishimasu! Arigatou gozaimashita!",en:"Yes please! Thank you so much!",role:"you"}
  ]}
]},

{id:"trip",tab:"Trip Talk",title:"Talking About Your Trip",sub:"All slides: asking questions, time expressions, hobbies, duration, what you will do, what you did, travel plans, asking for help, reactions",sections:[
  {title:"Slide 2 - Asking questions about someone",color:"blue",phrases:[
    {jp:"おなまえはなんですか？",rom:"O-namae wa nan desuka?",en:"What is your name?",role:"staff"},
    {jp:"しゅっしんはどこですか？",rom:"Shusshin wa doko desuka?",en:"Where are you from?",role:"staff"},
    {jp:"アメリカのどこですか？",rom:"Amerika no doko desuka?",en:"Where in America?",role:"staff"},
    {jp:"にほんに いつ きましたか？",rom:"Nihon ni itsu kimashita ka?",en:"When did you come to Japan?",role:"staff"},
    {jp:"どのくらい にほんに いますか？",rom:"Donokurai Nihon ni imasu ka?",en:"How long are you staying in Japan?",role:"staff"}
  ]},
  {title:"Answers to the questions above",color:"",phrases:[
    {jp:"わたしの なまえは ドノバンです。",rom:"Watashi no namae wa Donoban desu.",en:"My name is Donovan.",role:"you"},
    {jp:"しゅっしんは アメリカです。",rom:"Shusshin wa Amerika desu.",en:"I am from America.",role:"you"},
    {jp:"ケンタッキーです。",rom:"Kentakkii desu.",en:"Kentucky.",role:"you"},
    {jp:"くがつ にじゅうしちにちに きました。",rom:"Kugatsu nijuu-shichi-nichi ni kimashita.",en:"I came on September 27th.",role:"you"},
    {jp:"いっしゅうかん います。",rom:"Isshukan imasu.",en:"I am staying for one week.",role:"you"}
  ]},
  {title:"Slide 3 - Time expressions",color:"blue",phrases:[
    {jp:"きのう",rom:"kinou",en:"Yesterday"},
    {jp:"きょう",rom:"kyou",en:"Today"},
    {jp:"あした",rom:"ashita",en:"Tomorrow"},
    {jp:"９がつ２７にち",rom:"ku-gatsu nijuu-shichi-nichi",en:"September 27th",note:"Month + nichi = specific date"}
  ]},
  {title:"Slide 5 - Hobby conversation",color:"",phrases:[
    {jp:"しゅみはなんですか？",rom:"Shumi wa nan desuka?",en:"What is your hobby?",role:"staff"},
    {jp:"わたしのしゅみは、りょうりとおかしづくりです。",rom:"Watashi no shumi wa, ryouri to okashidzukuri desu.",en:"My hobby is cooking and baking.",role:"you"},
    {jp:"そうなんですか！なにをつくりますか？",rom:"Sou nan desuka! Nani wo tsukurimasu ka?",en:"Is that so! What do you make?",role:"staff"},
    {jp:"バナナプリンと、ブラウニーと、バナナブレッドをつくります。",rom:"Banana purin to, buraunii to, banana buredd wo tsukurimasu.",en:"I make banana pudding, brownies, and banana bread.",role:"you"},
    {jp:"スポーツが すきです。バスケットボールを します。",rom:"Supootsu ga suki desu. Basukettoboru wo shimasu.",en:"I like sports. I play basketball.",role:"you"}
  ]},
  {title:"Slide 6 - Duration pattern: period of time に number times",color:"purple",phrases:[
    {jp:"１しゅうかん に １かい バスケを します。",rom:"Isshukan ni ikkai baske wo shimasu.",en:"I play basketball once a week.",note:"Pattern: period of time + ni + number of times + activity"},
    {jp:"いっしゅうかん",rom:"isshukan",en:"1 week"},
    {jp:"にしゅうかん",rom:"nishukan",en:"2 weeks"},
    {jp:"さんしゅうかん",rom:"sanshukan",en:"3 weeks"},
    {jp:"いっかげつ",rom:"ikkagetsu",en:"1 month"},
    {jp:"にかげつ",rom:"nikagetsu",en:"2 months"},
    {jp:"さんかげつ",rom:"sankagetsu",en:"3 months"},
    {jp:"いっかい",rom:"ikkai",en:"1 time"},
    {jp:"にかい",rom:"nikai",en:"2 times"},
    {jp:"さんかい",rom:"sankai",en:"3 times"},
    {jp:"まいしゅう にちようび",rom:"maishu nichiyoubi",en:"Every Sunday"}
  ]},
  {title:"Duration conversation",color:"",phrases:[
    {jp:"どのくらい ヨガをしますか？",rom:"Donokurai yoga wo shimasu ka?",en:"How often do you do yoga?",role:"you"},
    {jp:"１しゅうかんに １かい ヨガをします。",rom:"Isshukan ni ikkai yoga wo shimasu.",en:"I do yoga once a week.",role:"staff"},
    {jp:"なんようびですか？",rom:"Nan youbi desuka?",en:"What day of the week?",role:"you"},
    {jp:"まいしゅう すいようびです。",rom:"Maishu suiyoubi desu.",en:"Every Wednesday.",role:"staff"},
    {jp:"どのくらい りょこうをしますか？",rom:"Donokurai ryokou wo shimasu ka?",en:"How often do you travel?",role:"you"},
    {jp:"２かげつに１かい りょこうをします。",rom:"Nikagetsu ni ikkai ryokou wo shimasu.",en:"I travel once every 2 months.",role:"staff"}
  ]},
  {title:"Slide 7 - Talking about what you will do - masu future",color:"",phrases:[
    {jp:"すしをたべます。",rom:"Sushi wo tabemasu.",en:"I will eat sushi.",note:"masu = polite present and future tense",role:"you"},
    {jp:"まっちゃをのみます。",rom:"Maccha wo nomimasu.",en:"I will drink matcha.",role:"you"},
    {jp:"まんがをかいます。",rom:"Manga wo kaimasu.",en:"I will buy manga.",role:"you"},
    {jp:"きょうとにいきます。",rom:"Kyouto ni ikimasu.",en:"I will go to Kyoto.",role:"you"},
    {jp:"はじめて すしを たべます。",rom:"Hajimete sushi wo tabemasu.",en:"I will eat sushi for the first time.",note:"hajimete = for the first time",role:"you"},
    {jp:"レモンサワーを のみます。",rom:"Remon sawaa wo nomimasu.",en:"I will drink lemon sour.",role:"you"},
    {jp:"やっきょくで スキンケアを かいます。",rom:"Yakkyoku de sukinkea wo kaimasu.",en:"I will buy skincare at the pharmacy.",role:"you"},
    {jp:"かんこうを します。",rom:"Kankou wo shimasu.",en:"I will do sightseeing.",role:"you"}
  ]},
  {title:"Slide 8 - I want to do - tai sentences",color:"purple",phrases:[
    {jp:"ラーメンをたべたいです。",rom:"Raamen wo tabetai desu.",en:"I want to eat ramen.",role:"you"},
    {jp:"ビールをのみたいです。",rom:"Biiru wo nomitai desu.",en:"I want to drink beer.",role:"you"},
    {jp:"かいものをしたいです。",rom:"Kaimono wo shitai desu.",en:"I want to go shopping.",role:"you"},
    {jp:"きょうとにいきたいです。",rom:"Kyouto ni ikitai desu.",en:"I want to go to Kyoto.",role:"you"},
    {jp:"にほんじんと にほんごを はなしたいです。",rom:"Nihonjin to Nihongo wo hanashitai desu.",en:"I want to speak Japanese with Japanese people.",role:"you"},
    {jp:"ファミチキをたべたいです。",rom:"Famichiki wo tabetai desu.",en:"I want to eat Famichiki (FamilyMart chicken).",role:"you"},
    {jp:"たこやきと おこのみやきをたべたいです。",rom:"Takoyaki to okonomiyaki wo tabetai desu.",en:"I want to eat takoyaki and okonomiyaki.",role:"you"},
    {jp:"ウィスキーをのみたいです。",rom:"Uisukii wo nomitai desu.",en:"I want to drink whiskey.",role:"you"},
    {jp:"セイラームーンのまんがを かいたいです。",rom:"Seiraa muun no manga wo kaitai desu.",en:"I want to buy Sailor Moon manga.",role:"you"},
    {jp:"なるとのフィギュアを かいたいです。",rom:"Naruto no figuyua wo kaitai desu.",en:"I want to buy a Naruto figure.",role:"you"},
    {jp:"りょうりを つくりたいです。",rom:"Ryouri wo tsukuritai desu.",en:"I want to make food / I want to cook.",note:"tsukurimasu = to make or bake. Drop masu add tai",role:"you"},
    {jp:"おかしを つくりたいです。",rom:"Okashi wo tsukuritai desu.",en:"I want to bake sweets.",role:"you"},
    {jp:"くろまめを つくりたいです。",rom:"Kuromame wo tsukuritai desu.",en:"I want to make black beans.",note:"くろまめ = black beans - a traditional Japanese new year dish",role:"you"},
    {jp:"あずきを つかいたいです。",rom:"Azuki wo tsukaitai desu.",en:"I want to use red beans.",note:"あずき = red beans - used in wagashi sweets and mochi",role:"you"}
  ]},
  {title:"Slide 9 - Talking about what you did - mashita past tense",color:"",phrases:[
    {jp:"すしをたべました。",rom:"Sushi wo tabemashita.",en:"I ate sushi.",note:"masu to mashita = past tense",role:"you"},
    {jp:"まっちゃをのみませんでした。",rom:"Maccha wo nomimasen deshita.",en:"I did not drink matcha.",note:"masen deshita = past negative - did not",role:"you"},
    {jp:"どうとんぼりで かいものをしました。",rom:"Doutombori de kaimono wo shimashita.",en:"I went shopping at Dotonbori.",role:"you"},
    {jp:"かんこうしました。",rom:"Kankou shimashita.",en:"I did sightseeing.",role:"you"},
    {jp:"しちめんちょうと ごはんを つくりました。",rom:"Shichimenchou to gohan wo tsukurimashita.",en:"I made turkey and rice.",note:"tsukurimashita = I made past tense",role:"you"},
    {jp:"オンラインで かいものをしました。",rom:"Onrain de kaimono wo shimashita.",en:"I went shopping online.",note:"onrain = online",role:"you"},
    {jp:"マックブックを かいました。",rom:"Makkubukku wo kaimashita.",en:"I bought a MacBook.",role:"you"},
    {jp:"めがねを かいました。",rom:"Megane wo kaimashita.",en:"I bought glasses.",role:"you"},
    {jp:"サングラスを かいました。",rom:"Sangurasu wo kaimashita.",en:"I bought sunglasses.",role:"you"}
  ]},
  {title:"New vocab from August 5th lesson",color:"blue",phrases:[
    {jp:"めがね",rom:"megane",en:"Glasses / Eyeglasses"},
    {jp:"サングラス",rom:"sangurasu",en:"Sunglasses"},
    {jp:"オンライン",rom:"onrain",en:"Online"},
    {jp:"くろまめ",rom:"kuromame",en:"Black beans",note:"Traditional Japanese new year dish"},
    {jp:"あずき",rom:"azuki",en:"Red beans / Adzuki beans",note:"Used in wagashi sweets, mochi, and anko paste"},
    {jp:"つくります",rom:"tsukurimasu",en:"Make / Create / Bake / Cook"},
    {jp:"つくりたいです",rom:"tsukuritai desu",en:"I want to make / I want to bake"},
    {jp:"つくりました",rom:"tsukurimashita",en:"I made / I baked (past tense)"}
  ]},
  {title:"Slide 10 - How was it - past adjectives",color:"",phrases:[
    {jp:"どうでしたか？",rom:"Dou deshita ka?",en:"How was it?",role:"staff"},
    {jp:"おいしかったです！",rom:"Oishikatta desu!",en:"It was delicious!",note:"oishii + katta = past form. Drop the i and add katta",role:"you"},
    {jp:"たのしかったです！",rom:"Tanoshikatta desu!",en:"It was fun!",note:"tanoshii + katta = tanoshikatta",role:"you"},
    {jp:"よかったです！",rom:"Yokatta desu!",en:"It was great!",role:"you"},
    {jp:"たかかったです。",rom:"Takakatta desu.",en:"It was expensive.",note:"takai + katta = takakatta",role:"you"},
    {jp:"むずかしかったです。",rom:"Muzukashikatta desu.",en:"It was difficult.",role:"you"}
  ]},
  {title:"Past adjective pattern - i adjective + katta",color:"purple",phrases:[
    {jp:"おいしい→おいしかった",rom:"oishii - oishikatta",en:"delicious - was delicious"},
    {jp:"たのしい→たのしかった",rom:"tanoshii - tanoshikatta",en:"fun - was fun"},
    {jp:"たかい→たかかった",rom:"takai - takakatta",en:"expensive - was expensive"},
    {jp:"やすい→やすかった",rom:"yasui - yasukatta",en:"cheap - was cheap"},
    {jp:"むずかしい→むずかしかった",rom:"muzukashii - muzukashikatta",en:"difficult - was difficult"},
    {jp:"おもしろい→おもしろかった",rom:"omoshiroi - omoshirokatta",en:"interesting - was interesting"},
    {jp:"すごい→すごかった",rom:"sugoi - sugokatta",en:"amazing - was amazing"}
  ]},
  {title:"Slide 11 - Talking about your travel plans",color:"",phrases:[
    {jp:"とうきょうと おおさかに いきます。",rom:"Tokyo to Osaka ni ikimasu.",en:"I will go to Tokyo and Osaka.",note:"A to B ni ikimasu = I will go to A and B",role:"you"},
    {jp:"きょうとと ならに いきます。",rom:"Kyouto to Nara ni ikimasu.",en:"I will go to Kyoto and Nara.",role:"you"},
    {jp:"ともだちと おおさかに いきます。",rom:"Tomodachi to Osaka ni ikimasu.",en:"I will go to Osaka with friends.",note:"to = with (person)",role:"you"},
    {jp:"どこに いきますか？",rom:"Doko ni ikimasu ka?",en:"Where will you go?",role:"staff"},
    {jp:"なにを しますか？",rom:"Nani wo shimasu ka?",en:"What will you do?",role:"staff"}
  ]},
  {title:"Slide 12 - Asking for help - te-form + moraemasen ka",color:"purple",phrases:[
    {jp:"〜てもらえませんか。",rom:"~te moraemasen ka?",en:"Could you ___ for me?",note:"Grammar: te-form + moraemasen ka = polite request for help"},
    {jp:"しゃしんをとって もらえませんか。",rom:"Shashin wo totte moraemasen ka?",en:"Could you take a photo for me?",role:"you"},
    {jp:"ゆっくりはなして もらえませんか。",rom:"Yukkuri hanashite moraemasen ka?",en:"Could you speak more slowly?",role:"you"},
    {jp:"かいて もらえませんか。",rom:"Kaite moraemasen ka?",en:"Could you write it down?",role:"you"},
    {jp:"もういちど いって もらえませんか。",rom:"Mou ichido itte moraemasen ka?",en:"Could you say that again?",role:"you"},
    {jp:"えいごで いって もらえませんか。",rom:"Eigo de itte moraemasen ka?",en:"Could you say it in English?",role:"you"}
  ]},
  {title:"Slide 13 - Useful reactions",color:"blue",phrases:[
    {jp:"かっこいいです！",rom:"Kakkoii desu!",en:"Cool! That is cool!"},
    {jp:"おもしろいです！",rom:"Omoshiroi desu!",en:"Interesting! That is interesting!"},
    {jp:"たのしいです！",rom:"Tanoshii desu!",en:"Fun! That is fun! (right now)"},
    {jp:"たのしみです！",rom:"Tanoshimi desu!",en:"Looking forward to it!"},
    {jp:"たのしかったです！",rom:"Tanoshikatta desu!",en:"It was fun! (past)"},
    {jp:"すごいですね！",rom:"Sugoi desu ne!",en:"Amazing! That is amazing!"},
    {jp:"そうなんですか！",rom:"Sou nan desuka!",en:"Is that so! / Really! (showing interest)"},
    {jp:"いいですね！",rom:"Ii desu ne!",en:"Sounds great! / That is nice!"},
    {jp:"うらやましいです！",rom:"Urayamashii desu!",en:"I am jealous! Lucky you!"}
  ]},
  {title:"Situational dialogue - Full conversation with a local",color:"",phrases:[
    {jp:"おなまえはなんですか？",rom:"O-namae wa nan desuka?",en:"What is your name?",role:"staff"},
    {jp:"ドノバンです。よろしくおねがいします。",rom:"Donoban desu. Yoroshiku onegaishimasu.",en:"I am Donovan. Nice to meet you.",role:"you"},
    {jp:"しゅっしんはどこですか？",rom:"Shusshin wa doko desuka?",en:"Where are you from?",role:"staff"},
    {jp:"アメリカのケンタッキーです。",rom:"Amerika no Kentakkii desu.",en:"I am from Kentucky, America.",role:"you"},
    {jp:"そうなんですか！にほんに いつきましたか？",rom:"Sou nan desuka! Nihon ni itsu kimashita ka?",en:"Is that so! When did you come to Japan?",role:"staff"},
    {jp:"くがつ にじゅうしちにちに きました。",rom:"Kugatsu nijuu-shichi-nichi ni kimashita.",en:"I came on September 27th.",role:"you"},
    {jp:"どのくらい にほんに いますか？",rom:"Donokurai Nihon ni imasu ka?",en:"How long are you staying?",role:"staff"},
    {jp:"いっしゅうかん います。とうきょうと おおさかに いきます！",rom:"Isshukan imasu. Tokyo to Osaka ni ikimasu!",en:"One week. I will go to Tokyo and Osaka!",role:"you"},
    {jp:"いいですね！にほんで なにを したいですか？",rom:"Ii desu ne! Nihon de nani wo shitai desuka?",en:"Sounds great! What do you want to do in Japan?",role:"staff"},
    {jp:"ラーメンをたべたいです！あつかんも のみたいです！かんこうも したいです！",rom:"Raamen wo tabetai desu! Atsukan mo nomitai desu! Kankou mo shitai desu!",en:"I want to eat ramen! I also want to drink hot sake! And do sightseeing!",role:"you"},
    {jp:"すごいですね！しゅみはなんですか？",rom:"Sugoi desu ne! Shumi wa nan desuka?",en:"Amazing! What are your hobbies?",role:"staff"},
    {jp:"バスケットボールが すきです。１しゅうかんに１かい します。",rom:"Basukettoboru ga suki desu. Isshukan ni ikkai shimasu.",en:"I like basketball. I play once a week.",role:"you"},
    {jp:"かっこいいです！たのしんできてください！",rom:"Kakkoii desu! Tanoshinde kite kudasai!",en:"That is cool! Go and enjoy yourself!",role:"staff"},
    {jp:"ありがとうございます！たのしみです！",rom:"Arigatou gozaimasu! Tanoshimi desu!",en:"Thank you! I am looking forward to it!",role:"you"}
  ]}
]},
{id:"social",tab:"Socialization",title:"Making Friends and Dating",sub:"Compliments, asking someone out, getting food and drinks, conversation starters",sections:[
  {title:"Key vocab - socializing",color:"blue",phrases:[
    {jp:"ともだち",rom:"tomodachi",en:"Friend"},
    {jp:"かれし",rom:"kareshi",en:"Boyfriend"},
    {jp:"かのじょ",rom:"kanojo",en:"Girlfriend"},
    {jp:"すき",rom:"suki",en:"Like / Love (romantic or general)"},
    {jp:"だいすき",rom:"daisuki",en:"Really like / Love a lot"},
    {jp:"かわいい",rom:"kawaii",en:"Cute / Adorable"},
    {jp:"かっこいい",rom:"kakkoii",en:"Cool / Handsome"},
    {jp:"きれい",rom:"kirei",en:"Beautiful / Pretty"},
    {jp:"えがお",rom:"egao",en:"Smile"},
    {jp:"のみもの",rom:"nomimono",en:"Drink (noun)"},
    {jp:"のみに いく",rom:"nomi ni iku",en:"Go for drinks"},
    {jp:"たべに いく",rom:"tabe ni iku",en:"Go for food / Go eat"},
    {jp:"いっしょに",rom:"issho ni",en:"Together"},
    {jp:"デート",rom:"deeto",en:"Date (romantic outing)"},
    {jp:"れんらくさき",rom:"renraku saki",en:"Contact info / Number"}
  ]},
  {title:"Complimenting someone",color:"",phrases:[
    {jp:"かわいいですね！",rom:"Kawaii desu ne!",en:"You are so cute!"},
    {jp:"きれいですね！",rom:"Kirei desu ne!",en:"You are beautiful!"},
    {jp:"かっこいいですね！",rom:"Kakkoii desu ne!",en:"You are so cool! You look great!"},
    {jp:"すてきですね！",rom:"Suteki desu ne!",en:"You are wonderful! How lovely!"},
    {jp:"えがおが すてきですね。",rom:"Egao ga suteki desu ne.",en:"You have a beautiful smile.",note:"egao = smile"},
    {jp:"めが きれいですね。",rom:"Me ga kirei desu ne.",en:"Your eyes are beautiful.",note:"me = eyes"},
    {jp:"にほんごが じょうずですね！",rom:"Nihongo ga jouzu desu ne!",en:"Your Japanese is great!",note:"A compliment you might receive too!"},
    {jp:"センスが いいですね！",rom:"Sensu ga ii desu ne!",en:"You have great style / taste!"},
    {jp:"おもしろいですね！",rom:"Omoshiroi desu ne!",en:"You are so interesting!"},
    {jp:"やさしいですね。",rom:"Yasashii desu ne.",en:"You are so kind."}
  ]},
  {title:"Responding to compliments",color:"",phrases:[
    {jp:"ありがとうございます！",rom:"Arigatou gozaimasu!",en:"Thank you very much!",role:"you"},
    {jp:"そんなことないですよ。",rom:"Sonna koto nai desu yo.",en:"No no that is not true. (humble response)",note:"Japanese people often deflect compliments - this is the standard reply",role:"you"},
    {jp:"あなたも かわいいですよ！",rom:"Anata mo kawaii desu yo!",en:"You are cute too!",role:"you"},
    {jp:"うれしいです！",rom:"Ureshii desu!",en:"I am so happy! That makes me happy!",role:"you"}
  ]},
  {title:"Asking about food and drinks",color:"",phrases:[
    {jp:"このたべものは すきですか？",rom:"Kono tabemono wa suki desuka?",en:"Do you like this food?",role:"you"},
    {jp:"はい、だいすきです！",rom:"Hai, daisuki desu!",en:"Yes I love it!",role:"staff"},
    {jp:"あまり すきじゃないです。",rom:"Amari suki janai desu.",en:"I do not really like it that much.",role:"staff"},
    {jp:"からいのは すきですか？",rom:"Karai no wa suki desuka?",en:"Do you like spicy food?",role:"you"},
    {jp:"このビールは どうですか？",rom:"Kono biiru wa dou desuka?",en:"How is this beer?",role:"you"},
    {jp:"おいしいですね！",rom:"Oishii desu ne!",en:"It is delicious right!",role:"staff"},
    {jp:"なにが いちばん すきですか？",rom:"Nani ga ichiban suki desuka?",en:"What do you like the most?",role:"you"},
    {jp:"ラーメンが いちばん すきです！",rom:"Raamen ga ichiban suki desu!",en:"I like ramen the most!",role:"staff"},
    {jp:"これを たべてみてください！",rom:"Kore wo tabete mite kudasai!",en:"Please try eating this!",note:"tabete mite = try doing / give it a try",role:"you"},
    {jp:"はじめて たべました！おいしかった！",rom:"Hajimete tabemashita! Oishikatta!",en:"I ate it for the first time! It was delicious!",role:"you"}
  ]},
  {title:"Asking someone to get food or drinks",color:"purple",phrases:[
    {jp:"いっしょに のみに いきませんか？",rom:"Issho ni nomi ni ikimasen ka?",en:"Would you like to go for drinks together?",note:"ikimasen ka = would you like to go (negative question = polite invite)",role:"you"},
    {jp:"いっしょに たべに いきませんか？",rom:"Issho ni tabe ni ikimasen ka?",en:"Would you like to go eat together?",role:"you"},
    {jp:"このへんに おすすめの バーは ありますか？",rom:"Kono hen ni osusume no baa wa arimasu ka?",en:"Is there a bar you recommend around here?",role:"you"},
    {jp:"いっしょに ごはんを たべませんか？",rom:"Issho ni gohan wo tabemasen ka?",en:"Would you like to eat together?",role:"you"},
    {jp:"あとで のみに いきましょう！",rom:"Ato de nomi ni ikimashou!",en:"Lets go for drinks later!",note:"ikimashou = let us go",role:"you"},
    {jp:"なんか たべたいですか？",rom:"Nanka tabetai desuka?",en:"Do you want to eat something?",role:"you"},
    {jp:"おごりますよ！",rom:"Ogori masu yo!",en:"It is my treat! I will pay!",note:"Saying this is a bold and kind move!",role:"you"}
  ]},
  {title:"Accepting and declining invitations",color:"",phrases:[
    {jp:"いいですね！いきましょう！",rom:"Ii desu ne! Ikimashou!",en:"Sounds great! Let us go!",role:"staff"},
    {jp:"たのしそうですね！",rom:"Tanoshisou desu ne!",en:"That sounds fun!",role:"staff"},
    {jp:"ぜひ！",rom:"Zehi!",en:"By all means! Absolutely! Yes please!",role:"staff"},
    {jp:"ちょっと むずかしいです。",rom:"Chotto muzukashii desu.",en:"That is a little difficult. (polite way to decline)",note:"chotto muzukashii = literally a little difficult - the standard soft no in Japan",role:"staff"},
    {jp:"きょうは ちょっと…",rom:"Kyou wa chotto...",en:"Today is a little... (trailing off = polite no)",note:"Trailing off with chotto means no without saying no directly",role:"staff"},
    {jp:"またこんど！",rom:"Mata kondo!",en:"Maybe next time!",role:"staff"},
    {jp:"よていが あります。",rom:"Yotei ga arimasu.",en:"I have plans.",role:"staff"}
  ]},
  {title:"Asking someone out",color:"purple",phrases:[
    {jp:"こんど いっしょに でかけませんか？",rom:"Kondo issho ni dekakemasen ka?",en:"Would you like to go out together sometime?",role:"you"},
    {jp:"デートしませんか？",rom:"Deeto shimasen ka?",en:"Would you like to go on a date?",role:"you"},
    {jp:"れんらくさきを おしえてもらえますか？",rom:"Renraku saki wo oshiete moraemasu ka?",en:"Could you give me your contact info?",note:"More natural than asking for a number directly",role:"you"},
    {jp:"LINEを おしえてもらえますか？",rom:"LINE wo oshiete moraemasu ka?",en:"Could you give me your LINE?",note:"LINE is the main messaging app in Japan - like WhatsApp",role:"you"},
    {jp:"またあいたいです。",rom:"Mata aitai desu.",en:"I want to see you again.",role:"you"},
    {jp:"すきです。",rom:"Suki desu.",en:"I like you. (romantic confession)",note:"In Japan suki desu is the standard way to confess feelings",role:"you"},
    {jp:"つきあってください。",rom:"Tsukiatte kudasai.",en:"Please go out with me. (asking to be official)",note:"This is the direct Japanese way to ask someone to be your partner",role:"you"}
  ]},
  {title:"Expressing feelings",color:"",phrases:[
    {jp:"たのしいです！",rom:"Tanoshii desu!",en:"This is so fun!",role:"you"},
    {jp:"たのしかったです！",rom:"Tanoshikatta desu!",en:"That was so fun!",role:"you"},
    {jp:"あなたと いると たのしいです。",rom:"Anata to iru to tanoshii desu.",en:"I have fun when I am with you.",note:"A natural and sweet thing to say",role:"you"},
    {jp:"もっと はなしたいです。",rom:"Motto hanashitai desu.",en:"I want to talk more.",role:"you"},
    {jp:"きょうは ありがとうございました！",rom:"Kyou wa arigatou gozaimashita!",en:"Thank you so much for today!",note:"Said at the end of a date or hangout - very natural",role:"you"},
    {jp:"また あいましょう！",rom:"Mata aimashou!",en:"Let us meet again!",role:"you"},
    {jp:"うれしかったです！",rom:"Ureshikatta desu!",en:"I was so happy! It made me happy!",role:"you"},
    {jp:"きんちょうします。",rom:"Kinchyou shimasu.",en:"I am nervous.",note:"Saying this can be endearing in a date situation!",role:"you"}
  ]},
  {title:"Bar and drink vocabulary",color:"blue",phrases:[

    {jp:"ハイボール",rom:"haiboru",en:"Highball (whiskey and soda) - very popular in Japan"},

    {jp:"あつかん",rom:"atsukan",en:"Hot sake"},

  {title:"Situational dialogue - Meeting someone at an izakaya",color:"",phrases:[

    {jp:"はじめまして！わたしは Kです！かんぱい！",rom:"Hajimemashite! Watashi wa K desu! Kanpai!",en:"Nice to meet you! I am K! Cheers!",role:"staff"},

    {jp:"ありがとうございます！そんなことないですよ！",rom:"Arigatou gozaimasu! Sonna koto nai desu yo!",en:"Thank you! No no that is not true!",role:"staff"},
    {jp:"こんど いっしょに たべに いきませんか？",rom:"Kondo issho ni tabe ni ikimasen ka?",en:"Would you like to go eat together sometime?",role:"you"},

  ]},
  {title:"Situational dialogue - Asking someone out",color:"",phrases:[
    {jp:"きょうは とても たのしかったです。",rom:"Kyou wa totemo tanoshikatta desu.",en:"Today was really fun.",role:"you"},
    {jp:"わたしも です！ドノバンさんは おもしろいですね。",rom:"Watashi mo desu! Donoban-san wa omoshiroi desu ne.",en:"Me too! You are so interesting Donovan.",role:"staff"},
    {jp:"あなたと いると たのしいです。",rom:"Anata to iru to tanoshii desu.",en:"I have fun when I am with you.",role:"you"},
