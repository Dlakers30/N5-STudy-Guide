]},
{id:"fillers",tab:"Conversation Fillers",title:"Conversation Fillers and Natural Reactions",sub:"The small words that make you sound fluent — reactions, agreements, hesitations, and flow phrases",sections:[
  {title:"Agreement and understanding",color:"blue",phrases:[
    {jp:"そうですね。",rom:"Sou desu ne.",en:"That is right. / I agree. / Yes indeed.",note:"One of the most used phrases in Japanese. Said while nodding to show you are listening and agree"},
    {jp:"そうなんですか！",rom:"Sou nan desuka!",en:"Is that so! / Really! Oh wow!",note:"Shows genuine surprise or interest in what the other person said. Use often"},
    {jp:"そうですか。",rom:"Sou desuka.",en:"I see. / Is that so. (neutral tone)",note:"Said with a flat tone = I see, I understand. Not surprised, just acknowledging"},
    {jp:"なるほど！",rom:"Naruhodo!",en:"I see! / That makes sense! / Ah I understand!",note:"Use this when something clicks or when someone explains something well"},
    {jp:"なるほどですね。",rom:"Naruhodo desu ne.",en:"That makes sense. / Ah I see, right.",note:"Slightly more polite version of naruhodo. Very natural in conversation"},
    {jp:"たしかに。",rom:"Tashika ni.",en:"Certainly. / That is true. / Fair point.",note:"Used when you hear something and think yes that is a good point"},
    {jp:"たしかに そうですね。",rom:"Tashika ni sou desu ne.",en:"That is certainly true. / You are right about that."},
    {jp:"ほんとうですか！",rom:"Hontou desuka!",en:"Really?! Is that true?!",note:"Expresses genuine surprise. Raise your tone for emphasis"},
    {jp:"ほんとうに？",rom:"Hontou ni?",en:"Really? Seriously?",note:"More casual version. Friends use this a lot"}
  ]},
  {title:"Showing you are listening - aizuchi",color:"amber",phrases:[
    {jp:"うん",rom:"un",en:"Yeah / Uh-huh (casual agreement)",note:"The casual yes. Do not use with strangers or elders - use hai instead"},
    {jp:"はい",rom:"hai",en:"Yes / I hear you / Mm-hmm (polite)",note:"Said repeatedly while listening to show you are following along"},
    {jp:"ええ",rom:"ee",en:"Yes / Mm-hmm (slightly formal)",note:"More formal than un, slightly softer than hai"},
    {jp:"へえ！",rom:"Hee!",en:"Oh! / Wow! / Huh! (surprised interest)",note:"Shows you are genuinely interested or mildly surprised by new information"},
    {jp:"へえ、そうなんですか！",rom:"Hee, sou nan desuka!",en:"Oh wow, is that right!",note:"Combining two fillers for natural emphasis"},
    {jp:"あ、そうか。",rom:"A, sou ka.",en:"Oh, I see. / Ah, right.",note:"Casual. A small realization moment"},
    {jp:"あ、なるほど！",rom:"A, naruhodo!",en:"Oh, that makes sense!"},
    {jp:"うんうん。",rom:"Un un.",en:"Yeah yeah. / Mm-mm. (nodding along)",note:"Repeated to show you are engaged and following the story"}
  ]},
  {title:"Buying time and thinking",color:"",phrases:[
    {jp:"ええと…",rom:"Eeto...",en:"Umm... / Let me think... / Well...",note:"The Japanese version of um or er. Use when you need a second to think"},
    {jp:"あのう…",rom:"Anou...",en:"Um... / Err... / Well... (hesitation)",note:"Slightly softer than eeto. Also used to politely get someone's attention"},
    {jp:"そうですねえ…",rom:"Sou desu nee...",en:"Well... let me think... / Hmm...",note:"Stretching the ne sound while thinking. Very natural - like saying well... in English"},
    {jp:"ちょっと まって。",rom:"Chotto matte.",en:"Wait a moment. / Hold on.",note:"Casual. Use when you need a second"},
    {jp:"ちょっと まってください。",rom:"Chotto matte kudasai.",en:"Please wait a moment. (polite)"},
    {jp:"なんと いえばいいかな…",rom:"Nanto ieba ii ka na...",en:"How should I put this... / What is the word...",note:"Use when searching for the right word in Japanese"},
    {jp:"にほんごで なんといいますか？",rom:"Nihongo de nan to iimasu ka?",en:"How do you say it in Japanese?",note:"Very useful phrase when you know the English but not the Japanese",role:"you"}
  ]},
  {title:"Softening and hedging",color:"",phrases:[
    {jp:"ちょっと…",rom:"Chotto...",en:"A little... / Kind of... / Hmm...",note:"One of the most important words in Japanese. Trailing off with chotto softens any statement and implies a polite no or hesitation"},
    {jp:"まあまあ。",rom:"Maa maa.",en:"So-so. / Not bad. / It is okay.",note:"Said when something is neither great nor terrible. Sometimes said to calm someone down"},
    {jp:"まあ、そうですね。",rom:"Maa, sou desu ne.",en:"Well, I suppose so. / Yeah, kind of.",note:"Maa at the start = well, I guess, or a soft agreement"},
    {jp:"まあ、いいか。",rom:"Maa, ii ka.",en:"Well, whatever. / It is fine I guess.",note:"Said to yourself or casually to mean ah well, never mind"},
    {jp:"〜かな。",rom:"~ka na.",en:"I wonder... / Maybe... / I think...",note:"Adding kana to the end of a sentence makes it sound like you are thinking aloud. Very natural"},
    {jp:"どうかな。",rom:"Dou ka na.",en:"I wonder how it is. / Not sure...",note:"A soft way to express uncertainty"},
    {jp:"〜ですかね。",rom:"~desu ka ne.",en:"I wonder if... / Do you think...?",note:"A very natural polite way to wonder or speculate out loud"}
  ]},
  {title:"Showing surprise and emotion",color:"",phrases:[
    {jp:"えっ！",rom:"E!",en:"Eh?! / What?! (surprised)",note:"Short sharp reaction to something unexpected"},
    {jp:"えええ！",rom:"Eee!",en:"No way! / What?! (more dramatic surprise)",note:"Stretch the e sound for more emphasis - very expressive"},
    {jp:"うそ！",rom:"Uso!",en:"No way! / You are kidding! / Seriously?!",note:"Literally means lie but used like no way or shut up in casual speech"},
    {jp:"うそでしょ！",rom:"Uso desho!",en:"You must be joking! / No way that is real!"},
    {jp:"まじで！",rom:"Maji de!",en:"Seriously?! / For real?!",note:"Very casual. Like saying for real or seriously in English. Only use with friends"},
    {jp:"まじか！",rom:"Maji ka!",en:"Seriously?! / No way! (reacting to info)",note:"Very casual reaction. Similar to no way or seriously"},
    {jp:"やばい！",rom:"Yabai!",en:"Crazy! / Insane! / Amazing! / Oh no!",note:"Originally meant dangerous but now used for anything extreme - good OR bad. The most versatile casual word"},
    {jp:"すごい！",rom:"Sugoi!",en:"Amazing! / Incredible! / Wow!"},
    {jp:"すごいですね！",rom:"Sugoi desu ne!",en:"That is amazing! (polite)"}
  ]},
  {title:"Positive reactions and encouragement",color:"",phrases:[
    {jp:"いいですね！",rom:"Ii desu ne!",en:"That is great! / Sounds good! / Nice!"},
    {jp:"いいね！",rom:"Ii ne!",en:"Nice! / Great! / I like it! (casual)",note:"The casual version. Also what you tap on social media in Japan"},
    {jp:"よかったですね！",rom:"Yokatta desu ne!",en:"That is great! / I am glad! / Good for you!",note:"Said when hearing good news about someone"},
    {jp:"よかった！",rom:"Yokatta!",en:"Thank goodness! / Great! / What a relief!",note:"Casual - expressing relief or happiness that something worked out"},
    {jp:"たのしそう！",rom:"Tanoshisou!",en:"That sounds fun! / Looks fun!",note:"sou after an adjective = looks or sounds like"},
    {jp:"おもしろそう！",rom:"Omoshirosou!",en:"That sounds interesting!"},
    {jp:"さすが！",rom:"Sasuga!",en:"As expected! / That is so like you! / Impressive!",note:"Said when someone does something impressive that fits their character. Very complimentary"},
    {jp:"がんばって！",rom:"Ganbatte!",en:"Do your best! / Good luck! / You got this!",note:"The most common encouragement phrase in Japanese"}
  ]},
  {title:"Wrapping up and transitioning",color:"",phrases:[
    {jp:"じゃあ。",rom:"Jaa.",en:"Well then. / Okay then. / So...",note:"Used to signal a transition, wrap up a conversation, or say okay moving on"},
    {jp:"じゃあ、そういうことで。",rom:"Jaa, sou iu koto de.",en:"Well then, so that is how it is. / Alright then.",note:"Natural way to wrap something up - like saying so, that settles it"},
    {jp:"じゃあ、また。",rom:"Jaa, mata.",en:"Well then, see you later. / Alright, bye."},
    {jp:"それはそうと…",rom:"Sore wa sou to...",en:"Anyway... / By the way... (changing topic)",note:"Used to smoothly change the subject"},
    {jp:"ところで…",rom:"Tokoro de...",en:"By the way... / Speaking of which...",note:"The standard way to change topic politely"},
    {jp:"はなしが かわりますが…",rom:"Hanashi ga kawarimasu ga...",en:"Changing the subject, but... (formal)",note:"Formal signal that you are shifting to a new topic"},
    {jp:"とにかく。",rom:"Tonikaku.",en:"Anyway. / In any case. / The point is.",note:"Like saying anyway or the bottom line is in English"}
  ]},
  {title:"Filler phrases in action - sample conversation",color:"",phrases:[
    {jp:"きのう、ラーメンを たべにいったんです！",rom:"Kinou, raamen wo tabe ni ittan desu!",en:"I went to eat ramen yesterday!",role:"staff"},
    {jp:"へえ、そうなんですか！どうでしたか？",rom:"Hee, sou nan desuka! Dou deshita ka?",en:"Oh wow, really! How was it?",role:"you"},
    {jp:"めちゃくちゃ おいしかったです！",rom:"Mechakucha oishikatta desu!",en:"It was incredibly delicious!",role:"staff"},
    {jp:"まじですか！どこのラーメンですか？",rom:"Maji desuka! Doko no raamen desuka?",en:"Seriously?! Whose ramen was it? Where?",role:"you"},
    {jp:"ええと…しぶやの ちかくの みせです。",rom:"Eeto... Shibuya no chikaku no mise desu.",en:"Umm... It is a shop near Shibuya.",role:"staff"},
    {jp:"なるほど！わたしも いきたいです！",rom:"Naruhodo! Watashi mo ikitai desu!",en:"Ah I see! I want to go too!",role:"you"},
    {jp:"いいですね！いっしょに いきませんか？",rom:"Ii desu ne! Issho ni ikimasen ka?",en:"Sounds great! Would you like to go together?",role:"staff"},
    {jp:"ぜひ！たのしみです！",rom:"Zehi! Tanoshimi desu!",en:"Absolutely! I am looking forward to it!",role:"you"}
  ]}
]},

  {title:"Talking about your weekend - what you did",color:"",phrases:[

  {title:"Talking about plans - what is coming up",color:"",phrases:[

    {jp:"たくさん たべたいです！",rom:"Takusan tabetai desu!",en:"I want to eat a lot!",role:"you"}
  ]},
  {title:"Situational dialogue - Getting to know someone",color:"",phrases:[
    {jp:"しゅみは なんですか？",rom:"Shumi wa nan desuka?",en:"What are your hobbies?",role:"staff"},
    {jp:"スポーツと おんがくと ビデオゲームが すきです。",rom:"Supootsu to ongaku to bideo geemu ga suki desu.",en:"I like sports, music, and video games.",role:"you"},

    {jp:"えらいですね！にほんごが じょうずですよ。",rom:"Erai desu ne! Nihongo ga jouzu desu yo.",en:"That is impressive! Your Japanese is good.",role:"staff"},
    {jp:"ありがとうございます！まだまだ れんしゅうちゅうです。",rom:"Arigatou gozaimasu! Mada mada renshuuchuu desu.",en:"Thank you! I am still practicing.",role:"you"}
  ]},
  {title:"Situational dialogue - Talking about the Japan trip",color:"",phrases:[
    {jp:"にほんに いくんですか？いつですか？",rom:"Nihon ni ikun desuka? Itsu desuka?",en:"You are going to Japan? When?",role:"staff"},

    {jp:"なにを たべたいですか？",rom:"Nani wo tabetai desuka?",en:"What do you want to eat?",role:"staff"},
    {jp:"ラーメンと とんかつと すしを たべたいです！",rom:"Ramen to tonkatsu to sushi wo tabetai desu!",en:"I want to eat ramen, tonkatsu, and sushi!",role:"you"},

  ]}
]},

    {jp:"とおか (10日)",rom:"tooka",en:"10th - irregular"},
    {jp:"はつか (20日)",rom:"hatsuka",en:"20th - completely unique word"}
  ]},
  {title:"Using dates in sentences",color:"",phrases:[
    {jp:"きょうは なんにちですか？",rom:"Kyou wa nannichi desuka?",en:"What date is it today?",role:"you"},
    {jp:"きょうは にじゅうよっかです。",rom:"Kyou wa nijuuyokka desu.",en:"Today is the 24th.",role:"staff"},
    {jp:"きょうは にじゅうごにちです。",rom:"Kyou wa nijuugonichi desu.",en:"Today is the 25th.",role:"staff"},
    {jp:"くがつ にじゅうよっかに にほんに いきます。",rom:"Kugatsu nijuuyokka ni Nihon ni ikimasu.",en:"I am going to Japan on September 24th.",note:"Month + date + ni = on that date",role:"you"},
    {jp:"たんじょうびは いつですか？",rom:"Tanjoubi wa itsu desuka?",en:"When is your birthday?",role:"staff"}
  ]},
  {title:"Minutes - fun and pun (the difference)",color:"purple",phrases:[
    {jp:"いっぷん",rom:"ippun",en:"1 minute",note:"★ pun - irregular"},
    {jp:"にふん",rom:"nifun",en:"2 minutes"},
    {jp:"さんぷん",rom:"sanpun",en:"3 minutes",note:"★ pun"},
    {jp:"よんふん",rom:"yonfun",en:"4 minutes"},
    {jp:"ごふん",rom:"gofun",en:"5 minutes"},
    {jp:"ろっぷん",rom:"roppun",en:"6 minutes",note:"★ pun + double consonant"},
    {jp:"ななふん",rom:"nanafun",en:"7 minutes"},
    {jp:"はっぷん / はちふん",rom:"happun / hachifun",en:"8 minutes",note:"★ both forms used"},
    {jp:"きゅうふん",rom:"kyuufun",en:"9 minutes"},
    {jp:"じゅっぷん / じっぷん",rom:"juppun / jippun",en:"10 minutes",note:"★ pun + double consonant"},
    {jp:"じゅうごふん",rom:"juugo-fun",en:"15 minutes"},
    {jp:"さんじゅっぷん / はん",rom:"sanjuppun / han",en:"30 minutes / half past",note:"han means half - very common!"},
    {jp:"なんぷんですか？",rom:"Nanpun desuka?",en:"How many minutes?",role:"you"},
    {jp:"あるいて ごふんです。",rom:"Aruite go-fun desu.",en:"It is 5 minutes on foot.",role:"staff"},
    {jp:"15ふんくらいです。",rom:"Juugo-fun kurai desu.",en:"It is about 15 minutes.",note:"kurai = about / approximately",role:"staff"}
  ]},
  {title:"Fun vs Pun - the rule",color:"amber",phrases:[
    {jp:"ふん (fun) → 2、4、5、7、9",rom:"fun",en:"Use FUN after: 2 ni, 4 yon, 5 go, 7 nana, 9 kyuu",note:"Mnemonic: these numbers all end in a vowel or soft n sound (ni, yon, go, nana, kyuu) - soft ending, soft fun."},
    {jp:"ぷん (pun) → 1、3、6、8、10",rom:"pun",en:"Use PUN after: 1 ichi/ip, 3 san, 6 rok, 8 hap, 10 jup",note:"Mnemonic: 1,3,6,8,10 are the numbers that double their final consonant (ippun, roppun, juppun) - that hard stop punches fun into pun."},
    {jp:"いっぷん、にふん、さんぷん、よんふん、ごふん",rom:"ippun, nifun, sanpun, yonfun, gofun",en:"1 min, 2 min, 3 min, 4 min, 5 min"}
  ]},
  {title:"Hours - jikan",color:"blue",grid:true,phrases:[
    {jp:"じかん",rom:"jikan",en:"Hour(s) - the counter for duration in hours"},
    {jp:"いちじかん",rom:"ichijikan",en:"1 hour"},
    {jp:"にじかん",rom:"nijikan",en:"2 hours"},
    {jp:"さんじかん",rom:"sanjikan",en:"3 hours"},
    {jp:"よじかん",rom:"yojikan",en:"4 hours"},
    {jp:"ごじかん",rom:"gojikan",en:"5 hours"},
    {jp:"はんじかん",rom:"hanjikan",en:"Half an hour (30 minutes)"},
    {jp:"いちじかんはん",rom:"ichijikan han",en:"1 hour and a half",note:"hour + han = hour and a half"},
    {jp:"なんじかんですか？",rom:"Nanjikan desuka?",en:"How many hours?",role:"you"},
    {jp:"にじかんくらいです。",rom:"Nijikan kurai desu.",en:"About 2 hours.",role:"staff"}
  ]},
  {title:"Important difference - じ vs じかん",color:"amber",phrases:[
    {jp:"じ (ji) = o'clock - a specific point in time",rom:"ji",en:"Ji = specific time on the clock  e.g. rokuji = 6 o'clock"},
    {jp:"じかん (jikan) = hours - a length of time",rom:"jikan",en:"Jikan = duration e.g. nijikan = 2 hours (duration)"},
    {jp:"ろくじ に おきます。",rom:"Rokuji ni okimasu.",en:"I wake up AT 6 o'clock. (ji = specific time)",note:"ni marks the specific time"},
    {jp:"まいにち ろくじかん ねます。",rom:"Mainichi rokujikan nemasu.",en:"I sleep for 6 hours every day. (jikan = duration)"},
    {jp:"にじかんはん かかります。",rom:"Nijikan han kakarimasu.",en:"It takes 2 and a half hours.",role:"staff"}
  ]},
  {title:"Around this time - koro and goro",color:"blue",phrases:[
    {jp:"ごろ / ころ",rom:"goro / koro",en:"Around / About - used for approximate times and periods",note:"goro after a time, koro in other contexts"},
    {jp:"くじごろ",rom:"kuji goro",en:"Around 9 o'clock",note:"time + goro = around that time"},
    {jp:"ごごさんじごろ",rom:"gogo sanji goro",en:"Around 3pm"},
    {jp:"くがつごろ",rom:"kugatsu goro",en:"Around September"},
    {jp:"きょうのごろ",rom:"kyou no koro",en:"Around this time of day"},
    {jp:"このころ",rom:"kono koro",en:"Around this time / these days"},
    {jp:"そのころ",rom:"sono koro",en:"Around that time (in the past)"},
    {jp:"なんじごろ がいいですか？",rom:"Nanji goro ga ii desuka?",en:"Around what time is good for you?",role:"staff"},
    {jp:"ごじごろ がいいです。",rom:"Goji goro ga ii desu.",en:"Around 5 o'clock is good.",role:"you"},
    {jp:"くじごろ に おきます。",rom:"Kuji goro ni okimasu.",en:"I wake up around 9.",role:"you"},
    {jp:"らいねんのはるごろ にほんに いきたいです。",rom:"Rainen no haru goro Nihon ni ikitai desu.",en:"I want to go to Japan around spring next year.",role:"you"}
  ]},
  {title:"Kurai vs Goro - both mean about but different usage",color:"amber",phrases:[
    {jp:"くらい / ぐらい (kurai / gurai)",rom:"kurai / gurai",en:"About / Approximately - used for amounts, quantities, distances, durations",note:"kurai/gurai goes after numbers and amounts"},
    {jp:"ごろ (goro)",rom:"goro",en:"Around - used specifically for approximate TIMES and TIME PERIODS",note:"goro goes after clock times, months, seasons"},
    {jp:"あるいて じゅっぷんくらいです。",rom:"Aruite juppun kurai desu.",en:"It is about 10 minutes walking. (kurai for duration amount)",role:"staff"},
    {jp:"ごじごろ に きてください。",rom:"Goji goro ni kite kudasai.",en:"Please come around 5 o'clock. (goro for clock time)",role:"staff"},
    {jp:"さんにんくらい います。",rom:"San-nin kurai imasu.",en:"There are about 3 people. (kurai for quantity)"},
    {jp:"くがつごろ にほんに いきます。",rom:"Kugatsu goro Nihon ni ikimasu.",en:"I will go to Japan around September. (goro for time period)"}
  ]},
  {title:"Situational dialogue - making plans with specific times",color:"",phrases:[
    {jp:"なんじに あいましょうか？",rom:"Nanji ni aimashou ka?",en:"What time shall we meet?",role:"staff"},
    {jp:"ごじごろ は どうですか？",rom:"Goji goro wa dou desuka?",en:"How about around 5 o'clock?",role:"you"},
    {jp:"いいですね。えきから どのくらいですか？",rom:"Ii desu ne. Eki kara donokurai desuka?",en:"Sounds good. How far is it from the station?",role:"staff"},
    {jp:"あるいて じゅっぷんくらいです。",rom:"Aruite juppun kurai desu.",en:"About 10 minutes on foot.",role:"you"},
    {jp:"しんかんせんで なんじかん かかりますか？",rom:"Shinkansen de nanjikan kakarimasuka?",en:"How many hours does it take by shinkansen?",role:"staff"},
    {jp:"にじかんはん くらいです。",rom:"Nijikan han kurai desu.",en:"About 2 and a half hours.",role:"you"},
    {jp:"わかりました！ごじごろに えきで あいましょう！",rom:"Wakarimashita! Goji goro ni eki de aimashou!",en:"Got it! Let us meet at the station around 5!",role:"staff"}
  ]},
  {title:"Useful time expressions",color:"amber",phrases:[
    {jp:"きょう",rom:"kyou",en:"Today"},
    {jp:"きのう",rom:"kinou",en:"Yesterday"},
    {jp:"あした",rom:"ashita",en:"Tomorrow"},
    {jp:"こんしゅう",rom:"konshu",en:"This week"},
    {jp:"せんしゅう",rom:"senshu",en:"Last week"},
    {jp:"らいしゅう",rom:"raishu",en:"Next week"},
    {jp:"こんげつ",rom:"kongetsu",en:"This month"},
    {jp:"せんげつ",rom:"sengetsu",en:"Last month"},
    {jp:"らいげつ",rom:"raigetsu",en:"Next month"},
    {jp:"ことし",rom:"kotoshi",en:"This year"},
    {jp:"きょねん",rom:"kyonen",en:"Last year"},
    {jp:"らいねん",rom:"rainen",en:"Next year"},
    {jp:"いま",rom:"ima",en:"Now"},
    {jp:"あとで",rom:"ato de",en:"Later"},
    {jp:"はやく",rom:"hayaku",en:"Early Quickly Soon"},
    {jp:"おそく",rom:"osoku",en:"Late Slowly"}
  ]}
]},

{id:"grammar",tab:"Grammar",title:"Grammar and Particles",sub:"Sentence structure, particles, verb forms, and patterns from all your lessons",sections:[
  {title:"Basic sentence order - Subject Object Verb",color:"blue",phrases:[
    {jp:"わたしは すしを たべます。",rom:"Watashi wa sushi wo tabemasu.",en:"I eat sushi. Japanese puts the verb LAST.",note:"Subject - Object - Verb. The biggest difference from English"},
    {jp:"わたしは みずを のみます。",rom:"Watashi wa mizu wo nomimasu.",en:"I drink water.",note:"watashi(I) wa(topic) mizu(water) wo(object) nomimasu(drink)"},
    {jp:"わたしは にほんに いきます。",rom:"Watashi wa Nihon ni ikimasu.",en:"I go to Japan.",note:"ni marks the destination"}
  ]},
  {title:"Particle wa - topic marker",color:"",layout:"grammar",phrases:[
    {jp:"は (wa)",rom:"wa",en:"Topic marker - as for / speaking of",note:"Written as ha but pronounced wa as a particle"},
    {jp:"わたし は ドノバンです。",rom:"Watashi wa Donoban desu.",en:"I am Donovan.",note:"wa marks watashi as the topic"},
    {jp:"ちょうしょく は どこですか？",rom:"Choshoku wa doko desuka?",en:"Where is breakfast?"},
    {jp:"レストラン は なんじからですか？",rom:"Resutoran wa nanji kara desuka?",en:"What time does the restaurant open?"}
  ]},
  {title:"Particle ga - subject marker",color:"",layout:"grammar",phrases:[
    {jp:"が (ga)",rom:"ga",en:"Subject marker - used for emphasis, likes, dislikes, ability"},
    {jp:"スポーツ が すきです。",rom:"Supootsu ga suki desu.",en:"I like sports.",note:"ga used with suki (like) and kirai (dislike)"},
    {jp:"おんがく が すきです。",rom:"Ongaku ga suki desu.",en:"I like music."},
    {jp:"にほんご が すこしわかります。",rom:"Nihongo ga sukoshi wakarimasu.",en:"I understand Japanese a little.",note:"ga used with wakaru (understand) and dekiru (can do)"}
  ]},
  {title:"Particle wo - object marker",color:"",layout:"grammar",phrases:[
    {jp:"を (wo)",rom:"wo",en:"Object marker - marks what the verb is acting on",note:"Written wo, pronounced o"},
    {jp:"ラーメン を たべます。",rom:"Ramen wo tabemasu.",en:"I eat ramen.",note:"wo marks ramen as what is being eaten"},
    {jp:"みず を のみます。",rom:"Mizu wo nomimasu.",en:"I drink water."},
    {jp:"きっぷ を かいたいです。",rom:"Kippu wo kaitai desu.",en:"I want to buy a ticket.",note:"wo from your transport lesson!"},
    {jp:"にもつ を あずけたいです。",rom:"Nimotsu wo azuketai desu.",en:"I want to leave my luggage.",note:"wo from your hotel lesson!"}
  ]},
  {title:"Particle ni - direction location time",color:"",layout:"grammar",phrases:[
    {jp:"に (ni)",rom:"ni",en:"Direction, destination, location, time, or indirect object marker"},
    {jp:"にほん に いきます。",rom:"Nihon ni ikimasu.",en:"I go TO Japan.",note:"ni = to toward direction"},
    {jp:"ろくじ に たべます。",rom:"Rokuji ni tabemasu.",en:"I eat AT 6 oclock.",note:"ni = at specific time"},
    {jp:"レストラン に あります。",rom:"Resutoran ni arimasu.",en:"It is AT the restaurant.",note:"ni = location of existence"},
    {jp:"みぎ に まがってください。",rom:"Migi ni magatte kudasai.",en:"Please turn TO the right.",note:"ni = direction of movement"}
  ]},
  {title:"Particle de - location of action or means",color:"",layout:"grammar",phrases:[
    {jp:"で (de)",rom:"de",en:"Where an action happens, or the means used",note:"Different from ni - de is WHERE you DO something"},
    {jp:"レストラン で たべます。",rom:"Resutoran de tabemasu.",en:"I eat AT the restaurant.",note:"de = place where action happens"},
    {jp:"カード で いいですか？",rom:"Kado de ii desuka?",en:"Can I pay BY card?",note:"de = means instrument"},
    {jp:"バス で いきます。",rom:"Basu de ikimasu.",en:"I go BY bus.",note:"de = means of transport"},
    {jp:"にほんご で はなします。",rom:"Nihongo de hanashimasu.",en:"I speak IN Japanese.",note:"de = language used"}
  ]},
  {title:"Particle no - possession and connection",color:"",layout:"grammar",phrases:[
    {jp:"の (no)",rom:"no",en:"Connects two nouns - possession, belonging, description",note:"Like apostrophe-s in English: A no B = A's B"},
    {jp:"わたし の なまえ は ドノバンです。",rom:"Watashi no namae wa Donoban desu.",en:"My name is Donovan.",note:"watashi no = my"},
    {jp:"ひとつめ の こうさてん",rom:"Hitotsu me no kousaten",en:"The FIRST intersection",note:"no from your directions lesson!"},
    {jp:"つぎ の バス は なんじですか？",rom:"Tsugi no basu wa nanji desuka?",en:"What time is the NEXT bus?",note:"tsugi no = next"}
  ]},
  {title:"Particles kara and made - from and until",color:"",phrases:[
    {jp:"から (kara)",rom:"kara",en:"From Starting from Since Because"},
    {jp:"まで (made)",rom:"made",en:"Until Up to As far as"},
    {jp:"ろくじ から です。",rom:"Rokuji kara desu.",en:"It starts from 6:00.",note:"kara from your hotel lesson!"},
    {jp:"じゅうじ まで です。",rom:"Juuji made desu.",en:"Until 10:00.",note:"made from your hotel lesson!"},
    {jp:"ケンタッキー から きました。",rom:"Kentakkii kara kimashita.",en:"I came FROM Kentucky.",note:"kara = from place of origin"}
  ]},
  {title:"Particle mo - also and too",color:"",layout:"grammar",phrases:[
    {jp:"も (mo)",rom:"mo",en:"Also Too - replaces wa or ga to add inclusion",note:"Swap wa or ga with mo to say me too or also"},
    {jp:"わたし も げんきです。",rom:"Watashi mo genki desu.",en:"I am well TOO.",note:"mo replaces wa from your greetings lesson!"},
    {jp:"おんがく も すきです。",rom:"Ongaku mo suki desu.",en:"I also like music.",role:"you"},
    {jp:"これ も ください。",rom:"Kore mo kudasai.",en:"Please give me this one TOO.",role:"you"}
  ]},
  {title:"Verb endings - masu form polite",color:"purple",layout:"grammar",phrases:[
    {jp:"～ます",rom:"~masu",en:"Polite present future tense - use this in daily life"},
    {jp:"たべます",rom:"tabemasu",en:"eat will eat"},
    {jp:"のみます",rom:"nomimasu",en:"drink will drink"},
    {jp:"いきます",rom:"ikimasu",en:"go will go"},
    {jp:"かいます",rom:"kaimasu",en:"buy will buy"},
    {jp:"わかります",rom:"wakarimasu",en:"understand"},
    {jp:"あります",rom:"arimasu",en:"there is have for things"},
    {jp:"います",rom:"imasu",en:"there is am for people and animals"}
  ]},
  {title:"Negative form - masen",color:"purple",layout:"grammar",phrases:[
    {jp:"～ません",rom:"~masen",en:"Polite negative - do not. Change masu to masen"},
    {jp:"わかりません。",rom:"Wakarimasen.",en:"I do not understand.",note:"Very useful! Say this when lost in conversation"},
    {jp:"にほんごが わかりません。",rom:"Nihongo ga wakarimasen.",en:"I do not understand Japanese.",role:"you"},
    {jp:"えいごが わかりますか？",rom:"Eigo ga wakarimasu ka?",en:"Do you understand English?",role:"you"}
  ]},
  {title:"Past tense - mashita",color:"purple",layout:"grammar",phrases:[
    {jp:"～ました",rom:"~mashita",en:"Polite past tense - did. Change masu to mashita"},
    {jp:"たべました。",rom:"Tabemashita.",en:"I ate."},
    {jp:"いきました。",rom:"Ikimashita.",en:"I went."},
    {jp:"ケンタッキーから きました。",rom:"Kentakkii kara kimashita.",en:"I came from Kentucky.",note:"kimashita from your intro lesson!"},
    {jp:"みちに まよいました。",rom:"Michi ni mayoimashita.",en:"I got lost.",note:"mayoimashita from your directions lesson!"}
  ]},
  {title:"Want to - tai form",color:"purple",phrases:[
    {jp:"～たいです",rom:"~tai desu",en:"I want to ___. Drop masu and add tai",note:"From your transportation lesson!"},
    {jp:"かいます→かいたいです",rom:"kaimasu - kaitai desu",en:"buy - want to buy"},
    {jp:"たべます→たべたいです",rom:"tabemasu - tabetai desu",en:"eat - want to eat"},
    {jp:"のみます→のみたいです",rom:"nomimasu - nomitai desu",en:"drink - want to drink"},
    {jp:"いきます→いきたいです",rom:"ikimasu - ikitai desu",en:"go - want to go"}
  ]},
  {title:"Te-form groups - overview",color:"purple",layout:"grammar",phrases:[
    {jp:"て形 (te-kei)",rom:"te-kei",en:"The te-form connects verbs to almost everything - requests, permission, sequences.",note:"Every verb belongs to one of 3 groups, and each group conjugates differently. Learn the group, learn the pattern."},
    {jp:"1グループ - い・ち・り・び・み・に・き・ぎ・し",rom:"Group 1 - u-verbs",en:"Group 1 (u-verbs): the sound the verb ends in decides the te-form ending.",note:"Mnemonic: Group 1 is the 'sound sorter' - listen to the last sound before masu and pick the matching rule below."},
    {jp:"2グループ - e-ます",rom:"Group 2 - ru-verbs",en:"Group 2 (ru-verbs): just drop masu and add te. No sound rules needed.",note:"Mnemonic: Group 2 is the 'lazy group' - always the same simple swap."},
    {jp:"3グループ - します・きます",rom:"Group 3 - irregular",en:"Group 3 (irregular): only two verbs in the whole language - suru and kuru.",note:"Mnemonic: Only 2 verbs total - just memorize します→して and きます→きて cold."}
  ]},
  {title:"Group 1: い・ち・り → って",color:"purple",phrases:[
    {jp:"かいます→かって",rom:"kaimasu - katte",en:"buy - buying / having bought",note:"Mnemonic: い・ち・り all 'trip' and land as って - three different sounds, one identical landing."},
    {jp:"もちます→もって",rom:"mochimasu - motte",en:"hold / carry - holding"},
    {jp:"かえります→かえって",rom:"kaerimasu - kaette",en:"return / go home - returning"}
  ]},
  {title:"Group 1: び・み・に → んで",color:"purple",phrases:[
    {jp:"よびます→よんで",rom:"yobimasu - yonde",en:"call out - calling",note:"Mnemonic: び・み・に are all 'nose sounds' (b/m/n use your nose or lips) - they nasalize into ん, then add で."},
    {jp:"のみます→のんで",rom:"nomimasu - nonde",en:"drink - drinking"}
  ]},
  {title:"Group 1: き → いて",color:"purple",phrases:[
    {jp:"かきます→かいて",rom:"kakimasu - kaite",en:"write - writing",note:"Mnemonic: き softens into いて - the hard 'k' click smooths out."}
  ]},
  {title:"Group 1: ぎ → いで",color:"purple",phrases:[
    {jp:"いそぎます→いそいで",rom:"isogimasu - isoide",en:"hurry - hurrying",note:"Mnemonic: ぎ is just き with a voiced dakuten (＂) - so its te-form is いで instead of いて, same pattern, voiced version."}
  ]},
  {title:"Group 1: し → して",color:"purple",phrases:[
    {jp:"はなします→はなして",rom:"hanashimasu - hanashite",en:"speak / talk - speaking",note:"Mnemonic: the easiest rule - し just becomes して, no twisting needed."}
  ]},
  {title:"Group 1: the one exception",color:"purple",phrases:[
    {jp:"いきます→いって",rom:"ikimasu - itte",en:"go - going",note:"Mnemonic: 行く (iku) SHOULD follow the き→いて rule but breaks it and copies the い・ち・り→って pattern instead. It's the one verb every learner mixes up - drill it separately."}
  ]},
  {title:"Group 2 (る-verbs, e-masu): drop masu, add te",color:"purple",phrases:[
    {jp:"ねます→ねて",rom:"nemasu - nete",en:"sleep - sleeping",note:"Mnemonic: no sound rules for Group 2 - just chop masu and glue on te. Every time."},
    {jp:"たべます→たべて",rom:"tabemasu - tabete",en:"eat - eating"},
    {jp:"みます→みて",rom:"mimasu - mite",en:"see / look - seeing"},
    {jp:"おきます、かります、います など",rom:"okimasu, karimasu, imasu, etc.",en:"wake up, borrow, exist/be - these END in i+masu but are secretly Group 2!",note:"Mnemonic: these LOOK like Group 1 (i-sound before masu) but conjugate like Group 2 instead - おきて, かりて, いて. There's no shortcut, just memorize this short list of imposters."}
  ]},
  {title:"Group 3 (irregular): only 2 verbs to memorize",color:"purple",phrases:[
    {jp:"します→して",rom:"shimasu - shite",en:"do - doing",note:"Mnemonic: する is used in tons of compound verbs (べんきょうする, かいものする) - nail this one and you unlock dozens of others."},
    {jp:"きます→きて",rom:"kimasu - kite",en:"come - coming",note:"Mnemonic: 来ます(kuru, to come) is irregular - don't confuse it with 聞きます(kikimasu, to listen) which is a normal Group 1 き→いて verb!"}
  ]},
  {title:"Te-form - please do",color:"purple",phrases:[
    {jp:"～てください",rom:"~te kudasai",en:"Please ___. Polite request using te-form",note:"From your directions lesson!"},
    {jp:"いきます→いって→まっすぐ いってください。",rom:"ikimasu - itte - massugu itte kudasai",en:"go - going - Please go straight."},
    {jp:"まがります→まがって→みぎに まがってください。",rom:"magarimasu - magatte - migi ni magatte kudasai",en:"turn - turning - Please turn right."},
    {jp:"みせます→みせて→パスポートを みせてください。",rom:"misemasu - misete - pasupoto wo misete kudasai",en:"show - showing - Please show me your passport."}
  ]},
  {title:"A wa B desu pattern - A is B",color:"",layout:"grammar",phrases:[
    {jp:"A は B です。",rom:"A wa B desu.",en:"A is B. The most fundamental Japanese sentence",note:"desu = am is are polite"},
    {jp:"わたしは ドノバンです。",rom:"Watashi wa Donoban desu.",en:"I am Donovan."},
    {jp:"これは なんですか？",rom:"Kore wa nan desuka?",en:"What is this?",note:"kore = this nan = what"},
    {jp:"ふたりです。",rom:"Futari desu.",en:"Two people.",note:"Short form - drop watashitachi wa in casual speech"}
  ]},
  {title:"Question words",color:"blue",phrases:[
    {jp:"なに / なん",rom:"nani / nan",en:"What?",note:"nan before desu de no, nani before wo ga"},
    {jp:"どこ",rom:"doko",en:"Where?"},
    {jp:"だれ",rom:"dare",en:"Who?"},

    {jp:"どう",rom:"dou",en:"How? In what way?"},

  {title:"Possession - no and mine yours theirs",color:"blue",phrases:[
    {jp:"わたしの",rom:"watashi no",en:"My / Mine"},
    {jp:"あなたの",rom:"anata no",en:"Your / Yours"},
    {jp:"かれの",rom:"kare no",en:"His"},
    {jp:"かのじょの",rom:"kanojo no",en:"Her / Hers"},
    {jp:"わたしたちの",rom:"watashitachi no",en:"Our / Ours"},
    {jp:"かれらの",rom:"karera no",en:"Their / Theirs"},
    {jp:"わたしの かばんです。",rom:"Watashi no kaban desu.",en:"It is my bag.",note:"watashi no + noun = my noun"},
    {jp:"あなたの なまえは なんですか？",rom:"Anata no namae wa nan desuka?",en:"What is your name?",role:"you"},
    {jp:"これは だれの ですか？",rom:"Kore wa dare no desuka?",en:"Whose is this?",role:"you"},
    {jp:"わたしのです。",rom:"Watashi no desu.",en:"It is mine.",note:"Drop the noun after no - very natural in conversation",role:"you"},
    {jp:"あなたのですか？",rom:"Anata no desuka?",en:"Is it yours?",role:"you"}
  ]},
  {title:"KO-SO-A-DO: demonstratives at a glance",color:"blue",layout:"kosoado",kosoado:{
    columns:[
      {key:"ko",label:"KO",kana:"こ"},
      {key:"so",label:"SO",kana:"そ"},
      {key:"a",label:"A",kana:"あ"},
      {key:"do",label:"DO",kana:"ど"}
    ],
    rows:[
      {label:"Thing",sub:"物 (mono)",cells:{
        ko:{jp:"これ",rom:"kore",en:"this"},
        so:{jp:"それ",rom:"sore",en:"that"},
        a:{jp:"あれ",rom:"are",en:"that over there"},
        do:{jp:"どれ",rom:"dore",en:"which"}
      }},
      {label:"+ Noun",sub:"〜の (modifying)",cells:{
        ko:{jp:"この",rom:"kono",en:"this + noun"},
        so:{jp:"その",rom:"sono",en:"that + noun"},
        a:{jp:"あの",rom:"ano",en:"that + noun, over there"},
        do:{jp:"どの",rom:"dono",en:"which + noun"}
      }},
      {label:"Place",sub:"場所 (basho)",cells:{
        ko:{jp:"ここ",rom:"koko",en:"here"},
        so:{jp:"そこ",rom:"soko",en:"there"},
        a:{jp:"あそこ",rom:"asoko",en:"over there"},
        do:{jp:"どこ",rom:"doko",en:"where"}
      }},
      {label:"Direction / Polite",sub:"丁寧 (teinei)",cells:{
        ko:{jp:"こちら",rom:"kochira",en:"here / this way"},
        so:{jp:"そちら",rom:"sochira",en:"there / that way"},
        a:{jp:"あちら",rom:"achira",en:"over there / that way"},
        do:{jp:"どちら",rom:"dochira",en:"where / which way"}
      }}
    ]
  }},
  {title:"Demonstratives - kono sono ano",color:"blue",phrases:[
    {jp:"この〜",rom:"kono ~",en:"This ___ (near me)",note:"kono + noun = this thing close to the speaker"},
    {jp:"その〜",rom:"sono ~",en:"That ___ (near you)",note:"sono + noun = that thing close to the listener"},
    {jp:"あの〜",rom:"ano ~",en:"That ___ over there",note:"ano + noun = that thing far from both of us"},
    {jp:"どの〜",rom:"dono ~",en:"Which ___?",note:"dono + noun = which one?"},
    {jp:"このシャツは いくらですか？",rom:"Kono shatsu wa ikura desuka?",en:"How much is THIS shirt?",role:"you"},
    {jp:"そのかばんは だれのですか？",rom:"Sono kaban wa dare no desuka?",en:"Whose is THAT bag?",role:"you"},
    {jp:"あのレストランは おいしいですよ。",rom:"Ano resutoran wa oishii desu yo.",en:"THAT restaurant over there is delicious!",role:"staff"},
    {jp:"どのサイズが いいですか？",rom:"Dono saizu ga ii desuka?",en:"Which size is good?",role:"staff"}
  ]},
  {title:"Standalone demonstratives - kore sore are",color:"blue",phrases:[
    {jp:"これ",rom:"kore",en:"This one (near me) - stands alone, no noun needed"},
    {jp:"それ",rom:"sore",en:"That one (near you) - stands alone"},
    {jp:"あれ",rom:"are",en:"That one over there - stands alone"},
    {jp:"どれ",rom:"dore",en:"Which one? - stands alone"},
    {jp:"これを ください。",rom:"Kore wo kudasai.",en:"I will take this one.",note:"kore = this one - no noun needed",role:"you"},
    {jp:"それは なんですか？",rom:"Sore wa nan desuka?",en:"What is that (near you)?",role:"you"},
    {jp:"あれが すきです。",rom:"Are ga suki desu.",en:"I like that one over there.",role:"you"},
    {jp:"どれが いいですか？",rom:"Dore ga ii desuka?",en:"Which one is good?",role:"staff"}
  ]},
  {title:"Negatives - janai and de wa arimasen",color:"purple",phrases:[
    {jp:"じゃない",rom:"janai",en:"Is not / Not ___ (casual negative)",note:"Casual speech - drop desu and use janai"},
    {jp:"じゃないです",rom:"janai desu",en:"Is not / Not ___ (polite casual)",note:"Slightly polite version of janai"},
    {jp:"では ありません",rom:"de wa arimasen",en:"Is not / Not ___ (formal negative)",note:"The most formal and correct negative form"},
    {jp:"じゃ ありません",rom:"ja arimasen",en:"Is not / Not ___ (polite spoken)",note:"Common spoken version - shortened from de wa"},
    {jp:"これは わたしのじゃないです。",rom:"Kore wa watashi no janai desu.",en:"This is not mine. (casual polite)",role:"you"},
    {jp:"これは わたしのでは ありません。",rom:"Kore wa watashi no de wa arimasen.",en:"This is not mine. (formal)",role:"you"},
    {jp:"にほんじんじゃないです。アメリカじんです。",rom:"Nihonjin janai desu. Amerikajin desu.",en:"I am not Japanese. I am American.",role:"you"},
    {jp:"たかくないです。",rom:"Takakunai desu.",en:"It is not expensive.",note:"For adjectives: drop i and add kunai",role:"you"},
    {jp:"すきじゃないです。",rom:"Suki janai desu.",en:"I do not like it.",role:"you"},
    {jp:"これは ほんものじゃ ありません。",rom:"Kore wa honmono ja arimasen.",en:"This is not the real thing.",role:"you"}
  ]},
  {title:"Negative adjectives - i-adjective pattern",color:"purple",phrases:[
    {jp:"たかい → たかくない",rom:"takai - takakunai",en:"expensive - not expensive",note:"i-adjectives: drop the i and add kunai"},
    {jp:"やすい → やすくない",rom:"yasui - yasukunai",en:"cheap - not cheap"},
    {jp:"おいしい → おいしくない",rom:"oishii - oishikunai",en:"delicious - not delicious"},
    {jp:"おおきい → おおきくない",rom:"ookii - ookikunai",en:"big - not big"},
    {jp:"ちいさい → ちいさくない",rom:"chiisai - chiisakunai",en:"small - not small"},
    {jp:"さむい → さむくない",rom:"samui - samukunai",en:"cold - not cold"},
    {jp:"あつい → あつくない",rom:"atsui - atsukunai",en:"hot - not hot"},
    {jp:"このサイズは おおきくないです。",rom:"Kono saizu wa ookikunai desu.",en:"This size is not big enough.",role:"you"},
    {jp:"たかくないですか？",rom:"Takakunai desuka?",en:"Is it not expensive? Is it cheap?",role:"you"}
  ]},
  {title:"Situational dialogue - Using demonstratives and negatives",color:"",phrases:[
    {jp:"すみません。このシャツは いくらですか？",rom:"Sumimasen. Kono shatsu wa ikura desuka?",en:"Excuse me. How much is this shirt?",role:"you"},
    {jp:"それは ３５００えんです。",rom:"Sore wa sanzen gohyaku-en desu.",en:"That one is 3500 yen.",role:"staff"},
    {jp:"たかいですね。あのシャツは？",rom:"Takai desu ne. Ano shatsu wa?",en:"That is expensive. What about that shirt over there?",role:"you"},
    {jp:"あれは ２０００えんです。",rom:"Are wa nisen-en desu.",en:"That one over there is 2000 yen.",role:"staff"},
    {jp:"Mサイズは ありますか？Sサイズじゃ ないですか？",rom:"M saizu wa arimasu ka? S saizu ja nai desuka?",en:"Do you have a medium? Do you not have a small?",role:"you"},
    {jp:"Sサイズは ありません。MとLだけです。",rom:"S saizu wa arimasen. M to L dake desu.",en:"We do not have small. Only medium and large.",role:"staff"},
    {jp:"わかりました。これは わたしのじゃ ないですか？",rom:"Wakarimashita. Kore wa watashi no ja nai desuka?",en:"I see. Is this one not mine? (checking the size tag)",role:"you"},
    {jp:"このMサイズに します。おねがいします。",rom:"Kono M saizu ni shimasu. Onegaishimasu.",en:"I will go with this medium. Please.",role:"you"}
  ]}
]},
{id:"numbers",tab:"Numbers",title:"Numbers",sub:"Prices, times, floors, ordering quantities, and counting people",sections:[

    {jp:"じゅう",rom:"juu",en:"10"}

  {title:"Bigger numbers",color:"blue",grid:true,phrases:[

  {title:"Counting items for ordering food",color:"",grid:true,phrases:[

    {jp:"よっつ",rom:"yottsu",en:"4 items"},
    {jp:"いつつ",rom:"itsutsu",en:"5 items"}
  ]},
  {title:"Counting PEOPLE - nin",color:"blue",grid:true,phrases:[
    {jp:"ひとり",rom:"hitori",en:"1 person",note:"Mnemonic: hitori = hito(person) + ri. It is NOT ichinin - the counter just fuses with the word for person."},
    {jp:"ふたり",rom:"futari",en:"2 people",note:"Mnemonic: futari = futa(two, as in futatsu) + ri, matching hitori's pattern. Use this at every restaurant."},
    {jp:"さんにん",rom:"san-nin",en:"3 people"},
    {jp:"よにん",rom:"yo-nin",en:"4 people",note:"Use yo not shi - shinin means something else!"},
    {jp:"ごにん",rom:"go-nin",en:"5 people"},
    {jp:"ろくにん",rom:"roku-nin",en:"6 people"},
    {jp:"しちにん / ななにん",rom:"shichi-nin / nana-nin",en:"7 people"},
    {jp:"はちにん",rom:"hachi-nin",en:"8 people"},
    {jp:"きゅうにん",rom:"kyuu-nin",en:"9 people"},
    {jp:"じゅうにん",rom:"juu-nin",en:"10 people"},
    {jp:"なんにん",rom:"nan-nin",en:"How many people?",note:"Staff will ask you this at restaurants!"}
  ]},
  {title:"Counting people in sentences",color:"",phrases:[
    {jp:"ひとりです。",rom:"Hitori desu.",en:"One person. Just me.",role:"you"},
    {jp:"ふたりです。",rom:"Futari desu.",en:"Two people please.",note:"The phrase from your restaurant lesson!",role:"you"},
    {jp:"さんにんです。",rom:"San-nin desu.",en:"Three people.",role:"you"},
    {jp:"よにんです。",rom:"Yo-nin desu.",en:"Four people.",role:"you"},
    {jp:"おとな ふたりと こども ひとりです。",rom:"Otona futari to kodomo hitori desu.",en:"Two adults and one child.",note:"otona = adult kodomo = child to = and",role:"you"},
    {jp:"おとな ひとり おねがいします。",rom:"Otona hitori onegaishimasu.",en:"One adult please. For example buying a ticket",role:"you"},
    {jp:"なんめいさまですか？",rom:"Nanmeisama desuka?",en:"How many people in your party?",note:"Formal restaurant greeting!",role:"staff"}
  ]},
  {title:"The two irregular counters - must memorize!",color:"amber",phrases:[
    {jp:"ひとり (1人)",rom:"hitori",en:"1 person - completely unique word NOT ichinichi"},
    {jp:"ふたり (2人)",rom:"futari",en:"2 people - completely unique word NOT ninin"},
    {jp:"さんにん (3人)",rom:"san-nin",en:"3 people and above follow the regular nin pattern"},
    {jp:"よにん (4人)",rom:"yo-nin",en:"4 people - always use yo never shi"}
  ]},
  {title:"Asking the price",color:"amber",phrases:[
    {jp:"すみません。いくらですか？",rom:"Sumimasen. Ikura desuka?",en:"Excuse me, how much is it?",role:"you"},
    {jp:"〇〇えんです。",rom:"... en desu.",en:"It is ___ yen.",note:"Listen for the number!",role:"staff"}
  ]}
]},
{id:"greetings",tab:"Greetings",title:"Everyday Greetings",sub:"Essential greetings, expressions, and meal phrases",sections:[
  {title:"Daily greetings",color:"",phrases:[
    {jp:"おはようございます",rom:"Ohayou gozaimasu",en:"Good morning",note:"Use before about 10am"},
    {jp:"こんにちは",rom:"Konnichiwa",en:"Hello / Good afternoon"},
    {jp:"こんばんは",rom:"Konbanwa",en:"Good evening"},
    {jp:"げんきですか？",rom:"Genki desuka?",en:"How are you?"},
    {jp:"げんきです！",rom:"Genki desu!",en:"I am good! I am well!"},
    {jp:"ありがとうございます",rom:"Arigatou gozaimasu",en:"Thank you very much"},
    {jp:"すみません",rom:"Sumimasen",en:"Excuse me Sorry - very versatile!"},
    {jp:"おねがいします",rom:"Onegaishimasu",en:"Please / I would like this"},
    {jp:"じゃあね / またね",rom:"Jaa ne / Mata ne",en:"See you Bye casual"},
    {jp:"おやすみなさい",rom:"Oyasuminasai",en:"Good night"}
  ]},
  {title:"Meal expressions",color:"amber",phrases:[
    {jp:"いただきます",rom:"Itadakimasu",en:"Thank you for the meal said before eating",note:"Say before every meal!"},
    {jp:"ごちそうさまでした",rom:"Gochisousamadeshita",en:"Thank you for the meal said after eating",note:"Say when you finish - staff will appreciate it!"}
  ]},
  {title:"Situational dialogue - Meeting someone",color:"",phrases:[
    {jp:"おはようございます！げんきですか？",rom:"Ohayou gozaimasu! Genki desuka?",en:"Good morning! How are you?",role:"you"},
    {jp:"げんきです！ドノバンさんは？",rom:"Genki desu! Donoban-san wa?",en:"I am well! How about you Donovan?",role:"staff"},
    {jp:"わたしも げんきです。ありがとうございます！",rom:"Watashi mo genki desu. Arigatou gozaimasu!",en:"I am well too. Thank you!",role:"you"}
  ]}
]},
{id:"intro",tab:"Introduction",title:"Self Introduction",sub:"Build and practice your full introduction",sections:[
  {title:"Introduction building blocks",color:"",phrases:[
    {jp:"わたしは〇〇です。",rom:"Watashi wa [name] desu.",en:"I am [name].",note:"Replace the circle with your name"},
    {jp:"アメリカじんです。",rom:"Amerikajin desu.",en:"I am American.",note:"country + jin = nationality"},
    {jp:"ケンタッキーからきました。",rom:"Kentakkii kara kimashita.",en:"I am from Kentucky.",note:"kara = from, kimashita = came"},
    {jp:"スポーツが すきです。",rom:"Supootsu ga suki desu.",en:"I like sports."},
    {jp:"おんがくが すきです。",rom:"Ongaku ga suki desu.",en:"I like music."},
    {jp:"ビデオゲームが すきです。",rom:"Bideo geemu ga suki desu.",en:"I like video games."},
    {jp:"よろしくおねがいします。",rom:"Yoroshiku onegaishimasu.",en:"Nice to meet you! Please take care of me.",note:"Always end introductions with this"}
  ]},
  {title:"Full introduction - play and repeat!",color:"purple",phrases:[
    {jp:"わたしは ドノバン です。アメリカじんです。ケンタッキーから きました。スポーツと おんがくと ビデオゲームが すきです。よろしく おねがいします！",rom:"Watashi wa Donoban desu. Amerikajin desu. Kentakkii kara kimashita. Supootsu to ongaku to bideo geemu ga suki desu. Yoroshiku onegaishimasu!",en:"I am Donovan. I am American. I am from Kentucky. I like sports, music, and video games. Nice to meet you!",note:"Play it then say it back from memory!"}
  ]},
  {title:"Situational dialogue - Meeting a local",color:"",phrases:[
    {jp:"はじめまして。わたしは ドノバン です。",rom:"Hajimemashite. Watashi wa Donoban desu.",en:"Nice to meet you. I am Donovan.",role:"you"},
    {jp:"はじめまして！どこから きましたか？",rom:"Hajimemashite! Doko kara kimashita ka?",en:"Nice to meet you! Where are you from?",role:"staff"},
    {jp:"アメリカの ケンタッキーから きました。",rom:"Amerika no Kentakkii kara kimashita.",en:"I am from Kentucky, America.",role:"you"},
    {jp:"わあ、すごい！にほんは はじめてですか？",rom:"Waa, sugoi! Nihon wa hajimete desuka?",en:"Wow, amazing! Is this your first time in Japan?",role:"staff"},
    {jp:"はい、はじめてです！たのしみにしています！",rom:"Hai, hajimete desu! Tanoshimi ni shite imasu!",en:"Yes, first time! I am really looking forward to it!",role:"you"}
  ]}
]},

{id:"n5grammar",tab:"N5 Grammar+",title:"N5 Grammar+",sub:"Everything N5 needs beyond your core grammar tab. Each point: pattern, examples, and a memory trick.",sections:[
  INFO("How to study this tab","amber",[
    IC("green","The 4-step loop","1) Read the pattern badge. 2) Tap each example to hear it. 3) Say it aloud, then swap one word. 4) Star the ones that trip you up - they become flashcards at the bottom of this tab."),
    IC("amber","Pair it with the core Grammar tab","Particles wa, ga, wo, ni, de, no, mo, kara, made, te-form, tai, and demonstratives live in the Grammar tab. This tab adds the rest of the N5 list.")
  ]),
  G("と - and / with","",[
    P("A と B","A to B","A and B (a complete list) / together with a person","Mnemonic: と = 'tied together' - the whole list is tied up, nothing else exists."),
    P("パンと たまごを たべます。","Pan to tamago wo tabemasu.","I eat bread and eggs."),
    P("ともだちと えいがを みます。","Tomodachi to eiga wo mimasu.","I watch a movie with a friend.","to = with (a person)"),
    P("やまださんと はなしました。","Yamada-san to hanashimashita.","I talked with Mr. Yamada.")
  ]),
  G("や - and (partial list)","",[
    P("A や B (など)","A ya B (nado)","A and B, among other things","Mnemonic: や = 'and stuff like'. と is the full list, や is 'for example'."),
    P("りんごや バナナを かいました。","Ringo ya banana wo kaimashita.","I bought apples, bananas, and so on."),
    P("つくえの うえに ほんや ノートが あります。","Tsukue no ue ni hon ya nooto ga arimasu.","On the desk there are books, notebooks, etc."),
    P("すしや ラーメンが すきです。","Sushi ya raamen ga suki desu.","I like things like sushi and ramen.")
  ]),
  G("か - question / or","",[
    P("～か。 / A か B","~ka. / A ka B","Question marker / A or B","Mnemonic: か = a spoken question mark."),
    P("コーヒーですか、おちゃですか。","Koohii desu ka, ocha desu ka.","Is it coffee or tea?"),
    P("バスか でんしゃで いきます。","Basu ka densha de ikimasu.","I will go by bus or train."),
    P("これは あなたのですか。","Kore wa anata no desu ka.","Is this yours?")
  ]),
  G("ね / よ - sentence-ending particles","",[
    P("～ね / ～よ","~ne / ~yo","ne = 'right?' (seeking agreement). yo = 'I'm telling you' (new info)","Mnemonic: ne = 'nod' (you nod back). yo = 'yo, listen!'"),
    P("いい てんきですね。","Ii tenki desu ne.","Nice weather, isn't it?"),
    P("あの みせは おいしいですよ。","Ano mise wa oishii desu yo.","That shop is delicious, I'm telling you!"),
    P("あしたは やすみですよね。","Ashita wa yasumi desu yo ne.","Tomorrow is a day off, right?","yo + ne = 'I think so, confirm?'")
  ]),
  G("へ - direction","",[
    P("Place へ いきます","Place e ikimasu","Go toward a place (written he, read e)","Mnemonic: へ looks like an arrow tip pointing to where you head. At N5 it is interchangeable with ni for go/come/return."),
    P("がっこうへ いきます。","Gakkou e ikimasu.","I go to school."),
    P("うちへ かえります。","Uchi e kaerimasu.","I go home."),
    P("にほんへ きました。","Nihon e kimashita.","I came to Japan.")
  ]),
  G("あります / います - existence","blue",[
    P("Place に Thing が あります / Person が います","Place ni Thing ga arimasu / Person ga imasu","There is a ___ at ___. arimasu = things, imasu = people and animals","Mnemonic: arimasu = 'A' for Artifact (not alive). imasu = 'I' for 'I breathe' (alive). Plants count as arimasu."),
    P("つくえの うえに ほんが あります。","Tsukue no ue ni hon ga arimasu.","There is a book on the desk."),
    P("へやに ねこが います。","Heya ni neko ga imasu.","There is a cat in the room."),
    P("トイレは どこに ありますか。","Toire wa doko ni arimasu ka.","Where is the restroom?"),
    P("この ちかくに コンビニが ありますか。","Kono chikaku ni konbini ga arimasu ka.","Is there a convenience store near here?"),
    P("おかねが ありません。","Okane ga arimasen.","I have no money.","negative of arimasu = arimasen")
  ]),
  G("Position words","blue",[
    P("A の + position + に あります/います","A no + position + ni arimasu/imasu","Position words: ue (on), shita (under), mae (front), ushiro (behind), naka (inside), tonari (next to), chikaku (near)","Mnemonic: the thing you locate comes FIRST, then no, then the position word - like 'the table's top'."),
    P("テーブルの うえに ほんが あります。","Teeburu no ue ni hon ga arimasu.","There is a book on the table."),
    P("ベッドの したに ねこが います。","Beddo no shita ni neko ga imasu.","There is a cat under the bed."),
    P("ぎんこうは えきの まえに あります。","Ginkou wa eki no mae ni arimasu.","The bank is in front of the station."),
    P("ホテルの となりに コンビニが あります。","Hoteru no tonari ni konbini ga arimasu.","There is a convenience store next to the hotel."),
    P("かばんの なかに さいふが あります。","Kaban no naka ni saifu ga arimasu.","My wallet is in my bag.")
  ]),
  S("い-adjectives: 4 forms","purple",[
    P("おおきい→おおきくない→おおきかった→おおきくなかった","ookii - ookikunai - ookikatta - ookikunakatta","big - not big - was big - wasn't big","Mnemonic: change the final い: くない (not) / かった (was) / くなかった (wasn't). Add です to be polite."),
    P("たかい→たかくない→たかかった→たかくなかった","takai - takakunai - takakatta - takakunakatta","expensive - not expensive - was expensive - wasn't expensive"),
    P("おもしろい→おもしろくない→おもしろかった→おもしろくなかった","omoshiroi - omoshirokunai - omoshirokatta - omoshirokunakatta","interesting - not - was - wasn't"),
    P("いい→よくない→よかった→よくなかった","ii - yokunai - yokatta - yokunakatta","good - not good - was good - wasn't good","Exception! いい is secretly よい, so it changes to よ- everywhere except the plain present form."),
    P("この ラーメンは おいしいです。","Kono raamen wa oishii desu.","This ramen is delicious."),
    P("あの ホテルは たかくないです。","Ano hoteru wa takakunai desu.","That hotel is not expensive."),
    P("きのうは あつかったです。","Kinou wa atsukatta desu.","Yesterday was hot."),
    P("テストは むずかしくなかったです。","Tesuto wa muzukashikunakatta desu.","The test wasn't difficult."),
    P("おおきい いぬ","ookii inu","a big dog","i-adjectives go straight before the noun - no extra particle.")
  ]),
  S("な-adjectives: 4 forms","purple",[
    P("すき→すきじゃない→すきでした→すきじゃなかった","suki - suki janai - suki deshita - suki janakatta","like - don't like - liked - didn't like","Mnemonic: na-adjectives behave like NOUNS. Present です, past でした, negative じゃありません. They only borrow な when they sit before a noun."),
    P("しずかです。","Shizuka desu.","It is quiet."),
    P("ここは にぎやかじゃ ありません。","Koko wa nigiyaka ja arimasen.","It is not lively here."),
    P("きのうは ひまでした。","Kinou wa hima deshita.","I was free yesterday."),
    P("きれいな ひと","kirei na hito","a beautiful person","before a noun: na-adjective + な + noun"),
    P("しずかな まち","shizuka na machi","a quiet town"),
    P("ゆうめいな レストラン","yuumei na resutoran","a famous restaurant"),
    P("きれい・ゆうめい・きらい","kirei / yuumei / kirai","IMPOSTERS: they end in -i sound but are na-adjectives!","Memorize these three: they are the classic JLPT trap.")
  ]),
  G("～ませんか / ～ましょう / ～ましょうか","",[
    P("Verb stem + ませんか / ましょう","Verb stem + masen ka / mashou","Won't you ___? (invite) / Let's ___!","Mnemonic: masen ka = 'a gentle question' (negative = polite). mashou = 'let us go!' (decision)."),
    P("いっしょに ごはんを たべませんか。","Issho ni gohan wo tabemasen ka.","Won't you eat a meal with me?"),
    P("はい、たべましょう！","Hai, tabemashou!","Yes, let's eat!"),
    P("にもつを もちましょうか。","Nimotsu wo mochimashou ka.","Shall I carry your luggage?","mashou ka = offering to do something for someone"),
    P("すみません、ちょっと…","Sumimasen, chotto...","Sorry, that's a bit... (soft no)")
  ]),
  G("～ている - doing right now / state","purple",[
    P("Verb て-form + います","Verb te + imasu","is ___ing / ongoing state","Mnemonic: te + imasu = 'being in the middle of it'. Also states: sunde imasu = 'I live (am living)'."),
    P("いま ごはんを たべています。","Ima gohan wo tabete imasu.","I am eating right now."),
    P("なにを していますか。","Nani wo shite imasu ka.","What are you doing?"),
    P("にほんごを べんきょうしています。","Nihongo wo benkyou shite imasu.","I am studying Japanese."),
    P("とうきょうに すんでいます。","Toukyou ni sunde imasu.","I live in Tokyo.","sumu = live. State, not action in progress")
  ]),
  G("～てもいいです - permission","purple",[
    P("Verb て-form + も いいですか","Verb te + mo ii desu ka","May I ___?","Mnemonic: 'te mo ii?' = 'even if I do it, is it okay?'"),
    P("しゃしんを とっても いいですか。","Shashin wo totte mo ii desu ka.","May I take a photo?"),
    P("ここに すわっても いいですか。","Koko ni suwatte mo ii desu ka.","May I sit here?"),
    P("はい、どうぞ。/ すみません、ちょっと…","Hai, douzo. / Sumimasen, chotto...","Yes, go ahead. / Sorry, that's a bit... (polite no)")
  ]),
  G("～てはいけません - prohibition","red",[
    P("Verb て-form + は いけません","Verb te + wa ikemasen","You must not ___","Mnemonic: 'te wa ikemasen' = 'if you do it, it won't go well'."),
    P("ここで たばこを すっては いけません。","Koko de tabako wo sutte wa ikemasen.","You must not smoke here."),
    P("ここに はいっては いけません。","Koko ni haitte wa ikemasen.","You must not enter here."),
    P("しゃしんを とっては いけません。","Shashin wo totte wa ikemasen.","You must not take photos.")
  ]),
  S("Dictionary form (jisho-kei)","purple",[
    P("Dictionary form","","The plain, untouched verb you look up in a dictionary. Group 2 drops ます and adds る. Group 1 changes the i-sound before ます to the u-sound. Group 3 is memorized.","Mnemonic: Group 1 'i → u' (kakimasu → kaku). Group 2 'masu → ru' (tabemasu → taberu)."),
    P("たべます→たべる","tabemasu - taberu","eat (Group 2)"),
    P("みます→みる","mimasu - miru","see (Group 2)"),
    P("かきます→かく","kakimasu - kaku","write (Group 1: ki → ku)"),
    P("のみます→のむ","nomimasu - nomu","drink (Group 1: mi → mu)"),
    P("はなします→はなす","hanashimasu - hanasu","speak (Group 1: shi → su)"),
    P("かいます→かう","kaimasu - kau","buy (Group 1: i → u)"),
    P("まちます→まつ","machimasu - matsu","wait (Group 1: chi → tsu)"),
    P("かえります→かえる","kaerimasu - kaeru","go home (Group 1 imposter: looks like Group 2!)","Memorize the imposters: かえる, はいる, はしる, しる, きる (cut), いる (need), きる. Their te-forms go って, not て."),
    P("します→する","shimasu - suru","do (Group 3)"),
    P("きます→くる","kimasu - kuru","come (Group 3)")
  ]),
  S("Plain negative: ない-form","purple",[
    P("Dictionary form to ない-form","","Mnemonic: 'a' = 'a-ha, no!' - Group 1 swaps the final u for a. Exception: う-verbs become わ (かう → かわない).","Ready for ～ないでください and plain speech."),
    P("かく→かかない","kaku - kakanai","write - not write"),
    P("のむ→のまない","nomu - nomanai","drink - not drink"),
    P("かう→かわない","kau - kawanai","buy - not buy","う-verbs: u → wa, not a"),
    P("たべる→たべない","taberu - tabenai","eat - not eat"),
    P("みる→みない","miru - minai","see - not see"),
    P("する→しない","suru - shinai","do - not do"),
    P("くる→こない","kuru - konai","come - not come"),
    P("ある→ない","aru - nai","exist - not exist","The only verb that does not follow the pattern: ある → ない, not あらない.")
  ]),
  G("～ないでください - please don't","red",[
    P("ない-form + でください","nai-form + de kudasai","Please do not ___","Mnemonic: 'nai-de kudasai' = 'don't, please!' - nai and de glue together as one."),
    P("ここで たべないで ください。","Koko de tabenaide kudasai.","Please don't eat here."),
    P("しんぱいしないで ください。","Shinpai shinaide kudasai.","Please don't worry."),
    P("わすれないで ください。","Wasurenaide kudasai.","Please don't forget.")
  ]),
  G("～から - because (reason first)","blue",[
    P("Reason から、Result","Reason kara, Result","Because ___, ___","Mnemonic: Japanese puts the reason FIRST and 'kara' closes it like a door - opposite of English 'because'."),
    P("あついから、アイスを かいます。","Atsui kara, aisu wo kaimasu.","Because it's hot, I'll buy ice cream."),
    P("じかんが ありませんから、タクシーで いきます。","Jikan ga arimasen kara, takushii de ikimasu.","I have no time, so I'll take a taxi."),
    P("どうして すしを たべませんか。― さかなが きらいですから。","Doushite sushi wo tabemasen ka. - Sakana ga kirai desu kara.","Why don't you eat sushi? - Because I dislike fish.")
  ]),
  G("～が - but","blue",[
    P("Sentence 1 が、Sentence 2","Sentence 1 ga, Sentence 2","..., but ...","Careful: this が comes after です/ます, joining two full sentences. It is not the subject marker."),
    P("にほんごは むずかしいですが、おもしろいです。","Nihongo wa muzukashii desu ga, omoshiroi desu.","Japanese is difficult, but it's fun."),
    P("すしは すきですが、さしみは すきじゃないです。","Sushi wa suki desu ga, sashimi wa suki janai desu.","I like sushi, but I don't like sashimi."),
    P("たかいですが、おいしいです。","Takai desu ga, oishii desu.","It's expensive, but delicious.")
  ]),
  G("～まえに / ～あとで - before / after","blue",[
    P("Noun の まえに / あとで ・ Verb(dictionary) まえに","Noun no mae ni / ato de ・ Verb(dict) mae ni","Before ___ / After ___","Mnemonic: mae = 'front of the line' (earlier). ato = 'afterwards'. A verb before 'mae ni' stays in dictionary form."),
    P("ごはんの まえに てを あらいます。","Gohan no mae ni te wo araimasu.","I wash my hands before eating."),
    P("ねる まえに はを みがきます。","Neru mae ni ha wo migakimasu.","I brush my teeth before sleeping."),
    P("しごとの あとで のみに いきませんか。","Shigoto no ato de nomi ni ikimasen ka.","Shall we go for drinks after work?")
  ]),
  G("～に いきます - go in order to ___","blue",[
    P("Verb stem / Noun + に いきます","Verb stem / Noun + ni ikimasu","Go (somewhere) in order to ___","Mnemonic: drop ます from the verb. たべます → たべ + に いきます. Also works with come (きます) and return (かえります)."),
    P("ラーメンを たべに いきます。","Raamen wo tabe ni ikimasu.","I'm going to eat ramen."),
    P("かいものに いきます。","Kaimono ni ikimasu.","I'm going shopping.","noun + ni ikimasu works too"),
    P("えいがを みに いきませんか。","Eiga wo mi ni ikimasen ka.","Shall we go see a movie?"),
    P("にほんへ べんきょうしに きました。","Nihon e benkyou shi ni kimashita.","I came to Japan to study.")
  ]),
  G("Comparisons: より / のほうが / いちばん","blue",[
    P("A は B より ～ / A の ほうが ～ / ～で いちばん ～","A wa B yori ~ / A no hou ga ~ / ~ de ichiban ~","A is more ___ than B / A is more ___ / the most ___","Mnemonic: yori = 'than' (the lower one comes first). ichiban = 'number one'."),
    P("でんしゃは バスより はやいです。","Densha wa basu yori hayai desu.","The train is faster than the bus."),
    P("コーヒーと おちゃと どちらが すきですか。","Koohii to ocha to dochira ga suki desu ka.","Which do you like, coffee or tea?"),
    P("コーヒーの ほうが すきです。","Koohii no hou ga suki desu.","I like coffee more."),
    P("くだもので なにが いちばん すきですか。","Kudamono de nani ga ichiban suki desu ka.","Which fruit do you like best?")
  ]),
  G("～が ほしい - I want (a thing)","purple",[
    P("Noun が ほしいです","Noun ga hoshii desu","I want ___ (an object)","Mnemonic: Verb → ～たい. Thing → ほしい. ほしい is an i-adjective (ほしくない, ほしかった)."),
    P("あたらしい スマホが ほしいです。","Atarashii sumaho ga hoshii desu.","I want a new smartphone."),
    P("くるまは ほしくないです。","Kuruma wa hoshikunai desu.","I don't want a car."),
    P("なにが ほしいですか。","Nani ga hoshii desu ka.","What do you want?")
  ]),
  G("～が できます / じょうず / へた - ability","blue",[
    P("Noun が できます / じょうずです / へたです","Noun ga dekimasu / jouzu desu / heta desu","can do / good at / bad at","Mnemonic: 'ga' follows skills the same way it follows suki - these are 'states', not actions."),
    P("にほんごが すこし できます。","Nihongo ga sukoshi dekimasu.","I can do a little Japanese."),
    P("りょうりが じょうずです。","Ryouri ga jouzu desu.","I'm good at cooking."),
    P("スポーツは へたです。","Supootsu wa heta desu.","I'm bad at sports."),
    P("えいごが はなせますか。","Eigo ga hanasemasu ka.","Can you speak English?","hanaseru = 'can speak' - the potential form of hanasu")
  ]),
  G("Past of です - noun / な-adjective","blue",[
    P("です → でした / じゃありませんでした","desu - deshita / ja arimasen deshita","was / wasn't","Mnemonic: deshita = 'desu in the past'. Add ja arimasen for 'wasn't'."),
    P("きのうは あめでした。","Kinou wa ame deshita.","Yesterday was rainy."),
    P("しけんは かんたんじゃ ありませんでした。","Shiken wa kantan ja arimasen deshita.","The exam wasn't easy."),
    P("おとといは ひまでした。","Ototoi wa hima deshita.","I was free the day before yesterday.")
  ]),
  G("Adverbs: とても / あまり / ぜんぜん / すこし","blue",[
    P("とても＋positive ・ あまり/ぜんぜん＋negative","totemo + positive ・ amari/zenzen + negative","very / not very / not at all","Mnemonic: amari and zenzen are 'negative magnets' - they always pull a negative verb or adjective along."),
    P("この ラーメンは とても おいしいです。","Kono raamen wa totemo oishii desu.","This ramen is very delicious."),
    P("あまり たかくないです。","Amari takakunai desu.","It's not very expensive."),
    P("ぜんぜん わかりません。","Zenzen wakarimasen.","I don't understand at all."),
    P("もう たべました。まだ たべていません。","Mou tabemashita. Mada tabete imasen.","I already ate. I haven't eaten yet.","mou = already, mada = not yet")
  ]),
  INFO("Plain (casual) forms - why they matter at N5","amber",[
    IC("amber","You will READ plain forms even if you speak politely","N5 questions are mostly polite (ます/です), but friends' messages, diaries and many grammar patterns (～とき, ～まえに, ～たり, ～ほうがいい) are built on plain forms. Learn the 4-box table for verbs, adjectives and nouns."),
    IC("green","The 4 boxes","Present / Negative / Past / Past negative. Polite: たべます・たべません・たべました・たべませんでした. Plain: たべる・たべない・たべた・たべなかった.")
  ]),
  S("Verbs: polite vs plain (the 4 boxes)","purple",[
    P("たべます / たべる","tabemasu / taberu","eat (present)","Group 2: masu → ru"),
    P("たべません / たべない","tabemasen / tabenai","don't eat"),
    P("たべました / たべた","tabemashita / tabeta","ate","た-form = te-form with て→た"),
    P("たべませんでした / たべなかった","tabemasen deshita / tabenakatta","didn't eat","ない → なかった (it acts like an い-adjective)"),
    P("いきます / いく / いかない / いった / いかなかった","ikimasu / iku / ikanai / itta / ikanakatta","go: all forms","Exception: いって / いった"),
    P("のみます / のむ / のまない / のんだ / のまなかった","nomimasu / nomu / nomanai / nonda / nomanakatta","drink: all forms"),
    P("します / する / しない / した / しなかった","shimasu / suru / shinai / shita / shinakatta","do: all forms"),
    P("きます / くる / こない / きた / こなかった","kimasu / kuru / konai / kita / konakatta","come: all forms","Watch the vowel: く-る, こ-ない, き-た."),
    P("あります / ある / ない / あった / なかった","arimasu / aru / nai / atta / nakatta","exist (things): all forms")

  G("た-form (plain past)","purple",[
    P("Verb て-form → change て to た, で to だ","te → ta, de → da","Plain past: did ___","Mnemonic: if you know the te-form you already know the ta-form - just swap the last sound. かって→かった, のんで→のんだ."),
    P("きのう えいがを みた。","Kinou eiga wo mita.","I watched a movie yesterday. (casual)"),
    P("もう しゅくだいを した？","Mou shukudai wo shita?","Did you do your homework already? (casual)"),
    P("うちに かえった。","Uchi ni kaetta.","I went home. (casual)"),
    P("ともだちと ラーメンを たべた。","Tomodachi to raamen wo tabeta.","I ate ramen with a friend. (casual)"),
    P("どこへ いった？ ― こうえんへ いった。","Doko e itta? - Kouen e itta.","Where did you go? - I went to the park. (casual)")
  ]),
  S("Adjectives and nouns: plain forms","purple",[
    P("たかい / たかくない / たかかった / たかくなかった","takai / takakunai / takakatta / takakunakatta","い-adjective plain forms","Polite = add です to any of these."),
    P("しずかだ / しずかじゃない / しずかだった / しずかじゃなかった","shizuka da / shizuka janai / shizuka datta / shizuka janakatta","な-adjective plain forms","です becomes だ, でした becomes だった."),
    P("がくせいだ / がくせいじゃない / がくせいだった / がくせいじゃなかった","gakusei da / gakusei janai / gakusei datta / gakusei janakatta","noun plain forms","Same as な-adjectives."),
    P("きょうは あめだ。","Kyou wa ame da.","It's rainy today. (casual / written)"),
    P("きのうは ひまだった。","Kinou wa hima datta.","I was free yesterday. (casual)")
  ]),
  S("Polite vs casual - same sentence","blue",[
    P("あした なにを しますか。 / あした なにを する？","Ashita nani wo shimasu ka. / Ashita nani wo suru?","What will you do tomorrow?","Casual questions often drop か and just rise in tone."),
    P("にほんごは むずかしいです。 / にほんごは むずかしい。","Nihongo wa muzukashii desu. / Nihongo wa muzukashii.","Japanese is difficult."),
    P("いっしょに いきませんか。 / いっしょに いかない？","Issho ni ikimasen ka. / Issho ni ikanai?","Won't you go together?"),
    P("わかりました。 / わかった。","Wakarimashita. / Wakatta.","Got it.")
  ]),
  G("～たり～たりします - things like A and B","blue",[
    P("Verb た-form + り、Verb た-form + り します","Verb ta + ri, Verb ta + ri shimasu","do things like A and B (a sample, not the full list)","Mnemonic: たり = 'and stuff like that' for actions - the verb version of や. Always finish with します."),
    P("にちようびは そうじを したり、せんたくを したり します。","Nichiyoubi wa souji wo shitari, sentaku wo shitari shimasu.","On Sundays I do things like cleaning and laundry."),
    P("やすみの ひは えいがを みたり、ほんを よんだり します。","Yasumi no hi wa eiga wo mitari, hon wo yondari shimasu.","On days off I watch movies, read books and so on."),
    P("きのうは かいものを したり、ともだちに あったり しました。","Kinou wa kaimono wo shitari, tomodachi ni attari shimashita.","Yesterday I did things like shopping and meeting friends.","Tense goes on the final します only.")
  ]),
  G("～でしょう - probably","blue",[
    P("Plain form + でしょう (noun / な-adj: drop だ)","Plain + deshou","probably ___ / I think ___","Mnemonic: でしょう = the weather-forecast word. You will hear it in every N5 forecast question."),
    P("あしたは あめが ふるでしょう。","Ashita wa ame ga furu deshou.","It will probably rain tomorrow."),
    P("あしたは さむいでしょう。","Ashita wa samui deshou.","It will probably be cold tomorrow."),
    P("あの ひとは せんせいでしょう。","Ano hito wa sensei deshou.","That person is probably a teacher."),
    P("たなかさんも くるでしょう？","Tanaka-san mo kuru deshou?","Tanaka is coming too, right?","With rising tone, でしょう? asks for agreement.")
  ]),
  G("～なります - become","blue",[
    P("い-adj: ～く なります ・ な-adj / noun: ～に なります","i-adj: ~ku narimasu ・ na-adj / noun: ~ni narimasu","become ___","Mnemonic: い-adjectives turn い into く, everything else adds に - then なります."),
    P("さむく なりました。","Samuku narimashita.","It has become cold."),
    P("にほんごが じょうずに なりました。","Nihongo ga jouzu ni narimashita.","My Japanese has become good."),
    P("らいねん はたちに なります。","Rainen hatachi ni narimasu.","I will turn 20 next year.","はたち = 20 years old (special word)"),
    P("へやが きれいに なりました。","Heya ga kirei ni narimashita.","The room has become clean.")
  ]),
  G("～に します - decide on / I'll have","blue",[
    P("Noun + に します","Noun + ni shimasu","I'll go with ___ / I'll have ___","Mnemonic: なります = it becomes (by itself). します = I make it so (my choice)."),
    P("わたしは コーヒーに します。","Watashi wa koohii ni shimasu.","I'll have coffee."),
    P("どれに しますか。 ― これに します。","Dore ni shimasu ka. - Kore ni shimasu.","Which will you take? - I'll take this one."),
    P("しゅうまつに しましょう。","Shuumatsu ni shimashou.","Let's make it the weekend.")
  ]),
  G("～とき - when","blue",[
    P("Plain verb / い-adj / な-adj+な / noun+の + とき","Plain + toki","when ___ / at the time of ___","Mnemonic: とき literally means 'time'. Same connection rules as a noun: しずかな とき, こどもの とき."),
    P("ひまな とき、えいがを みます。","Hima na toki, eiga wo mimasu.","When I'm free, I watch movies."),
    P("こどもの とき、いぬが いました。","Kodomo no toki, inu ga imashita.","When I was a child, I had a dog."),
    P("さむい とき、コートを きます。","Samui toki, kooto wo kimasu.","When it's cold, I wear a coat."),
    P("でんしゃに のる とき、きっぷを かいます。","Densha ni noru toki, kippu wo kaimasu.","When I take the train, I buy a ticket.")
  ]),
  G("～ほうが いいです - you should","blue",[
    P("Verb た-form + ほうが いいです ・ ない-form + ほうが いいです","Verb ta + hou ga ii desu ・ nai + hou ga ii desu","you'd better ___ / you'd better not ___","Mnemonic: 'the side (ほう) of doing it is good'. Use た-form for 'should', ない-form for 'shouldn't'."),
    P("くすりを のんだ ほうが いいです。","Kusuri wo nonda hou ga ii desu.","You should take medicine."),
    P("はやく ねた ほうが いいですよ。","Hayaku neta hou ga ii desu yo.","You'd better go to bed early."),
    P("あまり たべない ほうが いいです。","Amari tabenai hou ga ii desu.","You'd better not eat too much."),
    P("かさを もって いった ほうが いいです。","Kasa wo motte itta hou ga ii desu.","You should take an umbrella.")
  ]),
  G("～てから - after doing (and then)","purple",[
    P("Verb て-form + から","Verb te + kara","after doing A, (then) B","Mnemonic: て + から = 'from the point of having done it'. Stronger order than just て."),
    P("てを あらってから、たべます。","Te wo aratte kara, tabemasu.","I eat after washing my hands."),
    P("しゅくだいを してから、あそびます。","Shukudai wo shite kara, asobimasu.","I'll play after doing my homework."),
    P("にほんへ きてから、すしが すきに なりました。","Nihon e kite kara, sushi ga suki ni narimashita.","Since coming to Japan, I've come to like sushi.")
  ]),
  G("Linking adjectives: ～くて / ～で","purple",[
    P("い-adj: drop い + くて ・ な-adj / noun + で","i-adj: ~kute ・ na-adj / noun: ~de","___ and ___ (joining descriptions)","Mnemonic: くて = the い-adjective te-form. いい → よくて (exception)."),
    P("この へやは ひろくて、あかるいです。","Kono heya wa hirokute, akarui desu.","This room is spacious and bright."),
    P("あの みせは やすくて、おいしいです。","Ano mise wa yasukute, oishii desu.","That shop is cheap and delicious."),
    P("この まちは しずかで、きれいです。","Kono machi wa shizuka de, kirei desu.","This town is quiet and pretty."),
    P("たなかさんは がくせいで、にじゅうさいです。","Tanaka-san wa gakusei de, nijuusai desu.","Tanaka is a student and 20 years old.")
  ]),
  G("だけ / しか～ない - only","blue",[
    P("Noun + だけ ・ Noun + しか + negative","Noun + dake ・ Noun + shika + negative","only ___ (neutral) / only ___ (and that's not enough)","Mnemonic: しか ALWAYS needs a negative verb - 'nothing except'. だけ is neutral."),
    P("ひらがなだけ わかります。","Hiragana dake wakarimasu.","I understand only hiragana."),
    P("ひらがなしか わかりません。","Hiragana shika wakarimasen.","I understand nothing but hiragana.","Same meaning, but sounds like 'only, unfortunately'."),

    P("ひとりだけ きました。","Hitori dake kimashita.","Only one person came.")

  G("Asking how many: なん + counter","amber",[
    P("なん + counter / いくつ / いくら","nan + counter / ikutsu / ikura","how many ___ / how many (things) / how much (money)","Mnemonic: swap the number for なん. 3まい → なんまい. People is the exception: なんにん."),
    P("かぞくは なんにんですか。","Kazoku wa nannin desu ka.","How many people are in your family?"),
    P("きっぷを なんまい かいますか。","Kippu wo nanmai kaimasu ka.","How many tickets will you buy?"),
    P("ビールを なんぼん のみましたか。","Biiru wo nanbon nomimashita ka.","How many bottles of beer did you drink?","ほん → なんぼん (sound change)"),
    P("いま なんじですか。","Ima nanji desu ka.","What time is it now?"),
    P("なんさいですか。","Nansai desu ka.","How old are you?")

]},
{id:"sentencelab",tab:"Sentence Lab",title:"Sentence Lab",sub:"Reusable sentence templates. Swap the underlined idea and you can say hundreds of sentences.",sections:[
  INFO("How to practice","green",[
    IC("green","The swap method","Say the template aloud, then replace ONE word at a time using the swap words below. Do 5 swaps per template. Then try the Builder tab to arrange words under pressure."),
    IC("amber","Why templates work","Japanese sentences are made of a few reusable frames. N5 is mostly about knowing about 25 frames and ~800 words.")
  ]),
  S("Template 1: A は B です (A is B)","blue",[
    P("わたしは ドノバンです。","Watashi wa Donoban desu.","I am Donovan.","Swap: アメリカじん, がくせい, かいしゃいん (office worker)"),
    P("これは ほんです。","Kore wa hon desu.","This is a book.","Swap: かさ, かばん, さいふ, とけい"),
    P("あれは えきです。","Are wa eki desu.","That is a station.","Swap: ホテル, ぎんこう, びょういん"),
    P("きょうは すいようびです。","Kyou wa suiyoubi desu.","Today is Wednesday.","Swap: げつようび, きんようび, にちようび")
  ]),
  S("Template 2: Noun を Verb (do something to something)","blue",[
    P("パンを たべます。","Pan wo tabemasu.","I eat bread.","Swap: ごはん, さかな, くだもの"),
    P("おちゃを のみます。","Ocha wo nomimasu.","I drink tea.","Swap: みず, コーヒー, ジュース"),
    P("テレビを みます。","Terebi wo mimasu.","I watch TV.","Swap: えいが, アニメ, サッカー"),
    P("ほんを よみます。","Hon wo yomimasu.","I read a book.","Swap: しんぶん, ざっし, てがみ"),
    P("おんがくを ききます。","Ongaku wo kikimasu.","I listen to music.","Swap: ラジオ, ニュース")
  ]),
  S("Template 3: Place に いきます / きます / かえります","blue",[
    P("がっこうに いきます。","Gakkou ni ikimasu.","I go to school.","Swap: かいしゃ, えき, びょういん, ぎんこう"),
    P("にほんに きました。","Nihon ni kimashita.","I came to Japan.","Swap: とうきょう, おおさか, きょうと"),
    P("うちに かえります。","Uchi ni kaerimasu.","I return home.","Swap: ホテル, くに (home country)"),
    P("あしたの あさ ろくじに おきます。","Ashita no asa rokuji ni okimasu.","I will wake up at 6 tomorrow morning.","Swap time: しちじ, はちじ")
  ]),
  S("Template 4: Place で Noun を Verb (do something somewhere)","blue",[
    P("レストランで ごはんを たべます。","Resutoran de gohan wo tabemasu.","I eat a meal at a restaurant.","Swap: カフェ, うち, えき"),
    P("コンビニで みずを かいます。","Konbini de mizu wo kaimasu.","I buy water at a convenience store.","Swap: ドンキ, スーパー"),
    P("としょかんで べんきょうします。","Toshokan de benkyou shimasu.","I study at the library.","Swap: カフェ, へや, がっこう"),
    P("ともだちと こうえんで あそびました。","Tomodachi to kouen de asobimashita.","I played with a friend at the park.")
  ]),
  S("Template 5: Noun は Adjective です","blue",[
    P("この ラーメンは おいしいです。","Kono raamen wa oishii desu.","This ramen is delicious.","Swap: たかい, やすい, からい, あまい"),
    P("にほんは きれいです。","Nihon wa kirei desu.","Japan is beautiful.","Swap: ゆうめい, しずか, にぎやか"),
    P("きょうは さむいです。","Kyou wa samui desu.","Today is cold.","Swap: あつい, あたたかい, すずしい"),
    P("にほんごは むずかしいですが、たのしいです。","Nihongo wa muzukashii desu ga, tanoshii desu.","Japanese is difficult, but fun.")
  ]),

    P("すしを たべたいです。","Sushi wo tabetai desu.","I want to eat sushi."),

    P("いっしょに のみに いきませんか。","Issho ni nomi ni ikimasen ka.","Won't you go for a drink together?"),
    P("しゃしんを とっても いいですか。","Shashin wo totte mo ii desu ka.","May I take a photo?")
  ]),
  S("Template 7: Question frames","amber",[
    P("なにを たべたいですか。","Nani wo tabetai desu ka.","What do you want to eat?"),
    P("どこで かいましたか。","Doko de kaimashita ka.","Where did you buy it?"),
    P("いつ にほんに きましたか。","Itsu Nihon ni kimashita ka.","When did you come to Japan?"),
    P("だれと いきますか。","Dare to ikimasu ka.","Who are you going with?"),
    P("どうやって いきますか。","Dou yatte ikimasu ka.","How do you get there?"),
    P("どうして にほんごを べんきょうしますか。","Doushite Nihongo wo benkyou shimasu ka.","Why do you study Japanese?")
  ]),
  S("Connecting sentences","purple",[

    P("でも","demo","but (starts a sentence)"),
    P("だから","dakara","so / therefore"),
    P("それから","sorekara","after that"),
    P("あさ おきて、シャワーを あびて、ごはんを たべます。","Asa okite, shawaa wo abite, gohan wo tabemasu.","I wake up, take a shower, and eat.","Chain verbs with te-form. Only the LAST verb carries the tense."),
    P("きのう えいがを みて、ラーメンを たべました。","Kinou eiga wo mite, raamen wo tabemashita.","Yesterday I watched a movie and ate ramen.")
  ])
]},

  S("Look-alike pairs - memory tricks","purple",[
    P("し / つ","shi / tsu","hiragana: shi vs tsu","し: a fishhook drops straight down. つ: a wave rolling flat to the right."),
    P("ぬ / め","nu / me","hiragana: nu vs me","ぬ: ends with a looping noodle (nu = noodle). め: eye - no loop."),
    P("わ / れ / ね","wa / re / ne","hiragana: wa vs re vs ne","れ and ね both have a long leg; ね ends in a loop (like a cat's tail = ne-ko). わ kicks to the right."),
    P("る / ろ","ru / ro","hiragana: ru vs ro","る ends in a loop (ru = rope loop). ろ is open."),
    P("は / ほ","ha / ho","hiragana: ha vs ho","ほ has an extra line = hotel (ho) with an extra floor."),
    P("さ / き","sa / ki","hiragana: sa vs ki","き looks like a key (ki). さ looks like a saw (sa)."),
    P("あ / お","a / o","hiragana: a vs o","お has an extra dot, like the 'o' having a baby."),
    P("ソ / ン","so / n","katakana: so vs n","ソ: both short strokes slant top-to-bottom, like stitches going down (so = sew). ン: the dot is short and the long stroke sweeps UP from the bottom."),
    P("シ / ツ","shi / tsu","katakana: shi vs tsu","シ: the two dots sit side by side and the long stroke sweeps up - a sideways smile. ツ: the dots stand on top and the long stroke falls down."),
    P("ク / ケ / タ","ku / ke / ta","katakana: ku vs ke vs ta","ク is a chevron hat. ケ adds a hook to the hat. タ has a tail."),
    P("ウ / ワ / フ","u / wa / fu","katakana: u vs wa vs fu","ウ has a roof like Utah. ワ is a flat-topped wall. フ is a bent hook."),
    P("ノ / メ / ヌ / ス","no / me / nu / su","katakana: no vs me vs nu vs su","ノ is a single slash. メ crosses it. ヌ adds a flag. ス adds a hook."),
    P("チ / テ / ナ","chi / te / na","katakana: chi vs te vs na","チ: a chair with the top line. テ: a tee on a golf course. ナ: a cross with the arm bent.")
  ])
]},

// ── N5 focus: trim travel-only content, reorder, retitle ──────────
(function n5Focus(){
  const byId={};units.forEach(u=>{byId[u.id]=u;});
  // keep the clock-time lessons from the old Hotel tab (they are N5 content)
  if(byId.hotel && byId.frequency){
    const clock=byId.hotel.sections.filter(s=>/^Time hours|^Time of day/.test(s.title));
    byId.frequency.sections=clock.concat(byId.frequency.sections);
  }
  const dropSections={
    restaurant:["Advanced phrases"],
    transport:["Transport manners and tips","Eating on trains","How to take a bus","IC Card - Welcome Suica","JR East Rail Passes"],
    shopping:["Gift wrapping and bags"],
    conversations:["Situational dialogue - Talking about the Japan trip"]
  };
  Object.keys(dropSections).forEach(id=>{
    if(byId[id])byId[id].sections=byId[id].sections.filter(s=>dropSections[id].indexOf(s.title)===-1);
  });
  if(byId.fillers){
    const keep=["Agreement and understanding","Showing you are listening - aizuchi","Buying time and thinking","Positive reactions and encouragement"];
    byId.fillers.sections=byId.fillers.sections.filter(s=>keep.indexOf(s.title)>=0);
  }
  if(byId.shopping){
    byId.shopping.sections.forEach(s=>{if(s.phrases)s.phrases=s.phrases.filter(p=>!/ドンキ|めんぜい/.test(p.jp));});
  }
  if(byId.frequency){
    byId.frequency.sections.forEach(s=>{(s.phrases||[]).forEach(p=>{if(p.en)p.en=p.en.replace(" - Donovan trip month!","");});});
  }
  if(byId.kanji){
    const bad=["京","都","泊","降","着","乗","達","道","使","待","知","短"];
    byId.kanji.sections.forEach(s=>{s.phrases=(s.phrases||[]).filter(p=>bad.indexOf(p.jp)===-1);});
    byId.kanji.sections=byId.kanji.sections.filter(s=>s.phrases.length);
    byId.kanji.sections.forEach(s=>{if(/^Common verbs II/.test(s.title))s.title="Common verbs II";});
    const v2=byId.kanji.sections.find(s=>s.title==="Common verbs II");
    if(v2){v2.phrases.push({jp:"会",rom:"au",en:"meet"},{jp:"立",rom:"tatsu",en:"stand"});}
    const pl=byId.kanji.sections.find(s=>/^Places/.test(s.title));
    if(pl){pl.phrases.push({jp:"社",rom:"sha",en:"company / shrine"},{jp:"道",rom:"michi",en:"road / way"});}
    byId.kanji.sections.forEach(s=>(s.phrases||[]).forEach(p=>{if("曜朝昼夜私家早海".indexOf(p.jp)>=0&&p.jp.length===1)p.note=(p.note?p.note+" · ":"")+"Bonus: usually listed at N4, but you will see it everywhere";}));
    const na=byId.kanji.sections.find(s=>/^Nature/.test(s.title));
    if(na){na.phrases.push({jp:"魚",rom:"sakana",en:"fish"});}
  }
  if(byId.numbers){
    const nu=byId.numbers;
    const first=nu.sections.find(s=>/^1 through 10/.test(s.title));
    if(first){first.title="0 to 10 - memorize these first";first.phrases.unshift(P("ぜろ / れい","zero / rei","0","zero is the loanword, rei is the reading you hear in phone numbers and math."));}
    const idx=nu.sections.findIndex(s=>s.title==="Bigger numbers");
    const rest=[
      INFO("The number system in one look","green",[
        IC("green","Build, do not memorize","After 10 you never learn new words - you stack them. 11 = ten + one (じゅういち). 20 = two + ten (にじゅう). 34 = three-ten + four (さんじゅうよん). 100 = ひゃく, 1000 = せん, 10000 = まん."),
        IC("amber","The 3 / 6 / 8 trap","In hundreds and thousands, the numbers 3, 6 and 8 change sound: さんびゃく (300), ろっぴゃく (600), はっぴゃく (800), さんぜん (3000), はっせん (8000). Mnemonic: 3, 6, 8 are the 'wobbly' numbers - say them aloud until they feel natural.")
